<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI HUB</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.login-view{flex:1;display:flex;align-items:center;justify-content:center}
.login-box{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:32px;width:300px}
.login-box h2{color:var(--accent);margin-bottom:18px;font-size:18px}
.login-box input{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:10px;border-radius:6px;margin-bottom:10px;font-size:13px}
.login-box button{width:100%;background:var(--accent);color:#001018;border:none;border-radius:6px;padding:10px;font-weight:700;cursor:pointer;margin-top:4px}
.login-box .sub{background:transparent;color:var(--muted);border:1px solid var(--border);margin-top:8px}
.login-msg{font-size:12px;margin-top:8px;min-height:16px}
.app-item{display:flex;align-items:center;justify-content:space-between;border-radius:8px;padding:0 4px 0 0}
.app-item .nav-item{flex:1}
.app-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:4px 8px;border-radius:6px}
.app-del:hover{color:var(--danger);background:rgba(255,71,87,.1)}
:root{
  --bg:#0a0e14; --panel:#10161f; --panel2:#151d29; --border:#1e2937;
  --accent:#00e5ff; --accent2:#ff2ec4; --text:#dbe6f0; --muted:#5f7285;
  --danger:#ff4757; --ok:#2ed573;
  font-family: 'Segoe UI', system-ui, sans-serif;
}
body.light{
  --bg:#f4f6f9; --panel:#ffffff; --panel2:#eef1f5; --border:#dbe2ea;
  --accent:#0091ab; --text:#1c2733; --muted:#6b7684;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);height:100vh;display:flex;overflow:hidden;transition:background .2s,color .2s}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* Sidebar */
#sidebar{width:min(220px, 22vw);min-width:180px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px 10px;transition:width .2s,min-width .2s,padding .2s;flex-shrink:0}
#sidebar.collapsed{width:56px;min-width:56px;padding:16px 6px}
#sidebar.collapsed .logo,#sidebar.collapsed .nav-item span:last-child,#sidebar.collapsed .app-dot + span,#sidebar.collapsed .add-btn span:last-child,#sidebar.collapsed .app-del{display:none}
#sidebar.collapsed .nav-item{justify-content:center}
#sidebar.collapsed .app-item{justify-content:center}
#sidebar.collapsed .add-btn{font-size:16px}
.logo{font-size:16px;font-weight:700;letter-spacing:2px;color:var(--accent);text-shadow:0 0 8px rgba(0,229,255,.5);padding:6px 10px 20px;white-space:nowrap;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:8px}
#collapse-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:2px 6px;border-radius:6px;flex-shrink:0}
#collapse-btn:hover{color:var(--accent);background:var(--panel2)}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--muted);transition:.15s;white-space:nowrap;overflow:hidden}
.nav-item:hover{background:var(--panel2);color:var(--text)}
.nav-item.active{background:rgba(0,229,255,.08);color:var(--accent);border:1px solid rgba(0,229,255,.3)}
.app-list{margin-top:14px;display:flex;flex-direction:column;gap:6px;flex:1;overflow-y:auto}
.app-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.add-btn{margin-top:10px;padding:10px;border:1px dashed var(--border);border-radius:8px;text-align:center;color:var(--muted);cursor:pointer;font-size:12px;white-space:nowrap;overflow:hidden}
.add-btn:hover{border-color:var(--accent);color:var(--accent)}
.notif-toggle{margin-top:14px;padding:10px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);display:flex;align-items:center;justify-content:space-between}

/* Main */
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#topbar{height:52px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 4vw;background:var(--panel);gap:10px}
#topbar .title{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mobile-menu-btn{display:none;background:none;border:none;color:var(--text);font-size:20px;cursor:pointer}

/* スマホ・タブレット対応 */
@media (max-width: 860px){
  #sidebar{position:fixed;inset:0 auto 0 0;z-index:40;width:min(78vw,260px);min-width:0;transform:translateX(-100%);box-shadow:0 0 24px rgba(0,0,0,.4)}
  #sidebar.mobile-open{transform:translateX(0)}
  #sidebar.collapsed{width:min(78vw,260px);padding:16px 10px}
  #sidebar.collapsed .logo,#sidebar.collapsed .nav-item span:last-child,#sidebar.collapsed .add-btn span:last-child,#sidebar.collapsed .app-del{display:flex}
  #sidebar.collapsed .nav-item{justify-content:flex-start}
  #collapse-btn{display:none}
  #mobile-menu-btn{display:block}
  #sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30}
  #sidebar-overlay.show{display:block}
  .msg-wrap{max-width:88%}
  .modal{width:92vw}
  #topbar{padding:0 3vw}
}

#chat-view{flex:1;display:flex;flex-direction:column;min-height:0}
#messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:70%;padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.6;white-space:pre-wrap}
.msg.user{align-self:flex-end;background:rgba(0,229,255,.12);border:1px solid rgba(0,229,255,.3)}
.msg.ai{align-self:flex-start;background:var(--panel2);border:1px solid var(--border)}
.msg.err{align-self:flex-start;background:rgba(255,71,87,.1);border:1px solid var(--danger);color:var(--danger)}
.msg-wrap{display:flex;flex-direction:column;max-width:70%}
.msg-wrap.user{align-self:flex-end;align-items:flex-end}
.msg-wrap.ai{align-self:flex-start;align-items:flex-start}
.msg-actions{display:flex;gap:4px;margin-top:3px}
.msg-actions button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:11px;padding:2px 5px;border-radius:4px}
.msg-actions button:hover{color:var(--accent);background:var(--panel2)}
.edit-box{width:100%}
.edit-box textarea{width:100%;background:var(--panel2);border:1px solid var(--accent);border-radius:8px;color:var(--text);padding:8px;font-size:13px;resize:vertical;min-height:44px}
.edit-box .row{margin-top:4px;justify-content:flex-end}
#typing-indicator{color:var(--muted);font-style:italic}
#input-bar{display:flex;gap:8px;padding:14px;border-top:1px solid var(--border);background:var(--panel)}
#input-bar textarea{flex:1;resize:none;background:var(--panel2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:10px;font-size:13px;height:44px}
#input-bar button{background:var(--accent);color:#001018;border:none;border-radius:8px;padding:0 18px;font-weight:700;cursor:pointer}
#input-bar button:disabled{opacity:.4;cursor:not-allowed}
#empty-state{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;flex-direction:column;gap:10px}

/* Panels: accounts / history */
.panel-view{flex:1;overflow-y:auto;padding:20px}
.card{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px}
.card h4{font-size:13px;margin-bottom:4px}
.card p{font-size:11px;color:var(--muted);margin-bottom:8px}
.row{display:flex;gap:8px;align-items:center}
.card input{flex:1;background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 8px;font-size:12px}
.btn-sm{background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:6px;padding:6px 10px;font-size:11px;cursor:pointer}
.btn-sm:hover{background:rgba(0,229,255,.1)}
.btn-danger{border-color:var(--danger);color:var(--danger)}

/* History */
#history-search{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:8px;font-size:12px;margin-bottom:12px}
.hist-item{padding:10px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;cursor:pointer;font-size:12px}
.hist-item:hover{border-color:var(--accent)}
.hist-item .t{font-weight:600;margin-bottom:2px}
.hist-item .m{color:var(--muted);font-size:11px}

/* Modal / wizard */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50}
.overlay.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:22px;width:380px;max-height:88vh;overflow-y:auto}
.modal h3{font-size:15px;margin-bottom:4px;color:var(--accent)}
.step-indicator{display:flex;gap:6px;margin-bottom:16px}
.step-indicator span{flex:1;height:3px;border-radius:2px;background:var(--border)}
.step-indicator span.done{background:var(--accent)}
.field{margin-bottom:12px}
.field label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px}
.field input,.field select{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:6px;font-size:12px}
.modal-actions{display:flex;gap:8px;margin-top:16px;justify-content:space-between}
.hint{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.6}
.provider-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.provider-card{border:1px solid var(--border);border-radius:8px;padding:12px 10px;text-align:center;cursor:pointer;font-size:12px}
.provider-card:hover{border-color:var(--accent)}
.provider-card.sel{border-color:var(--accent);background:rgba(0,229,255,.08);color:var(--accent)}
.step-title{font-size:12px;font-weight:600;margin-bottom:8px;color:var(--text)}
.validate-row{display:flex;gap:8px;align-items:center;margin-top:6px}
.status-badge{font-size:11px;padding:4px 8px;border-radius:6px}
.status-badge.ok{background:rgba(46,213,115,.12);color:var(--ok);border:1px solid var(--ok)}
.status-badge.err{background:rgba(255,71,87,.12);color:var(--danger);border:1px solid var(--danger)}
.status-badge.checking{background:rgba(0,229,255,.1);color:var(--accent);border:1px solid var(--accent)}
.link-btn{display:inline-block;background:var(--panel2);border:1px solid var(--accent);color:var(--accent);padding:8px 12px;border-radius:8px;font-size:12px;text-decoration:none;margin-top:4px}
.link-btn:hover{background:rgba(0,229,255,.1)}
.numbered{list-style:none;counter-reset:step;margin:8px 0}
.numbered li{counter-increment:step;padding-left:22px;position:relative;font-size:11px;color:var(--muted);margin-bottom:6px;line-height:1.5}
.numbered li::before{content:counter(step);position:absolute;left:0;top:0;width:16px;height:16px;border-radius:50%;background:var(--panel2);border:1px solid var(--accent);color:var(--accent);font-size:10px;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>

<div class="login-view" id="login-view">
  <div class="login-box">
    <h2>AI HUB ログイン</h2>
    <input id="l-email" type="email" placeholder="メールアドレス">
    <input id="l-pass" type="password" placeholder="パスワード">
    <button id="l-signin">ログイン</button>
    <button id="l-signup" class="sub">新規登録</button>
    <div class="login-msg" id="l-msg"></div>
  </div>
</div>

<div id="sidebar-overlay"></div>
<div id="sidebar" style="display:none">
  <div class="logo"><span>AI HUB</span><button id="collapse-btn" title="折りたたむ">⏴</button></div>
  <div class="nav-item active" data-nav="chat"><span>💬</span>チャット</div>
  <div class="nav-item" data-nav="accounts"><span>🔑</span>アカウント</div>
  <div class="nav-item" data-nav="history"><span>🕓</span>履歴</div>
  <div class="nav-item" data-nav="settings"><span>⚙</span>設定</div>
  <div class="app-list" id="app-list"></div>
  <div class="add-btn" id="add-app-btn">+ アプリを追加 (<span id="app-count">0</span>/15)</div>
</div>

<div id="main" style="display:none">
  <div id="topbar">
    <button id="mobile-menu-btn">☰</button>
    <span class="title" id="view-title">チャット</span>
    <button class="btn-sm" id="new-conv-btn" style="display:none">＋ 新規作成</button>
  </div>

  <div id="chat-view" style="display:none">
    <div id="messages"></div>
    <div id="input-bar">
      <textarea id="input" placeholder="メッセージを入力 (Shift+Enterで改行)"></textarea>
      <button id="send-btn">送信</button>
    </div>
  </div>

  <div id="empty-state">
    <div>まだアプリが登録されていません</div>
    <div class="btn-sm" id="empty-add-btn">アプリを追加</div>
  </div>

  <div id="accounts-view" class="panel-view" style="display:none"></div>
  <div id="history-view" class="panel-view" style="display:none">
    <input id="history-search" placeholder="履歴を検索...">
    <div id="history-list"></div>
  </div>
  <div id="settings-view" class="panel-view" style="display:none">
    <div class="card">
      <h4>テーマ</h4>
      <p>画面の配色を切り替えます</p>
      <div class="row">
        <button class="btn-sm" id="theme-dark">ダークモード</button>
        <button class="btn-sm" id="theme-light">ホワイトモード</button>
      </div>
    </div>
    <div class="card">
      <h4>通知</h4>
      <p>他のタブを見ている間にAIから応答が来たら通知します</p>
      <div class="row">
        <label style="display:flex;align-items:center;gap:8px;font-size:12px">
          <input type="checkbox" id="notif-check"> 通知を有効にする
        </label>
      </div>
    </div>
    <div class="card">
      <h4>アカウント</h4>
      <p id="login-email"></p>
      <button class="btn-sm btn-danger" id="logout-btn">ログアウト</button>
    </div>
  </div>
</div>

<div class="overlay" id="app-modal">
  <div class="modal">
    <h3>アプリを追加</h3>
    <div class="step-indicator"><span id="si-1"></span><span id="si-2"></span><span id="si-3"></span></div>

    <!-- STEP 1: provider select -->
    <div id="step-1">
      <div class="step-title">1. どのAIを追加しますか?</div>
      <div class="provider-grid" id="provider-grid"></div>
    </div>

    <!-- STEP 2: guided key acquisition + validation -->
    <div id="step-2" style="display:none">
      <div class="step-title">2. APIキーを取得して貼り付け</div>
      <div class="field" id="custom-preset-field" style="display:none">
        <label>よく使われるAIから選ぶ</label>
        <select id="custom-preset">
          <option value="">-- 選択してください --</option>
        </select>
      </div>
      <ol class="numbered" id="step2-instructions"></ol>
      <div class="hint" id="free-note" style="display:none;margin-bottom:8px"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <a href="#" target="_blank" class="link-btn" id="open-key-page">キー取得ページを開く ↗</a>
        <a href="#" target="_blank" class="link-btn" id="open-video-search">📺 公式動画を探す ↗</a>
      </div>
      <div class="field" style="margin-top:12px">
        <label>表示名</label>
        <input id="m-name" placeholder="例: Gemini">
      </div>
      <div class="field" id="m-endpoint-field" style="display:none">
        <label>エンドポイントURL</label>
        <input id="m-endpoint" placeholder="https://api.example.com/v1/chat/completions">
      </div>
      <div class="field">
        <label>APIキー</label>
        <input id="m-key" type="password" placeholder="ここに貼り付け">
        <div class="hint" style="margin-top:4px">貼り付けるだけで、使えるキーかどうか自動で確認します。</div>
        <div class="validate-row">
          <button class="btn-sm" id="paste-btn">📋 クリップボードから貼り付け</button>
        </div>
        <div id="validate-status" style="margin-top:6px"></div>
      </div>
    </div>

    <!-- STEP 3: model select -->
    <div id="step-3" style="display:none">
      <div class="step-title">3. モデルを選択</div>
      <div class="field">
        <select id="m-model"></select>
      </div>
      <div class="hint">迷ったら一番上（推奨）のままでOKです。</div>
    </div>

    <div class="modal-actions">
      <button class="btn-sm btn-danger" id="m-cancel">キャンセル</button>
      <div style="display:flex;gap:8px">
        <button class="btn-sm" id="m-back" style="display:none">戻る</button>
        <button class="btn-sm" id="m-next">次へ</button>
        <button class="btn-sm" id="m-save" style="display:none">保存</button>
      </div>
    </div>
  </div>
</div>

<script>
const COLORS=['#00e5ff','#ff2ec4','#2ed573','#ffa502','#a55eea'];

const PROVIDERS = {
  gemini:{
    label:'Gemini', keyPageUrl:'https://aistudio.google.com/apikey',
    freeNote:'無料枠あり・クレジットカード登録不要で発行できます。',
    steps:['「キー取得ページを開く」をクリック','Googleアカウントでログイン','「Create API key」をクリック','表示されたキーをコピーして下の欄に貼り付け'],
    defaultModels:[{id:'gemini-flash-latest',label:'gemini-flash-latest (推奨・自動で最新版)'},{id:'gemini-pro-latest',label:'gemini-pro-latest (高精度・自動で最新版)'},{id:'gemini-3.6-flash',label:'gemini-3.6-flash (固定バージョン)'}],
    needsEndpoint:false,
    validate: async (key)=>{
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
      if(!res.ok){
        if(res.status===400) throw new Error('キーの形式が正しくありません。コピーし直してください');
        if(res.status===403) throw new Error('キーが無効、または権限がありません。AI Studioで再発行してください');
        throw new Error('確認できませんでした(通信エラー)');
      }
      return true;
    }
  },
  openai:{
    label:'ChatGPT', keyPageUrl:'https://platform.openai.com/api-keys',
    freeNote:'新規アカウントは少額の無料クレジットが付く場合があります。切れると支払い設定(クレカ登録)が必要です。',
    steps:['「キー取得ページを開く」をクリック','OpenAIアカウントでログイン(未登録なら新規作成)','「Create new secret key」をクリック','表示されたキーをコピーして下の欄に貼り付け(1度しか表示されません)'],
    defaultModels:[{id:'gpt-4o-mini',label:'gpt-4o-mini (推奨・低コスト)'},{id:'gpt-4o',label:'gpt-4o (高精度)'}],
    needsEndpoint:false,
    validate: async (key)=>{
      const res = await fetch('https://api.openai.com/v1/models', {headers:{'Authorization':'Bearer '+key}});
      if(!res.ok){
        if(res.status===401) throw new Error('キーが無効です。コピーし直してください');
        if(res.status===429) throw new Error('支払い設定(クレカ登録)が未完了の可能性があります。platform.openai.comのBillingを確認してください');
        throw new Error('確認できませんでした(ブラウザからの検証がブロックされた可能性があります)');
      }
      return true;
    }
  },
  claude:{
    label:'Claude', keyPageUrl:'https://console.anthropic.com/settings/keys',
    freeNote:'利用には電話番号認証と少額のクレジット購入が必要な場合があります。',
    steps:['「キー取得ページを開く」をクリック','Anthropicアカウントでログイン(電話番号認証が必要な場合あり)','「Create Key」をクリック','表示されたキーをコピーして下の欄に貼り付け'],
    defaultModels:[{id:'claude-sonnet-4-5',label:'claude-sonnet-4-5 (推奨)'},{id:'claude-opus-4-1',label:'claude-opus-4-1 (高精度)'}],
    needsEndpoint:false,
    validate: async (key)=>{
      const res = await fetch('https://api.anthropic.com/v1/models', {headers:{'x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'}});
      if(!res.ok){
        if(res.status===401) throw new Error('キーが無効です。コピーし直してください');
        if(res.status===400) throw new Error('クレジット残高が不足している可能性があります。consoleで購入してください');
        throw new Error('確認できませんでした(ブラウザからの検証がブロックされた可能性があります)');
      }
      return true;
    }
  },
  copilot:{
    label:'Copilot', keyPageUrl:'https://copilot.microsoft.com',
    steps:['Copilotは個人向け公開APIがありません','このアプリからはチャットできません','「アカウント」タブからログイン画面のみ開けます'],
    defaultModels:[], needsEndpoint:false, noKey:true,
    validate: async ()=>true
  },
  grok:{
    label:'Grok', keyPageUrl:'https://console.x.ai',
    freeNote:'Xアカウントでログイン。無料枠は少なく、基本は有料クレジット購入が必要です。',

    el.classList.toggle('active', el.dataset.nav===view);
  });
  document.getElementById('chat-view').style.display='none';

  document.getElementById('history-view').style.display='none';
  document.getElementById('settings-view').style.display='none';
  document.getElementById('empty-state').style.display='none';
  document.getElementById('new-conv-btn').style.display='none';

  if(view==='chat'){
    if(!activeAppId && apps.length) activeAppId=apps[0].id;
    if(!activeAppId){ document.getElementById('empty-state').style.display='flex'; document.getElementById('view-title').textContent='チャット'; renderAppList(); return; }
    document.getElementById('chat-view').style.display='flex';
    document.getElementById('new-conv-btn').style.display='inline-block';
    const app = apps.find(a=>a.id===activeAppId);
    document.getElementById('view-title').textContent = app.name;
    // このAIの会話一覧の中に今のactiveConvIdが無ければ、最新の会話を自動選択する
    const appConvs = convs.filter(c=>c.appId===activeAppId);
    if(!appConvs.some(c=>c.id===activeConvId)){
      activeConvId = appConvs.length ? appConvs.sort((a,b)=>b.updatedAt-a.updatedAt)[0].id : null;
    }
    renderMessages();
  } else if(view==='accounts'){
    document.getElementById('accounts-view').style.display='block';

    renderAccounts();
  } else if(view==='history'){
    document.getElementById('history-view').style.display='block';

    renderHistory();
  } else if(view==='settings'){
    document.getElementById('settings-view').style.display='block';

  }
  renderAppList();
}

// ---------- Chat ----------
function currentConv(){
  return convs.find(c=>c.id===activeConvId && c.appId===activeAppId);
}
function ensureConv(){
  let c = currentConv();
  if(!c){
    c = { id:'conv_'+Date.now(), appId:activeAppId, title:'新規会話', messages:[], updatedAt:Date.now() };
    convs.unshift(c);
    activeConvId = c.id;
  }
  return c;
}
function renderMessages(){
  const box = document.getElementById('messages');
  box.innerHTML='';
  const c = convs.find(c=>c.appId===activeAppId && c.id===activeConvId);
  (c ? c.messages : []).forEach((m,i)=>{
    const wrap = document.createElement('div');
    wrap.className = 'msg-wrap ' + (m.role==='user'?'user':'ai');

    const bubble = document.createElement('div');
    bubble.className = 'msg ' + (m.role==='user'?'user':(m.role==='error'?'err':'ai'));
    bubble.textContent = m.text;
    wrap.appendChild(bubble);

    if(m.role!=='error'){
      const actions = document.createElement('div');
      actions.className = 'msg-actions';

      const copyBtn = document.createElement('button');
      copyBtn.textContent = '📋 コピー';
      copyBtn.onclick = ()=>{
        navigator.clipboard.writeText(m.text).catch(()=>{});
        copyBtn.textContent = '✓ コピーしました';
        setTimeout(()=>copyBtn.textContent='📋 コピー', 1200);
      };
      actions.appendChild(copyBtn);

      if(m.role==='user'){
        const editBtn = document.createElement('button');
        editBtn.textContent = '✏️ 編集して聞き直す';
        editBtn.onclick = ()=> startEdit(wrap, i, m.text);
        actions.appendChild(editBtn);
      } else {
        const regenBtn = document.createElement('button');
        regenBtn.textContent = '🔄 もう一度聞く';
        regenBtn.onclick = ()=> regenerate(i);
        actions.appendChild(regenBtn);
      }
      wrap.appendChild(actions);
    }
    box.appendChild(wrap);
  });
  box.scrollTop = box.scrollHeight;
}

function startEdit(wrap, i, oldText){
  wrap.innerHTML = '';
  const box = document.createElement('div');
  box.className = 'edit-box';
  const ta = document.createElement('textarea');
  ta.value = oldText;
  const row = document.createElement('div');
  row.className = 'row';
  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn-sm btn-danger';
  cancelBtn.textContent = 'キャンセル';
  cancelBtn.onclick = ()=> renderMessages();
  const sendBtn = document.createElement('button');
  sendBtn.className = 'btn-sm';
  sendBtn.textContent = '送信して聞き直す';
  sendBtn.onclick = ()=> submitEdit(i, ta.value.trim());
  row.appendChild(cancelBtn);
  row.appendChild(sendBtn);
  box.appendChild(ta);
  box.appendChild(row);
  wrap.appendChild(box);
  ta.focus();
}

async function submitEdit(i, newText){
  if(!newText) return;
  const c = currentConv();
  if(!c) return;
  c.messages = c.messages.slice(0, i); // それ以降(古い回答含む)は破棄
  c.messages.push({role:'user', text:newText});
  renderMessages();
  save();
  const app = apps.find(a=>a.id===activeAppId);
  await fetchAndAppendReply(app, c);
}

async function regenerate(i){
  const c = currentConv();
  if(!c) return;
  c.messages = c.messages.slice(0, i); // このAI回答以降を破棄して、直前のユーザー発言までに戻す
  renderMessages();
  save();
  const app = apps.find(a=>a.id===activeAppId);
  await fetchAndAppendReply(app, c);
}

  const box = document.getElementById('messages');
  let el = document.getElementById('typing-indicator');
  if(on){
    if(!el){
      el = document.createElement('div');
      el.id = 'typing-indicator';
      el.className = 'msg ai';
      el.textContent = '生成を待っています…';
      box.appendChild(el);
      box.scrollTop = box.scrollHeight;
    }
  } else if(el){
    el.remove();
  }
}

function friendlyError(err){
  const msg = ((err && err.message) || String(err)).toLowerCase();
  if(msg.includes('quota') || msg.includes('credit') || msg.includes('billing') || msg.includes('insufficient') || msg.includes('残高'))
    return '利用上限(クレジット/無料枠)に達しています。提供元のサイトでチャージするか、翌日以降にお試しください。';
  if(msg.includes('unauthorized') || msg.includes('401') || (msg.includes('key') && msg.includes('invalid')))
    return 'APIキーが正しくないか、期限切れの可能性があります。「アカウント」または再登録でキーを確認してください。';
  if(msg.includes('rate limit') || msg.includes('429') || msg.includes('too many'))
    return '短時間にリクエストが集中しています。少し時間を置いてからもう一度お試しください。';
  if(msg.includes('failed to fetch') || msg.includes('network') || msg.includes('load failed'))
    return '通信エラーが発生しました。インターネット接続を確認してもう一度お試しください。';
  if(msg.includes('no longer available') || msg.includes('deprecated') || msg.includes('not found'))
    return 'このAIのモデルが変更・廃止された可能性があります。アプリを削除して再登録し、モデルを選び直してください。';
  if(msg.includes('未対応のプロバイダ') || msg.includes('公開apiがない'))
    return err.message;
  return '応答の取得に失敗しました。しばらくしてからもう一度お試しください。';
}

async function fetchAndAppendReply(app, c){
  document.getElementById('send-btn').disabled = true;
  showTyping(true);
  try{
    const reply = await callProvider(app, c.messages);
    c.messages.push({role:'ai', text: reply});
    notifyIfHidden(app.name, reply);
  }catch(err){
    c.messages.push({role:'error', text: friendlyError(err)});
  }
  c.updatedAt = Date.now();
  save();
  renderMessages(); // typing表示もここで一緒に消える
  document.getElementById('send-btn').disabled = false;
}

document.getElementById('send-btn').onclick=sendMessage;
document.getElementById('input').addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
});

async function sendMessage(){
  const input = document.getElementById('input');
  const text = input.value.trim();
  if(!text) return;
  const app = apps.find(a=>a.id===activeAppId);
  if(!app) return;
  if(app.provider==='copilot'){
    alert('Copilotは公開APIがないためチャット不可です。「アカウント」からログイン画面を開いてください。');
    return;
  }
  const c = ensureConv();
  c.messages.push({role:'user', text});
  if(c.title==='新規会話') c.title = text.slice(0,24);
  c.updatedAt = Date.now();
  input.value='';
  renderMessages();
  save();
  await fetchAndAppendReply(app, c);
}

async function callProvider(app, messages){
  const history = messages.filter(m=>m.role!=='error').map(m=>({role:m.role, text:m.text}));
  if(app.provider==='gemini'){
    const model = app.model || 'gemini-flash-latest';
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${app.apiKey}`;
    const body = { contents: history.map(m=>({ role: m.role==='user'?'user':'model', parts:[{text:m.text}] })) };
    const res = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    const data = await res.json();
    if(!res.ok) throw new Error(data.error?.message || 'Gemini API エラー');
    return data.candidates?.[0]?.content?.parts?.[0]?.text || '(応答なし)';
  }
  if(app.provider==='openai' || app.provider==='custom' || app.provider==='grok' || app.provider==='perplexity'){
    const urlMap = { openai:'https://api.openai.com/v1/chat/completions', grok:'https://api.x.ai/v1/chat/completions', perplexity:'https://api.perplexity.ai/chat/completions' };
    const url = app.provider==='custom' ? app.endpoint : urlMap[app.provider];
    const body = { model: app.model || 'gpt-4o-mini', messages: history.map(m=>({role:m.role==='user'?'user':'assistant', content:m.text})) };
    const res = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+app.apiKey}, body: JSON.stringify(body)});
    const data = await res.json();
    if(!res.ok) throw new Error(data.error?.message || 'API エラー');
    return data.choices?.[0]?.message?.content || '(応答なし)';
  }
  if(app.provider==='claude'){
    const url='https://api.anthropic.com/v1/messages';
    const body={ model: app.model || 'claude-sonnet-4-5', max_tokens:1024, messages: history.map(m=>({role:m.role==='user'?'user':'assistant', content:m.text})) };
    const res = await fetch(url, {method:'POST', headers:{
      'Content-Type':'application/json','x-api-key':app.apiKey,'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    }, body: JSON.stringify(body)});
    const data = await res.json();
    if(!res.ok) throw new Error(data.error?.message || 'Claude API エラー (ブラウザ直呼び出しがブロックされている可能性があります)');
    return data.content?.[0]?.text || '(応答なし)';
  }
  throw new Error('未対応のプロバイダです');
}

// ---------- サイドバー: 折りたたみ / モバイル開閉 ----------
document.getElementById('collapse-btn').onclick = ()=>{
  const collapsed = document.getElementById('sidebar').classList.toggle('collapsed');
  document.getElementById('collapse-btn').textContent = collapsed ? '⏵' : '⏴';
  settings.sidebarCollapsed = collapsed;
  save();
};
document.getElementById('mobile-menu-btn').onclick = ()=>{
  document.getElementById('sidebar').classList.add('mobile-open');
  document.getElementById('sidebar-overlay').classList.add('show');
};
document.getElementById('sidebar-overlay').onclick = ()=>{
  document.getElementById('sidebar').classList.remove('mobile-open');
  document.getElementById('sidebar-overlay').classList.remove('show');
};
// アプリを選ぶ/画面を切り替えたらスマホ用メニューは自動で閉じる
document.querySelectorAll('.nav-item[data-nav]').forEach(el=>{
  el.addEventListener('click', ()=>{
    document.getElementById('sidebar').classList.remove('mobile-open');
    document.getElementById('sidebar-overlay').classList.remove('show');
  });
});

// ---------- Theme ----------
function applyTheme(theme){
  document.body.classList.toggle('light', theme==='light');
  settings.theme = theme;
  save();
}
document.getElementById('theme-dark').onclick = ()=>applyTheme('dark');
document.getElementById('theme-light').onclick = ()=>applyTheme('light');

// ---------- Notifications ----------
document.getElementById('notif-check').onchange = async (e)=>{
  if(e.target.checked){
    const perm = await Notification.requestPermission();
    settings.notifications = perm==='granted';
    e.target.checked = settings.notifications;
  } else {
    settings.notifications = false;
  }
  save();
};
function notifyIfHidden(appName, text){
  if(settings.notifications && document.hidden && 'Notification' in window && Notification.permission==='granted'){
    new Notification(appName + ' から応答', { body: text.slice(0,100) });
  }
}

// ---------- Accounts view ----------
function renderAccounts(){
  const box = document.getElementById('accounts-view');
  box.innerHTML = '<p class="hint" style="margin-bottom:14px">※ ブラウザのセキュリティ制限により、他サイトのログイン状態は自動検出できません。ニックネームを控えてログイン画面をすぐ開けるようにする一覧です。</p>';
  if(apps.length===0){ box.innerHTML += '<p class="hint">アプリを追加してください</p>'; return; }
  apps.forEach(a=>{
    const card = document.createElement('div');
    card.className='card';
    card.innerHTML = `
      <h4><span class="app-dot" style="background:${a.color};display:inline-block;margin-right:6px"></span>${a.name}</h4>
      <p>${a.provider}</p>
      <div class="row">
        <input placeholder="アカウント名/メモ" value="${a.accountLabel||''}" data-id="${a.id}" class="acc-label">
        <button class="btn-sm" data-open="${a.provider}">ログイン画面を開く</button>
      </div>
    `;
    box.appendChild(card);
  });
  box.querySelectorAll('.acc-label').forEach(inp=>{
    inp.onchange = ()=>{
      const a = apps.find(x=>x.id===inp.dataset.id);
      a.accountLabel = inp.value;
      save();
    };
  });
  box.querySelectorAll('[data-open]').forEach(btn=>{
    const url = {gemini:'https://gemini.google.com', openai:'https://chatgpt.com', claude:'https://claude.ai', copilot:'https://copilot.microsoft.com'}[btn.dataset.open] || '#';
    btn.onclick = ()=> window.open(url, '_blank');
  });
}

// ---------- History view ----------
function renderHistory(){
  const list = document.getElementById('history-list');
  const q = document.getElementById('history-search').value.toLowerCase();
  list.innerHTML='';
  convs.filter(c=> c.title.toLowerCase().includes(q) || c.messages.some(m=>m.text.toLowerCase().includes(q)))
    .sort((a,b)=>b.updatedAt-a.updatedAt)
    .forEach(c=>{
      const app = apps.find(a=>a.id===c.appId);
      const el=document.createElement('div');
      el.className='hist-item';
      el.innerHTML = `<div class="t">${c.title}</div><div class="m">${app?app.name:'(削除済み)'} ・ ${new Date(c.updatedAt).toLocaleString('ja-JP')}</div>`;
      el.onclick=()=>{
        if(!app) return;
        activeAppId = app.id;
        activeConvId = c.id;
        switchView('chat');
      };
      list.appendChild(el);
    });
}
document.getElementById('history-search').oninput = renderHistory;
