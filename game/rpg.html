<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EMOJI QUEST - 大魔王の復活（完全版）</title>
<style>
    :root {
        --bg-color: #0f1115;
        --frame-bg: #232731;
        --screen-bg: #000000;
        --panel-bg: #1a1d24;
        --accent-color: #00ffcc;
        --accent-warn: #ff3366;
        --text-gold: #ffd700;
        --text-white: #ffffff;
        --text-muted: #8892b0;
    }

    * { box-sizing: border-box; font-family: 'Courier New', Courier, 'Hiragino Kaku Gothic ProN', sans-serif; }

    body {
        margin: 0; padding: 0; background-color: var(--bg-color);
        color: var(--text-white); display: flex; justify-content: center; align-items: center;
        min-height: 100vh; overflow: hidden; user-select: none; touch-action: none;
    }

    /* ゲーム機風の強固なフレーム */
    #game-container {
        width: 100vw; max-width: 460px; height: 100vh; max-height: 880px;
        background: var(--frame-bg); border: 4px solid #111; border-radius: 12px;
        display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        position: relative;
    }

    /* ステータスバー */
    #status-bar {
        background: #111; padding: 10px 15px; display: grid; grid-template-columns: repeat(4, 1fr);
        font-size: 12px; font-weight: bold; border-bottom: 2px solid #333; color: var(--text-gold);
        text-align: center;
    }
    .status-val { color: var(--text-white); }

    /* メイン画面エリア */
    #screen-area {
        position: relative; width: 100%; aspect-ratio: 1 / 1;
        background-color: var(--screen-bg); overflow: hidden;
        border-bottom: 3px solid #111;
    }
    canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }

    /* 全面UIオーバーレイパネル */
    .overlay-panel {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(15, 17, 21, 0.98); display: flex; flex-direction: column;
        align-items: center; justify-content: center; p-index: 10; padding: 25px;
        text-align: center;
    }

    /* メッセージウィンドウ */
    #message-box {
        flex: 1; min-height: 90px; max-height: 110px; background: #0b0c10;
        border-bottom: 3px solid #333; padding: 12px; font-size: 14px; line-height: 1.5;
        overflow-y: auto; color: #fff; letter-spacing: 0.5px; word-break: break-all;
    }

    /* コントローラーエリア */
    #pad-area {
        background: #161920; padding: 15px 10px; display: flex;
        justify-content: space-between; align-items: center; border-top: 1px solid #2d323f;
    }

    /* 十字キー */
    .d-pad { display: grid; grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(3, 46px); gap: 2px; }
    .pad-btn {
        background: #2a303c; border: 2px solid #3f4758; border-radius: 6px;
        color: #fff; font-size: 16px; font-weight: bold; display: flex; align-items: center;
        justify-content: center; cursor: pointer; box-shadow: 0 3px 0 #15181e;
    }
    .pad-btn:active { background: var(--accent-color); color: #000; transform: translateY(2px); box-shadow: none; }
    .pad-empty { background: transparent; border: none; }

    /* アクションボタン群 */
    .btn-group { display: flex; flex-direction: column; gap: 8px; width: 150px; }
    .act-btn {
        height: 44px; background: #343b4c; border: 2px solid var(--text-gold);
        border-radius: 22px; color: #fff; font-size: 14px; font-weight: bold; cursor: pointer;
        box-shadow: 0 3px 0 #1a1e27; display: flex; align-items: center; justify-content: center;
    }
    .act-btn:active { transform: translateY(2px); box-shadow: none; background: var(--text-gold); color: #000; }

    /* 戦闘・メニュー用選択肢ボタン */
    .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-top: 15px; }
    .menu-btn {
        padding: 10px; background: #222733; border: 2px solid var(--text-gold);
        color: #fff; font-size: 13px; font-weight: bold; border-radius: 6px; cursor: pointer;
    }
    .menu-btn:active { background: var(--text-gold); color: #000; }

    /* 特殊テキスト装飾 */
    .gold-txt { color: var(--text-gold); font-weight: bold; }
    .accent-txt { color: var(--accent-color); font-weight: bold; }
    .warn-txt { color: var(--accent-warn); font-weight: bold; }

    .hidden { display: none !important; }
    
    /* PC用キーボードガイド */
    #pc-guide {
        position: absolute; bottom: -25px; width: 100%; text-align: center;
        font-size: 11px; color: var(--text-muted); letter-spacing: 1px;
    }
</style>
</head>
<body>

<div id="game-container">

        <!-- 戦闘画面 -->
        <div id="panel-battle" class="overlay-panel hidden" style="justify-content: flex-end; background:rgba(10,12,18,0.96);">

                <div id="bt-enemy-emoji" style="font-size:72px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6)); margin-bottom:5px;">👾</div>
                <div id="bt-enemy-name" class="gold-txt" style="font-size:18px;">モンスター</div>
                <div id="bt-enemy-hp" class="warn-txt" style="font-size:14px; margin-top:4px;">HP: 100/100</div>
            </div>
            <div id="battle-log-box" style="width:100%; height:110px; background:#000; border:1px solid #333; border-radius:4px; padding:8px; font-size:12px; text-align:left; overflow-y:auto; color:#a9b1d6; line-height:1.4; margin-bottom:5px;"></div>
            <div class="menu-grid">
                <button class="menu-btn" onclick="evtBattleTurn('attack')">⚔️ 攻撃する</button>
                <button class="menu-btn" onclick="evtBattleTurn('fire')">🔥 ファイア (4MP)</button>
                <button class="menu-btn" onclick="evtBattleTurn('heal')">💖 ヒール (3MP)</button>
                <button class="menu-btn" onclick="evtBattleTurn('item')">🧪 ポーション</button>
            </div>
            <button class="menu-btn" onclick="evtBattleTurn('run')" style="width:100%; margin-top:8px; border-color:#555; color:#aaa;">🏃 逃げ出す</button>
        </div>

        <!-- 街のショップ画面 -->
        <div id="panel-shop" class="overlay-panel hidden">
            <h2 id="shop-title" class="gold-txt" style="margin-top:0;">村の道具屋</h2>
            <div id="shop-list-container" style="width:100%; display:flex; flex-direction:column; gap:8px; max-height:240px; overflow-y:auto; padding-right:5px;"></div>
            <button class="menu-btn" style="width:100%; margin-top:20px; border-color:var(--accent-warn);" onclick="uiCloseShop()">店を出る</button>
        </div>
    </div>

    <!-- メッセージ下部 -->
    <div id="message-box"></div>

    <!-- 操作パッド -->
    <div id="pad-area">
        <div class="d-pad">
            <button class="pad-empty"></button>
            <button class="pad-btn" onclick="ctrlMove(0,-1)">↑</button>
            <button class="pad-empty"></button>
            <button class="pad-btn" onclick="ctrlMove(-1,0)">←</button>
            <button class="pad-btn" onclick="ctrlInteract()" style="font-size:13px; background:#1b3b32; border-color:var(--accent-color);">決定</button>
            <button class="pad-btn" onclick="ctrlMove(1,0)">→</button>
            <button class="pad-empty"></button>
            <button class="pad-btn" onclick="ctrlMove(0,1)">↓</button>
            <button class="pad-empty"></button>
        </div>
        <div class="btn-group">
            <button class="act-btn" onclick="ctrlInteract()">🗣️ 話す / 調べる</button>
            <button class="act-btn" onclick="sysSaveGame(true)" style="border-color:var(--accent-color);">💾 手動セーブ</button>

    </div>
    
    <div id="pc-guide">PC操作: 矢印キーで移動 / SpaceかEnterで決定</div>

    // --- 計算関数 (バグ修正: 攻撃力・防御力の計算バグを解決) ---
    function calcAtk() {
        let wp = WEAPONS[player.weapon];
        return player.baseAtk + (wp ? wp.atk : 0);
    }
    function calcDef() {
        let ar = ARMORS[player.armor];
        return player.baseDef + (ar ? ar.def : 0);
    }

    // --- メッセージ表示システム ---
    function printMsg(txt) {
        const box = document.getElementById("message-box");
        box.innerHTML = txt;
        box.scrollTop = 0;
    }

    // --- 画面描画コア (バグ修正: Canvas内の絵文字サイズが崩れ、マップがズレる不具合を解決) ---
    function sysRenderMap() {
        ctx.fillStyle = "#0a0c10";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        let currentMap = maps[player.mapId];
        if (!currentMap) return;

        // セル外枠補正をかけて綺麗に中央集約して描画
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        for (let r = 0; r < 15; r++) {
            if(!currentMap[r]) continue;
            for (let c = 0; c < 15; c++) {
                let tileType = currentMap[r][c];
                let tile = TILES[tileType] || TILES[0];
                
                // 床のドットを薄く描画してレトロ感を底上げ
                if (tileType === 0) {
                    ctx.fillStyle = "#1e222b";
                    ctx.fillRect(c * TILE_SIZE + 14, r * TILE_SIZE + 14, 4, 4);
                } else {
                    ctx.font = "24px 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif";
                    ctx.fillText(tile.emoji, c * TILE_SIZE + TILE_SIZE/2, r * TILE_SIZE + TILE_SIZE/2);
                }
            }
        }
        
        // プレイヤーの描画
        ctx.font = "24px 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif";
        ctx.fillText("⚔️", player.x * TILE_SIZE + TILE_SIZE/2, player.y * TILE_SIZE + TILE_SIZE/2);
    }

    function uiUpdateHUD() {
        document.getElementById("st-lv").innerText = player.lv;
        document.getElementById("st-hp").innerText = `${player.hp}/${player.maxHp}`;
        document.getElementById("st-mp").innerText = `${player.mp}/${player.maxMp}`;
        document.getElementById("st-gold").innerText = player.gold;
    }

    // --- システム初期化・セーブ・ロード ---
    function sysNewGame() {
        document.getElementById("panel-title").classList.add("hidden");
        currentMode = "map";
        printMsg("<span class='accent-txt'>【第一章：旅立ちの洞窟】</span><br>世界は魔王の闇に包まれようとしている。まずは中央北側にいる村の長老（👵）に話しかけてみよう！");
        uiUpdateHUD();
        sysRenderMap();
        sysSaveGame(false);
    }

    function sysSaveGame(manual = false) {
        let saveData = { player, flags };
        localStorage.setItem("emq_ultimate_save", JSON.stringify(saveData));
        document.getElementById("btn-load").disabled = false;
        document.getElementById("btn-load").style.opacity = 1;
        if (manual) {
            alert("冒険の書に 記録しました！ (進行状況は自動セーブもされています)");
        }
    }

    function sysLoadGame() {
        let raw = localStorage.getItem("emq_ultimate_save");
        if (!raw) return;
        let data = JSON.parse(raw);
        player = data.player;
        flags = data.flags;
        
        document.getElementById("panel-title").classList.add("hidden");
        currentMode = "map";
        printMsg("<span class='accent-txt'>データをロードしました。</span>冒険を再開します！");
        uiUpdateHUD();
        sysRenderMap();
    }

    // 起動時のセーブデータ存在確認
    if (!localStorage.getItem("emq_ultimate_save")) {
        document.getElementById("btn-load").disabled = true;
        document.getElementById("btn-load").style.opacity = 0.4;
    }

    // --- 移動とマップ遷移ロジック ---
    function ctrlMove(dx, dy) {
        if (currentMode !== "map") return;
        let nX = player.x + dx;
        let nY = player.y + dy;
        let currentMap = maps[player.mapId];

        if (nX >= 0 && nX < 15 && nY >= 0 && nY < 15) {
            let tileId = currentMap[nY][nX];
            let tile = TILES[tileId] || TILES[0];
            
            if (tile.walk) {
                player.x = nX;
                player.y = nY;
                sysRenderMap();
                if (safeSteps > 0) safeSteps--;
                sysCheckMapTrigger();
            }
        }
    }

    // マップ移動トリガー・イベント判定
    function sysCheckMapTrigger() {
        let tileId = maps[player.mapId][player.y][player.x];

        // 1. 始まりの村 ➔ 草原フィールド1 (北の扉から)
        if (player.mapId === "village" && player.y === 0 && player.x === 7) {
            player.mapId = "world1"; player.x = 7; player.y = 10;
            printMsg("草原フィールドに出た。北西には魔物の潜む洞窟があるようだ。");
            sysRenderMap();
            return;
        }
        // 2. 草原フィールド1 ➔ 始まりの村
        if (player.mapId === "world1" && player.y === 11 && player.x === 7) {
            player.mapId = "village"; player.x = 7; player.y = 1;
            printMsg("始まりの村に戻った。宿屋（🛌）で休むことができる。");
            sysRenderMap();
            return;
        }
        // 3. 草原フィールド1 ➔ 旅立ちの洞窟 (左上)
        if (player.mapId === "world1" && player.y === 1 && player.x === 1) {
            player.mapId = "cave1"; player.x = 7; player.y = 12;
            printMsg("旅立ちの洞窟に入った…冷たい空気が張り詰めている。最深部にボスがいるぞ。");
            sysRenderMap();
            return;
        }
        // 4. 旅立ちの洞窟 ➔ 草原フィールド1
        if (player.mapId === "cave1" && player.y === 12 && player.x === 7) {
            player.mapId = "world1"; player.x = 1; player.y = 2;
            printMsg("草原フィールドに戻った。");
            sysRenderMap();
            return;
        }
        // 5. 草原フィールド1 ➔ 東の関所を越えて「砂漠の町」へ
        if (player.mapId === "world1" && player.y === 1 && player.x === 13) {
            if (flags.storyProgress >= 2) {
                player.mapId = "desert"; player.x = 1; player.y = 7;
                printMsg("<span class='accent-txt'>【第二章：砂漠の古代遺跡】</span><br>砂漠の町に到着した。オアシスの水が干からびて人々が困っているようだ。");
            } else {
                player.x = 12;
                printMsg("<span class='warn-txt'>【関所】</span>兵士「この先は危険な砂漠エリアだ。長老から認められた証（第1章ボス撃破）がない者は通せない！」");
            }
            sysRenderMap();
            return;
        }
        // 6. 砂漠の町 ➔ 草原フィールド1 (左へ戻る)
        if (player.mapId === "desert" && player.y === 7 && player.x === 0) {
            player.mapId = "world1"; player.x = 12; player.y = 1;
            printMsg("草原フィールドに戻った。");
            sysRenderMap();
            return;
        }
        // 7. 砂漠の町 ➔ 砂漠フィールド2 (北の扉から)
        if (player.mapId === "desert" && player.y === 0 && player.x === 7) {
            player.mapId = "world2"; player.x = 7; player.y = 8;
            printMsg("広大な砂漠に出た。西にはピラミッド、北には不気味な魔王城が見える。");
            sysRenderMap();
            return;
        }
        // 8. 砂漠フィールド2 ➔ 砂漠の町
        if (player.mapId === "world2" && player.y === 9 && player.x === 7) {
            player.mapId = "desert"; player.x = 7; player.y = 1;
            printMsg("砂漠の町に戻った。");
            sysRenderMap();
            return;
        }
        // 9. 砂漠フィールド2 ➔ ピラミッド (左)
        if (player.mapId === "world2" && player.y === 3 && player.x === 3) {
            player.mapId = "pyramid"; player.x = 7; player.y = 9;
            printMsg("古代ピラミッドへ足を踏み入れた。強力な呪いを感じる…！最深部に守護神が眠る。");
            sysRenderMap();
            return;
        }
        // 10. ピラミッド ➔ 砂漠フィールド2
        if (player.mapId === "pyramid" && player.y === 10 && player.x === 7) {
            player.mapId = "world2"; player.x = 3; player.y = 4;
            printMsg("砂漠フィールドに戻った。");
            sysRenderMap();
            return;
        }
        // 11. 砂漠フィールド2 ➔ 魔王城 (北中央)
        if (player.mapId === "world2" && player.y === 0 && player.x === 6) {
            if (flags.storyProgress >= 4) {
                player.mapId = "demonCastle"; player.x = 7; player.y = 8;
                printMsg("<span class='warn-txt'>【最終章：決戦魔王城】</span><br>ついに魔王城へ突入した！全滅を恐れず、最深部の大魔王を討ち果たすのだ！");
            } else {
                player.y = 1;
                printMsg("<span class='warn-txt'>【魔王城の結界】</span>強大な闇の扉が閉ざされている。開くにはピラミッドに隠された『魔王城の鍵』が必要だ。");
            }
            sysRenderMap();
            return;
        }
        // 12. 魔王城 ➔ 砂漠フィールド2
        if (player.mapId === "demonCastle" && player.y === 9 && player.x === 7) {
            player.mapId = "world2"; player.x = 6; player.y = 1;
            printMsg("砂漠フィールドへ一時撤退した。");
            sysRenderMap();
            return;
        }

        // --- ランダムエンカウント (村・街以外 ＋ 安全歩数判定) ---
        if (player.mapId !== "village" && player.mapId !== "desert" && tileId === 0) {
            if (safeSteps === 0 && Math.random() < 0.14) {
                sysStartBattle();
            }
        }
    }

    // --- 話しかける・調べるイベント処理 ---
    function ctrlInteract() {
        if (currentMode !== "map") return;
        let currentMap = maps[player.mapId];

        // プレイヤーの足元および周囲4マスをくまなく走査
        const scanDirs = [[0,0], [0,-1], [0,1], [-1,0], [1,0]];
        for (let d of scanDirs) {
            let tx = player.x + d[0];
            let ty = player.y + d[1];
            if (tx < 0 || tx >= 15 || ty < 0 || ty >= 15) continue;
            
            let tileId = currentMap[ty][tx];

            // 1. 長老NPC (👵)
            if (tileId === 7) {
                if (player.mapId === "village") {
                    if (flags.storyProgress === 0) {
                        flags.storyProgress = 1;
                        printMsg("<span class='gold-txt'>長老</span>「おお、勇者よ！よくぞ来てくれた。まずは腕試しとして、北の草原にある洞窟の主<span class='warn-txt'>【ドラゴンパピー】</span>を退治してきておくれ。そうすれば東の関所を通る許可を出そう！」");
                    } else if (flags.storyProgress === 1) {
                        printMsg("<span class='gold-txt'>長老</span>「北西の洞窟にいる<span class='warn-txt'>【ドラゴンパピー】</span>を倒すのじゃ。道具屋で装備を整えるとよいぞ」");
                    } else {
                        printMsg("<span class='gold-txt'>長老</span>「見事魔を払ったな！東の関所の先にある砂漠の町へ向かい、世界を救ってくれ！」");
                    }
                } else if (player.mapId === "desert") {
                    if (flags.storyProgress === 2) {
                        flags.storyProgress = 3;
                        printMsg("<span class='gold-txt'>砂漠の長老</span>「旅の勇者殿、よくぞ参られた！今、北西のピラミッドに眠る呪いによってオアシスが枯れ、魔王の封印が解けかけておる。どうかピラミッドの最深部で<span class='warn-txt'>【古代スフィンクス】</span>を倒し、鍵を奪い返してくだされ！」");
                    } else if (flags.storyProgress === 3) {
                        printMsg("<span class='gold-txt'>砂漠の長老</span>「ピラミッドの<span class='warn-txt'>【古代スフィンクス】</span>を討伐し、魔王城の鍵を取り戻すのじゃ。この町のショップにはさらに強力な武器が売っておるぞ」");
                    } else {
                        printMsg("<span class='gold-txt'>砂漠の長老</span>「鍵は取り戻された！北の果てにある魔王城へ向かい、大魔王を打ち倒すのです！」");
                    }
                }
                return;
            }

            // 2. 宿屋NPC (🛌)
            if (tileId === 5) {
                let cost = player.mapId === "desert" ? 30 : 10;
                if (player.gold >= cost) {
                    player.gold -= cost;
                    player.hp = player.maxHp;
                    player.mp = player.maxMp;
                    printMsg(`<span class='accent-txt'>宿屋に宿泊した。</span><br>からだの 疲れが すべてとれた！ HPとMPが全回復した（-${cost} GOLD）`);
                    uiUpdateHUD();
                    sysSaveGame(false);
                } else {
                    printMsg(`<span class='warn-txt'>宿屋</span>「お金が足りないねぇ。一晩 ${cost} GOLD 必要だよ」`);
                }
                return;
            }

            // 3. ショップNPC (🛍️)
            if (tileId === 6) {
                uiOpenShop();
                return;
            }

            // 4. 料理人サブクエストNPC (🍳)
            if (tileId === 10) {
                if (!flags.soupQuest) {
                    flags.soupQuest = 1;
                    printMsg("<span class='gold-txt'>料理人</span>「おいらの特製スタミナスープを飲みたいかい？それなら草原エリア(world1)にいる大コウモリが落とす<span class='accent-txt'>『コウモリの羽（🦇）』を3つ</span>集めてきておくれ！」");
                } else if (flags.soupQuest === 1) {
                    if (player.items.wings >= 3) {
                        player.items.wings -= 3;
                        flags.soupQuest = 2;
                        player.maxHp += 15;
                        player.hp = player.maxHp;
                        printMsg("<span class='gold-txt'>料理人</span>「おお！羽を3つ持ってきてくれたんだな！さっそく煮込んで…はい、特製スタミナスープだ！ <span class='accent-txt'>なんと最大HPが 15 上がった！</span>」");
                        uiUpdateHUD();
                    } else {
                        printMsg(`<span class='gold-txt'>料理人</span>「コウモリの羽は今 <span class='gold-txt'>${player.items.wings}/3 個</span>だね。草原のコウモリを倒して集めてきな！」`);
                    }
                } else {
                    printMsg("<span class='gold-txt'>料理人</span>「スープのお味はどうだい？力がみなぎるだろう！」");
                }
                return;
            }

            // 5. 隠し・やり込み要素：伝説の聖剣 (🌵)
            if (tileId === 9 && player.mapId === "desert") {
                if (!flags.legendSwordFound) {
                    flags.legendSwordFound = true;
                    player.weapon = "legend";
                    printMsg("<span class='gold-txt'>【隠し発見！】</span><br>サボテンの影に、かつての勇者が残したまばゆく輝く<span class='gold-txt'>『伝説の聖剣』</span>を見つけた！ 攻撃力が爆発的に上昇した！");
                    uiUpdateHUD();
                } else {
                    printMsg("サボテンがある。他には何も見当たらない。");
                }
                return;
            }

            // 6. 各種ボスシンボル (🦂)
            if (tileId === 8) {
                if (player.mapId === "cave1") {
                    sysStartBattle(MONSTERS.boss1);
                } else if (player.mapId === "pyramid") {
                    sysStartBattle(MONSTERS.boss2);
                } else if (player.mapId === "demonCastle") {
                    sysStartBattle(MONSTERS.boss3);
                }
                return;
            }
        }
        printMsg("そこには何もないようだ。");
    }

    function uiBuyAction(product) {
        if (player.gold < product.price) {
            alert("ゴールドが足りません！");
            return;
        }
        player.gold -= product.price;
        
        if (product.type === 'item') {
            player.items[product.id]++;
        } else if (product.type === 'weapon') {
            player.weapon = product.id;
        } else if (product.type === 'armor') {
            player.armor = product.id;
        }
        
        alert(`${product.name} を購入しました！`);
        uiUpdateHUD();
        uiOpenShop(); // 再描画
    }

        document.getElementById("panel-shop").classList.add("hidden");
        currentMode = "map";
    }

    // --- バトルシステムコア (バグ修正: 逃亡時・全滅時の画面ロック、フラグ未更新を徹底解消) ---
    let battleLog = [];
    function logBattle(txt) {
        const box = document.getElementById("battle-log-box");
        box.innerHTML += `<div>${txt}</div>`;
        box.scrollTop = box.scrollHeight;
    }

    function sysStartBattle(presetEnemy = null) {
        currentMode = "battle";
        if (presetEnemy) {
            activeEnemy = JSON.parse(JSON.stringify(presetEnemy)); // ボス完全複製
        } else {
            // マップ階層に応じた敵エンカウント抽選
            let pool = MONSTERS[player.mapId] || MONSTERS.world1;
            activeEnemy = JSON.parse(JSON.stringify(pool[Math.floor(Math.random() * pool.length)]));
        }

        document.getElementById("bt-enemy-emoji").innerText = activeEnemy.emoji;
        document.getElementById("bt-enemy-name").innerText = activeEnemy.name;
        document.getElementById("battle-log-box").innerHTML = "";
        
        document.getElementById("panel-battle").classList.remove("hidden");
        logBattle(`<span class='warn-txt'>${activeEnemy.name}</span> があらわれた！`);
        uiUpdateBattleHUD();
    }

    function uiUpdateBattleHUD() {
        document.getElementById("bt-enemy-hp").innerText = `HP: ${activeEnemy.hp}/${activeEnemy.maxHp}`;
    }

    function evtBattleTurn(action) {
        if (currentMode !== "battle") return;

        // --- 1. プレイヤーの行動フェーズ ---
        if (action === 'attack') {
            let dmg = Math.max(1, calcAtk() - Math.floor(activeEnemy.def / 2));
            activeEnemy.hp -= dmg;
            logBattle(`あなたの攻撃！ ${activeEnemy.name}に <span class='warn-txt'>${dmg}</span> のダメージ！`);
        } 
        else if (action === 'fire') {
            if (player.mp >= 4) {
                player.mp -= 4;
                // 魔法の杖を装備している場合、魔法威力がさらに向上する作り込み要素
                let bonus = player.weapon === 'magic' ? 20 : 0;
                let dmg = 25 + bonus;
                activeEnemy.hp -= dmg;
                logBattle(`呪文ファイアを放った！ ${activeEnemy.name}に <span class='warn-txt'>${dmg}</span> の炎ダメージ！`);
                uiUpdateHUD();
            } else {
                alert("MPが足りません！"); return;
            }
        } 
        else if (action === 'heal') {
            if (player.mp >= 3) {
                player.mp -= 3;
                let healVal = 45;
                player.hp = Math.min(player.maxHp, player.hp + healVal);
                logBattle(`呪文ヒールを唱えた！ 体力が <span class='accent-txt'>${healVal}</span> 回復した！`);
                uiUpdateHUD();
            } else {
                alert("MPが足りません！"); return;
            }
        } 
        else if (action === 'item') {
            if (player.items.potion > 0) {
                player.items.potion--;
                let healVal = 35;
                player.hp = Math.min(player.maxHp, player.hp + healVal);
                logBattle(`ポーションを使用した！ 体力が <span class='accent-txt'>${healVal}</span> 回復した！`);
                uiUpdateHUD();
            } else {
                alert("ポーションを所持していません！"); return;
            }
        } 
        else if (action === 'run') {
            if (activeEnemy.isBoss) {
                logBattle("<b>ボスからは絶対に逃げられない！</b>");
                return;
            }
            logBattle("あなたは必死に逃げ出した！");
            safeSteps = 4; // 逃げた後は少しの間敵が出ないバグ対策の安全歩数
            setTimeout(sysEndBattle, 1200);
            return;
        }

        uiUpdateBattleHUD();

        // 敵の撃破チェック
        if (activeEnemy.hp <= 0) {
            logBattle(`<span class='gold-txt'>${activeEnemy.name} を撃破した！</span>`);
            player.gold += activeEnemy.gold;
            player.exp += activeEnemy.exp;
            logBattle(`${activeEnemy.exp}の経験値、${activeEnemy.gold}G を獲得！`);
            
            // サブクエスト用ドロップアイテム(大コウモリ)の抽選
            if (activeEnemy.name === "大コウモリ" && flags.soupQuest === 1) {
                player.items.wings++;
                logBattle("<span class='accent-txt'>コウモリの羽（🦇）を手に入れた！</span>");
            }

            // ボス撃破フラグの進行
            if (activeEnemy.isBoss) {
                if (player.mapId === "cave1") {
                    flags.boss1Defeated = true;
                    flags.storyProgress = 2;
                    maps.cave1[3][7] = 0; // マップからボスを消去
                    printMsg("<span class='gold-txt'>【第一章クリア！】</span><br>洞窟の主ドラゴンパピーを討伐した！村の東にある関所へ向かおう。");
                } else if (player.mapId === "pyramid") {
                    flags.boss2Defeated = true;
                    flags.storyProgress = 4;
                    maps.pyramid[4][7] = 0;
                    printMsg("<span class='gold-txt'>【第二章クリア！】</span><br>スフィンクスを倒し『魔王城の鍵』を手に入れた！砂漠の北にある最終決戦の地、魔王城へ向かえ！");
} else if (player.mapId === "demonCastle") {
                    flags.boss3Defeated = true;
                    maps.demonCastle[1][7] = 0;
                    alert("【✨ゲームクリア✨】\n見事大魔王エモジオンを倒し、世界に平和が戻りました！\nあなたが真のEmoji Questマスターです！ご清聴・プレイありがとうございました！");
                    location.reload();
                    return;
                }
            }

            sysCheckLevelUp();
            uiUpdateHUD();
            safeSteps = 5; // 戦闘終了後は安全歩数を付与
            setTimeout(sysEndBattle, 1600);
            return;
        }

        // --- 2. 敵のターンフェーズ ---
        setTimeout(() => {
            if (currentMode !== "battle") return;
            let edmg = Math.max(1, activeEnemy.atk - Math.floor(calcDef() / 2));
            player.hp -= edmg;
            logBattle(`${activeEnemy.name} の攻撃！ <span class='warn-txt'>${edmg}</span> のダメージを受けた！`);
            uiUpdateHUD();

            // プレイヤーの全滅判定
            if (player.hp <= 0) {
                alert("あなたは目の前が真っ暗になった…（手元のお金を半分失い、始まりの村へ戻されます）");
                player.hp = player.maxHp;
                player.mp = player.maxMp;
                player.gold = Math.floor(player.gold / 2);
                player.mapId = "village"; player.x = 7; player.y = 11;
                sysEndBattle();
            }
        }, 600);
    }

    function sysCheckLevelUp() {
        let reqExp = player.lv * 25;
        if (player.exp >= reqExp) {
            player.lv++;
            player.maxHp += 10;
            player.maxMp += 4;
            player.hp = player.maxHp;
            player.mp = player.maxMp;
            player.baseAtk += 3;
            player.baseDef += 2;
            logBattle(`<span class='accent-txt'>★ レベルアップ ★</span> レベル ${player.lv} になった！能力が向上した！`);
        }
    }

    function sysEndBattle() {
        document.getElementById("panel-battle").classList.add("hidden");
        currentMode = "map";
        sysRenderMap();
        sysSaveGame(false); // バトル終了時にオートセーブ
    }

    // --- PCキーボードの完全バックアップサポート ---
    window.addEventListener("keydown", (e) => {
        if (currentMode !== "map") return;
        if (e.key === "ArrowUp" || e.key === "w") ctrlMove(0, -1);
        if (e.key === "ArrowDown" || e.key === "s") ctrlMove(0, 1);
        if (e.key === "ArrowLeft" || e.key === "a") ctrlMove(-1, 0);
        if (e.key === "ArrowRight" || e.key === "d") ctrlMove(1, 0);
        if (e.key === "Enter" || e.key === " " || e.key === "f") ctrlInteract();
    });

    // 初期化実行
    uiUpdateHUD();
</script>
</body>
</html>
