<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>QuizHub</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f7f6f2;--surface:#ffffff;--surface2:#f0ede8;
  --border:#e2ddd7;--border2:#ccc8c0;
  --text:#1a1917;--sub:#6b6860;--hint:#9e9b94;
  --a:#2d5be3;--a2:#4a74f0;--al:rgba(45,91,227,.08);
  --gold:#c8860a;
  --green:#1a8a50;--green-bg:#edf7f1;
  --red:#c0392b;--red-bg:#fef0ee;
  --blue:#1a5cb8;--blue-bg:#eef3fc;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.05);
  --shadow-lg:0 4px 16px rgba(0,0,0,.1),0 12px 40px rgba(0,0,0,.08);
  --radius:10px;--radius-lg:14px;--radius-xl:18px;
  --sw:68px;--header-h:56px;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.5}

/* ══ ログイン画面 ══ */
#auth-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;background:linear-gradient(135deg,#eef2ff 0%,#f7f6f2 60%,#fdf5e0 100%)}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);padding:36px 32px;width:100%;max-width:400px;box-shadow:var(--shadow-lg)}
.auth-logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:28px}
.auth-logo-icon{width:40px;height:40px;background:var(--a);border-radius:10px;display:flex;align-items:center;justify-content:center}
.auth-logo-icon svg{width:20px;height:20px;fill:#fff}
.auth-logo-text{font-family:'DM Serif Display',serif;font-size:1.5rem;color:var(--text);letter-spacing:-.3px}
.auth-logo-text em{font-style:italic;color:var(--a)}
.auth-tabs{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:3px;margin-bottom:20px}
.auth-tab{flex:1;height:32px;border:none;background:transparent;font:600 13px 'DM Sans',sans-serif;color:var(--hint);cursor:pointer;border-radius:6px;transition:all .15s}
.auth-tab.on{background:var(--surface);color:var(--a);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.auth-fg{margin-bottom:14px}
.auth-lbl{display:block;font-size:11px;font-weight:600;color:var(--hint);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.auth-inp{width:100%;height:40px;padding:0 12px;border:1px solid var(--border);border-radius:8px;font:500 14px 'DM Sans',sans-serif;color:var(--text);background:var(--surface);outline:none;transition:border-color .15s}
.auth-inp:focus{border-color:var(--a);box-shadow:0 0 0 3px var(--al)}
.auth-btn{width:100%;height:42px;border:none;border-radius:9px;background:var(--a);color:#fff;font:700 14px 'DM Sans',sans-serif;cursor:pointer;transition:background .15s;margin-top:4px}
.auth-btn:hover{background:var(--a2)}
.auth-err{font-size:12px;color:var(--red);text-align:center;min-height:18px;margin-bottom:8px}
.auth-switch{text-align:center;font-size:12px;color:var(--hint);margin-top:14px}
.auth-switch button{background:none;border:none;color:var(--a);font:600 12px 'DM Sans',sans-serif;cursor:pointer;text-decoration:underline}
.pw-bar-wrap{margin-bottom:10px}
.pw-bar{height:4px;background:var(--surface2);border-radius:2px;overflow:hidden;margin-bottom:4px}
.pw-bar-fill{height:100%;border-radius:2px;transition:width .3s,background .3s}
.pw-bar-lbl{font-size:11px;color:var(--hint)}

/* ══ メイン画面 ══ */
#main-screen{display:none;flex-direction:row;min-height:100vh}
.sb{position:fixed;left:0;top:0;bottom:0;width:var(--sw);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:2px;z-index:200}
.sb-logo{width:36px;height:36px;background:var(--a);border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.sb-logo svg{width:17px;height:17px;fill:#fff}
.sb-btn{width:48px;height:48px;border:none;background:transparent;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--hint);transition:all .15s}
.sb-btn:hover{background:var(--surface2);color:var(--sub)}
.sb-btn.on{background:var(--al);color:var(--a)}
.sb-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.sb-btn span{font-size:9px;font-weight:600;letter-spacing:.3px}
.sb-sp{flex:1}
.sb-user{width:34px;height:34px;border-radius:50%;background:var(--a);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;cursor:pointer;border:none;overflow:hidden;flex-shrink:0}
.user-menu{position:fixed;left:calc(var(--sw) + 6px);bottom:14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:6px;box-shadow:var(--shadow-lg);min-width:180px;display:none;z-index:300}
.user-menu.open{display:block}
.user-menu-info{padding:8px 10px;border-bottom:1px solid var(--border);margin-bottom:4px}
.user-menu-name{font-size:13px;font-weight:700;color:var(--text)}
.user-menu-email{font-size:11px;color:var(--hint);margin-top:1px}
.user-menu-item{padding:8px 10px;border-radius:7px;font-size:13px;color:var(--sub);cursor:pointer;transition:background .12s;display:flex;align-items:center;gap:7px;border:none;background:transparent;width:100%;text-align:left}
.user-menu-item:hover{background:var(--surface2);color:var(--text)}
.user-menu-item svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}
.user-menu-item.danger{color:var(--red)}
.user-menu-item.danger:hover{background:var(--red-bg)}
.main{margin-left:var(--sw);display:flex;flex-direction:column;min-height:100vh;flex:1;min-width:0}
.hdr{position:sticky;top:0;z-index:100;background:rgba(247,246,242,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);height:var(--header-h);display:flex;align-items:center;padding:0 20px;gap:10px}
.hdr-title{font-family:'DM Serif Display',serif;font-size:1.25rem;color:var(--text);flex:0 0 auto;letter-spacing:-.3px}
.hdr-title em{font-style:italic;color:var(--a)}
.search{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:0 11px;height:34px;flex:1;max-width:280px;transition:border-color .15s}
.search:focus-within{border-color:var(--a)}
.search svg{width:13px;height:13px;stroke:var(--hint);fill:none;stroke-width:1.8;flex-shrink:0}
.search input{border:none;outline:none;background:transparent;font:500 13px 'DM Sans',sans-serif;color:var(--text);width:100%}
.search input::placeholder{color:var(--hint)}
.btn{height:34px;padding:0 14px;border-radius:8px;font:600 13px 'DM Sans',sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:5px;border:none;transition:all .15s;white-space:nowrap}
.bp{background:var(--a);color:#fff}.bp:hover{background:var(--a2)}
.bg{background:var(--surface);color:var(--sub);border:1px solid var(--border)}.bg:hover{border-color:var(--border2);color:var(--text)}
.btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2}
.btn-sm{height:28px;padding:0 10px;font-size:12px}
.profile-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:12px}
.profile-bar-ava{width:36px;height:36px;border-radius:50%;background:var(--a);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0}
.profile-bar-name{font-size:13px;font-weight:700;color:var(--text)}
.profile-bar-email{font-size:11px;color:var(--hint)}
.tabs{display:flex;padding:14px 20px 0;border-bottom:1px solid var(--border);background:var(--surface)}
.tab{padding:8px 16px;border:none;background:transparent;font:600 13px 'DM Sans',sans-serif;color:var(--hint);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;display:flex;align-items:center;gap:5px}
.tab svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}
.tab:hover{color:var(--sub)}
.tab.on{color:var(--a);border-bottom-color:var(--a)}
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:14px 20px}
.cats::-webkit-scrollbar{display:none}
.pill{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface);font:600 12px 'DM Sans',sans-serif;color:var(--hint);cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0}
.pill:hover{border-color:var(--border2);color:var(--sub)}
.pill.on{border-color:transparent;color:#fff}
.p-all.on{background:var(--sub)}.p-trivia.on{background:#7c3aed}.p-general.on{background:#0369a1}
.p-sns.on{background:#be185d}.p-music.on{background:#b45309}.p-sports.on{background:#047857}
.p-anime.on{background:#b91c1c}.p-other.on{background:#4b5563}
.content{padding:6px 20px 48px}
.pane{display:none}.pane.on{display:block}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-top:4px}
.pt{font-size:14px;font-weight:600;color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;cursor:pointer;transition:all .18s;position:relative;overflow:hidden}
.card:hover{border-color:var(--border2);box-shadow:var(--shadow)}
.card-badge-row{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.card-cat{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:5px;font-size:11px;font-weight:600}
.cc-trivia{background:#f3eeff;color:#7c3aed}.cc-general{background:#e0f2fe;color:#0369a1}
.cc-sns{background:#fce7f3;color:#be185d}.cc-music{background:#fef3c7;color:#b45309}
.cc-sports{background:#d1fae5;color:#047857}.cc-anime{background:#fee2e2;color:#b91c1c}
.cc-other{background:#f3f4f6;color:#4b5563}
.card-title{font-size:14px;font-weight:600;margin-bottom:5px;line-height:1.4;color:var(--text)}
.card-meta{font-size:11px;color:var(--hint);display:flex;gap:8px;margin-bottom:11px;flex-wrap:wrap}
.card-meta span{display:flex;align-items:center;gap:3px}
.card-meta svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.8}
.card-foot{display:flex;align-items:center;justify-content:space-between;padding-top:10px;border-top:1px solid var(--border)}
.ava{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;flex-shrink:0}
.card-author{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--sub)}
.card-date{font-size:10px;color:var(--hint)}
.card-actions{position:absolute;top:10px;right:10px;display:flex;gap:4px;opacity:0;transition:opacity .15s}
.card:hover .card-actions{opacity:1}
.icon-btn{width:26px;height:26px;border-radius:6px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.icon-btn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}
.ib-play{background:var(--a);color:#fff}.ib-play:hover{background:var(--a2)}
.ib-del{background:var(--red-bg);color:var(--red)}.ib-del:hover{background:#fcd5d0}
.empty{background:var(--surface);border:1.5px dashed var(--border);border-radius:var(--radius-lg);padding:52px 24px;text-align:center}
.empty svg{width:36px;height:36px;stroke:var(--hint);fill:none;stroke-width:1.2;margin:0 auto 12px;display:block}
.empty p{font-size:13px;color:var(--hint);line-height:1.8;margin-bottom:18px}
.nores{text-align:center;padding:48px;color:var(--hint);font-size:13px}
.nores svg{width:36px;height:36px;stroke:var(--hint);fill:none;stroke-width:1.2;margin:0 auto 10px;display:block}

/* ══ フルスクリーンオーバーレイ ══ */
.fs-overlay{
  position:fixed;inset:0;z-index:400;
  background:var(--bg);
  display:none;flex-direction:column;
  transform:translateY(100%);
  transition:transform .35s cubic-bezier(.22,.68,0,1.1);
}
.fs-overlay.open{display:flex;transform:translateY(0)}
.fs-hdr{
  height:56px;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0;
}
.fs-back{width:36px;height:36px;border:none;background:var(--surface2);border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--sub);transition:background .15s;flex-shrink:0}
.fs-back:hover{background:var(--border)}
.fs-back svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.fs-title{font-size:1rem;font-weight:700;color:var(--text);flex:1}
.fs-body{flex:1;overflow-y:auto;padding:24px 20px}
.fs-body-inner{max-width:720px;margin:0 auto}
.fs-footer{
  height:60px;background:var(--surface);border-top:1px solid var(--border);
  display:flex;align-items:center;padding:0 20px;gap:10px;flex-shrink:0;justify-content:flex-end;
}

/* ══ クイズ作成フォーム ══ */
.form-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;margin-bottom:16px}
.form-section-title{font-size:11px;font-weight:700;color:var(--hint);text-transform:uppercase;letter-spacing:.6px;margin-bottom:14px}
.fg{margin-bottom:14px}
.lbl{display:block;font-size:11px;font-weight:600;color:var(--hint);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}

/* メディア付き入力欄 */
.inp-with-media{display:flex;align-items:center;gap:6px}
.inp{flex:1;height:38px;padding:0 10px;border:1px solid var(--border);border-radius:8px;font:500 14px 'DM Sans',sans-serif;color:var(--text);background:var(--surface);outline:none;transition:border-color .15s;min-width:0}
.inp:focus{border-color:var(--a);box-shadow:0 0 0 3px var(--al)}
.textarea-wrap{display:flex;align-items:flex-start;gap:6px}
.textarea{flex:1;padding:9px 10px;border:1px solid var(--border);border-radius:8px;font:500 13px 'DM Sans',sans-serif;color:var(--text);background:var(--surface);outline:none;transition:border-color .15s;resize:vertical;min-height:70px;line-height:1.6;min-width:0}
.textarea:focus{border-color:var(--a);box-shadow:0 0 0 3px var(--al)}
.media-icon-btn{
  width:36px;height:36px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:var(--hint);transition:all .15s;flex-shrink:0;position:relative;
}
.media-icon-btn:hover{border-color:var(--a);color:var(--a);background:var(--al)}
.media-icon-btn.has-media{border-color:var(--a);color:var(--a);background:var(--al)}
.media-icon-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
.media-icon-btn .media-dot{
  position:absolute;top:4px;right:4px;width:6px;height:6px;
  border-radius:50%;background:var(--a);display:none;
}
.media-icon-btn.has-media .media-dot{display:block}
.media-icon-btn-group{display:flex;flex-direction:column;gap:4px}
.hidden-file{display:none}

/* カテゴリ */
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.co{display:flex;align-items:center;justify-content:center;gap:4px;padding:10px 4px;border:1px solid var(--border);border-radius:8px;font:600 11px 'DM Sans',sans-serif;color:var(--hint);cursor:pointer;transition:all .15s;background:var(--surface);flex-direction:column}
.co:hover{border-color:var(--border2);color:var(--sub)}
.co .co-icon{font-size:16px;line-height:1}
.co.on{border-color:transparent;color:#fff}
.co[data-c=trivia].on{background:#7c3aed}.co[data-c=general].on{background:#0369a1}
.co[data-c=sns].on{background:#be185d}.co[data-c=music].on{background:#b45309}
.co[data-c=sports].on{background:#047857}.co[data-c=anime].on{background:#b91c1c}
.co[data-c=other].on{background:#4b5563}

/* 時間 */
.time-input-wrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.time-num-input{width:88px;height:38px;padding:0 10px;border:1px solid var(--border);border-radius:8px;font:600 14px 'DM Sans',sans-serif;color:var(--text);background:var(--surface);outline:none;text-align:center;transition:border-color .15s}
.time-num-input:focus{border-color:var(--a)}
.time-unit{font-size:12px;color:var(--sub);font-weight:600}
.time-inf{display:flex;align-items:center;gap:4px;padding:5px 11px;border:1px solid var(--border);border-radius:8px;font:600 12px 'DM Sans',sans-serif;color:var(--hint);cursor:pointer;background:var(--surface);transition:all .15s}
.time-inf.on{border-color:var(--a);color:var(--a);background:var(--al)}
.time-inf svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}

/* ══ 問題追加画面 ══ */
.q-editor-wrap{display:flex;gap:20px;height:calc(100vh - 116px)}
.q-editor-left{flex:1;overflow-y:auto;padding:20px}
.q-editor-right{width:320px;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.q-list-hdr{padding:16px 16px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.q-list-hdr-title{font-size:13px;font-weight:700;color:var(--text)}
.q-list-hdr-cnt{font-size:11px;color:var(--hint)}
.q-list-scroll{flex:1;overflow-y:auto;padding:10px}
.q-item{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:10px 12px;display:flex;align-items:flex-start;gap:8px;margin-bottom:6px;cursor:pointer;transition:all .15s}
.q-item:hover{border-color:var(--border2);box-shadow:var(--shadow)}
.q-item.active{border-color:var(--a);background:var(--al)}
.q-num{width:22px;height:22px;border-radius:50%;background:var(--al);color:var(--a);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.q-item.active .q-num{background:var(--a);color:#fff}
.q-body{flex:1;min-width:0}
.q-text{font-size:12px;font-weight:600;color:var(--text);margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q-type-badge{display:inline-flex;align-items:center;gap:2px;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:600;margin-bottom:3px}
.qt-choice{background:var(--blue-bg);color:var(--blue)}.qt-text{background:var(--green-bg);color:var(--green)}
.q-ans{font-size:11px;color:var(--green);display:flex;align-items:center;gap:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q-ans svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.5;flex-shrink:0}
.q-del-btn{width:22px;height:22px;border-radius:5px;border:none;background:transparent;color:var(--hint);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.q-del-btn:hover{background:var(--red-bg);color:var(--red)}
.q-del-btn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}
.q-add-row{padding:10px;border-top:1px solid var(--border);flex-shrink:0}
.q-add-row button{width:100%;height:36px;border:1.5px dashed var(--border);border-radius:8px;background:transparent;color:var(--hint);font:600 12px 'DM Sans',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;transition:all .15s}
.q-add-row button:hover{border-color:var(--a);color:var(--a)}
.q-add-row button svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.2}

/* 問題エディタ */
.type-toggle{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:3px;margin-bottom:16px}
.type-btn{flex:1;height:32px;border:none;background:transparent;font:600 12px 'DM Sans',sans-serif;color:var(--hint);cursor:pointer;border-radius:6px;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:5px}
.type-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8}
.type-btn.on{background:var(--surface);color:var(--a);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.choices-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.choice-row{display:flex;align-items:center;gap:6px}
.choice-label{font-size:11px;font-weight:700;color:var(--hint);width:16px;flex-shrink:0}
.choice-inp{flex:1;height:36px;padding:0 9px;border:1px solid var(--border);border-radius:7px;font:500 13px 'DM Sans',sans-serif;color:var(--text);background:var(--surface);outline:none;transition:border-color .15s;min-width:0}
.choice-inp:focus{border-color:var(--a)}
.correct-sel{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.correct-btn{padding:5px 14px;border:1px solid var(--border);border-radius:7px;font:600 13px 'DM Sans',sans-serif;color:var(--hint);cursor:pointer;background:var(--surface);transition:all .15s}
.correct-btn:hover{border-color:var(--green);color:var(--green)}
.correct-btn.on{background:var(--green);border-color:var(--green);color:#fff}

/* メディアプレビューポップオーバー */
.media-popover{
  position:fixed;background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:12px;box-shadow:var(--shadow-lg);
  z-index:600;display:none;min-width:200px;
}
.media-popover.open{display:block}
.media-popover-title{font-size:10px;font-weight:700;color:var(--hint);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.media-preview-thumb{width:100%;max-height:120px;object-fit:cover;border-radius:7px;border:1px solid var(--border);display:block;margin-bottom:6px}
.media-preview-audio{width:100%;height:32px;margin-bottom:6px}
.media-preview-name{font-size:11px;color:var(--sub);margin-bottom:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.media-popover-actions{display:flex;gap:6px}
.media-popover-actions button{flex:1;height:28px;border-radius:7px;font:600 11px 'DM Sans',sans-serif;cursor:pointer;border:none;transition:all .15s}
.mpop-change{background:var(--surface2);color:var(--sub)}
.mpop-change:hover{background:var(--border)}
.mpop-del{background:var(--red-bg);color:var(--red)}
.mpop-del:hover{background:#fcd5d0}

/* ══ プレイモーダル ══ */
.ov{position:fixed;inset:0;background:rgba(26,25,23,.5);backdrop-filter:blur(4px);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .2s}
.ov.open{opacity:1;pointer-events:all}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);padding:26px;width:100%;box-shadow:var(--shadow-lg);transform:translateY(12px) scale(.98);transition:transform .22s cubic-bezier(.22,.68,0,1.2);max-height:92vh;overflow-y:auto}
.ov.open .modal{transform:none}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.mt{font-size:1rem;font-weight:700;color:var(--text)}
.mc{width:28px;height:28px;border:none;background:var(--surface2);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--sub);transition:background .15s}
.mc:hover{background:var(--border)}.mc svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
.play-progress{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.progress-bar{flex:1;height:5px;background:var(--surface2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:var(--a);border-radius:3px;transition:width .4s ease}
.progress-text{font-size:11px;font-weight:600;color:var(--hint);white-space:nowrap}
.play-timer-wrap{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.play-timer-bar{flex:1;height:4px;background:var(--surface2);border-radius:2px;overflow:hidden}
.play-timer-fill{height:100%;border-radius:2px;transition:width .9s linear,background .3s}
.play-timer-num{font-size:13px;font-weight:700;color:var(--text);width:32px;text-align:right;font-variant-numeric:tabular-nums}
.play-timer-num.warn{color:var(--red)}
.play-cat-label{font-size:11px;font-weight:700;color:var(--a);text-transform:uppercase;letter-spacing:.8px;margin-bottom:3px}
.play-quiz-title{font-size:1rem;font-weight:700;color:var(--text);margin-bottom:16px;line-height:1.4}
.play-q-num{font-size:11px;font-weight:600;color:var(--hint);margin-bottom:8px}
.play-q-text{font-size:1rem;font-weight:600;color:var(--text);line-height:1.5;margin-bottom:14px}
.play-media-img{max-width:100%;max-height:180px;border-radius:9px;margin-bottom:10px;object-fit:contain;border:1px solid var(--border)}
.play-media-audio{width:100%;height:34px;margin-bottom:10px;border-radius:7px;outline:none}
.play-choices{display:flex;flex-direction:column;gap:7px}
.play-choice{padding:12px 14px;border:1px solid var(--border);border-radius:9px;background:var(--surface);font:600 14px 'DM Sans',sans-serif;color:var(--sub);cursor:pointer;transition:all .15s;text-align:left;display:flex;align-items:center;gap:9px}
.play-choice:hover:not(.answered){border-color:var(--a);color:var(--text);background:var(--al)}
.play-choice .choice-key{width:24px;height:24px;border-radius:6px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;transition:all .15s}
.play-choice:hover:not(.answered) .choice-key{border-color:var(--a);color:var(--a)}
.play-choice.correct{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.play-choice.correct .choice-key{background:var(--green);border-color:var(--green);color:#fff}
.play-choice.wrong{border-color:var(--red);background:var(--red-bg);color:var(--red)}
.play-choice.wrong .choice-key{background:var(--red);border-color:var(--red);color:#fff}
.play-choice.show-correct{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.play-choice.show-correct .choice-key{border-color:var(--green);color:var(--green)}
.play-text-input{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:9px;background:var(--surface);font:600 14px 'DM Sans',sans-serif;color:var(--text);outline:none;transition:border-color .15s;resize:none;line-height:1.5;min-height:72px}
.play-text-input:focus{border-color:var(--a)}
.play-text-submit{width:100%;height:40px;margin-top:7px;border-radius:9px;border:none;background:var(--a);color:#fff;font:700 14px 'DM Sans',sans-serif;cursor:pointer;transition:background .15s}
.play-text-submit:hover{background:var(--a2)}
.play-feedback{padding:11px 13px;border-radius:9px;font:600 13px 'DM Sans',sans-serif;margin-top:12px;display:none}
.play-feedback.show{display:block}
.play-feedback.ok{background:var(--green-bg);color:var(--green);border:1px solid #a7f3d0}
.play-feedback.ng{background:var(--red-bg);color:var(--red);border:1px solid #fecaca}
.play-next{width:100%;height:42px;margin-top:14px;border-radius:9px;border:none;background:var(--a);color:#fff;font:700 14px 'DM Sans',sans-serif;cursor:pointer;transition:background .15s;display:none}
.play-next.show{display:block}.play-next:hover{background:var(--a2)}
.result-screen{display:none;text-align:center;padding:8px 0}
.result-screen.show{display:block}
.result-score{font-family:'DM Serif Display',serif;font-size:3.5rem;color:var(--a);line-height:1;margin-bottom:4px}
.result-label{font-size:13px;color:var(--sub);margin-bottom:22px}
.result-msg{font-size:1rem;font-weight:600;color:var(--text);margin-bottom:6px}
.result-stars{font-size:2rem;margin-bottom:22px;letter-spacing:4px}
.result-detail{display:flex;justify-content:center;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.result-stat{text-align:center;padding:12px 18px;background:var(--surface2);border-radius:10px;border:1px solid var(--border)}
.result-stat-v{font-size:1.3rem;font-weight:700;color:var(--text)}
.result-stat-l{font-size:11px;color:var(--hint);margin-top:2px}
.result-actions{display:flex;gap:8px;justify-content:center}

/* toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--text);color:#fff;padding:8px 18px;border-radius:20px;font:600 13px 'DM Sans',sans-serif;z-index:9999;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
.loading-spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:768px){
  .q-editor-wrap{flex-direction:column;height:auto}
  .q-editor-right{width:100%;border-left:none;border-top:1px solid var(--border)}
}
@media(max-width:640px){
  .grid{grid-template-columns:1fr}
  .cgrid{grid-template-columns:repeat(4,1fr)}
  .choices-grid{grid-template-columns:1fr}
  .hdr-title{display:none}
  .auth-card{padding:28px 20px}
}
@media(max-width:480px){
  :root{--sw:56px}
  .tab span{display:none}
}
</style>
</head>
<body>

<!-- ログイン画面 -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon"><svg viewBox="0 0 24 24"><path d="M9 3H5a2 2 0 00-2 2v4m6-6h10a2 2 0 012 2v4M9 3v18m0 0h10a2 2 0 002-2V9M9 21H5a2 2 0 01-2-2V9m0 0h18"/></svg></div>
      <div class="auth-logo-text">Quiz<em>Hub</em></div>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab on" id="atab-login" onclick="switchAuthTab('login')">ログイン</button>
      <button class="auth-tab" id="atab-signup" onclick="switchAuthTab('signup')">新規登録</button>
    </div>
    <div class="auth-err" id="auth-err"></div>
    <div class="auth-fg">
      <label class="auth-lbl">メールアドレス</label>
      <input class="auth-inp" id="auth-email" type="email" placeholder="your@email.com">
    </div>
    <div class="auth-fg">
      <label class="auth-lbl">パスワード</label>
      <input class="auth-inp" id="auth-password" type="password" placeholder="••••••••" oninput="checkPwStrength(this.value)" onkeydown="if(event.key==='Enter')doAuth()">
    </div>
    <div id="pw-wrap" style="display:none" class="pw-bar-wrap">
      <div class="pw-bar"><div id="pw-bar-fill" class="pw-bar-fill"></div></div>
      <div id="pw-bar-lbl" class="pw-bar-lbl"></div>
    </div>
    <div class="auth-fg" id="auth-name-fg" style="display:none">
      <label class="auth-lbl">表示名（任意）</label>
      <input class="auth-inp" id="auth-name" placeholder="例：クイズ太郎">
    </div>
    <button class="auth-btn" id="auth-submit-btn" onclick="doAuth()">ログイン</button>
    <div class="auth-switch">
      <span id="auth-switch-text">アカウントをお持ちでない方は</span>
      <button onclick="switchAuthTab(currentAuthTab==='login'?'signup':'login')" id="auth-switch-btn">新規登録</button>
    </div>
  </div>
</div>

<!-- メイン画面 -->
<div id="main-screen">
  <aside class="sb">
    <div class="sb-logo"><svg viewBox="0 0 24 24"><path d="M9 3H5a2 2 0 00-2 2v4m6-6h10a2 2 0 012 2v4M9 3v18m0 0h10a2 2 0 002-2V9M9 21H5a2 2 0 01-2-2V9m0 0h18"/></svg></div>
    <button class="sb-btn on" id="sb0" onclick="goTab(0)">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg><span>みんな</span>
    </button>
    <button class="sb-btn" id="sb1" onclick="goTab(1)">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><span>作品</span>
    </button>
    <div class="sb-sp"></div>
    <button class="sb-user" id="sb-user-btn" onclick="toggleUserMenu()">?</button>
  </aside>
  <div class="user-menu" id="user-menu">
    <div class="user-menu-info">
      <div class="user-menu-name" id="um-name">—</div>
      <div class="user-menu-email" id="um-email">—</div>
    </div>
    <button class="user-menu-item danger" onclick="doLogout();closeUserMenu()">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>ログアウト
    </button>
  </div>
  <div class="main">
    <header class="hdr">
      <div class="hdr-title">Quiz<em>Hub</em></div>
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="クイズを検索..." oninput="onSearch(this.value)">
      </div>
      <button class="btn bp" onclick="openCreateScreen()">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>新規作成
      </button>
    </header>
    <div class="profile-bar">
      <div class="profile-bar-ava" id="profile-ava">?</div>
      <div>
        <div class="profile-bar-name" id="profile-name">—</div>
        <div class="profile-bar-email" id="profile-email">—</div>
      </div>
    </div>
    <div class="tabs">
      <button class="tab on" id="t0" onclick="goTab(0)">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg><span>みんなの作品</span>
      </button>
      <button class="tab" id="t1" onclick="goTab(1)">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><span>自分の作品</span>
      </button>
    </div>
    <div class="cats" id="cat-bar">
      <button class="pill p-all on" data-c="all" onclick="setCat('all')">すべて</button>
      <button class="pill p-trivia" data-c="trivia" onclick="setCat('trivia')"><span>🧠</span>雑学</button>
      <button class="pill p-general" data-c="general" onclick="setCat('general')"><span>📚</span>一般常識</button>
      <button class="pill p-sns" data-c="sns" onclick="setCat('sns')"><span>📱</span>SNS</button>
      <button class="pill p-music" data-c="music" onclick="setCat('music')"><span>🎵</span>音楽</button>
      <button class="pill p-sports" data-c="sports" onclick="setCat('sports')"><span>⚽</span>スポーツ</button>
      <button class="pill p-anime" data-c="anime" onclick="setCat('anime')"><span>🎌</span>アニメ</button>
      <button class="pill p-other" data-c="other" onclick="setCat('other')"><span>✨</span>その他</button>
    </div>
    <div class="content">
      <div class="pane on" id="p0">
        <div class="ph"><div class="pt" id="com-label">みんなのクイズ</div></div>
        <div class="grid" id="com-grid"></div>
        <div class="empty" id="com-empty" style="display:none">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          <p>まだクイズがありません。<br>「新規作成」で最初のクイズを作りましょう！</p>
          <button class="btn bp" style="margin:0 auto" onclick="openCreateScreen()"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>新規作成</button>
        </div>
        <div class="nores" id="com-nores" style="display:none">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          該当するクイズが見つかりませんでした
        </div>
      </div>
      <div class="pane" id="p1">
        <div class="ph">
          <div class="pt">自分の作品 <span id="mine-cnt" style="color:var(--hint);font-weight:400">(0)</span></div>
          <button class="btn bp" onclick="openCreateScreen()"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>新しいクイズを作る</button>
        </div>
        <div class="grid" id="mine-grid" style="display:none"></div>
        <div class="empty" id="mine-empty">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          <p>まだ作品がありません。</p>
          <button class="btn bp" style="margin:0 auto" onclick="openCreateScreen()"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>最初のクイズを作る</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ══ クイズ作成 フルスクリーン ══ -->
<div class="fs-overlay" id="create-screen">
  <div class="fs-hdr">
    <button class="fs-back" onclick="closeCreateScreen()"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
    <div class="fs-title">クイズを作成</div>
    <button class="btn bg btn-sm" onclick="startTrialPlay()" style="margin-right:8px">
      <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3" fill="currentColor" stroke="none"/></svg>試しプレイ
    </button>
    <button class="btn bp btn-sm" id="submit-quiz-btn" onclick="submitQuiz()">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>保存して投稿
    </button>
  </div>
  <div class="fs-body">
    <div class="fs-body-inner">
      <!-- タイトル -->
      <div class="form-section">
        <div class="form-section-title">基本情報</div>
        <div class="fg">
          <label class="lbl">タイトル *</label>
          <div class="inp-with-media">
            <input class="inp" id="m-title" placeholder="例：ワンピース雑学クイズ！" maxlength="60">
            <div class="media-icon-btn-group">
              <button class="media-icon-btn" id="btn-title-img" onclick="openMediaPop('title-img',event)" title="タイトル画像">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                <div class="media-dot"></div>
              </button>
              <button class="media-icon-btn" id="btn-title-aud" onclick="openMediaPop('title-aud',event)" title="タイトル音声">
                <svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 010 7.07"/></svg>
                <div class="media-dot"></div>
              </button>
            </div>
            <input type="file" accept="image/*" class="hidden-file" id="title-img-file" onchange="handleMedia(this,'title-img')">
            <input type="file" accept="audio/*" class="hidden-file" id="title-aud-file" onchange="handleMedia(this,'title-aud')">
          </div>
        </div>
        <div class="fg">
          <label class="lbl">カテゴリ *</label>
          <div class="cgrid">
            <div class="co" data-c="trivia" onclick="selCat('trivia')"><span class="co-icon">🧠</span>雑学</div>
            <div class="co" data-c="general" onclick="selCat('general')"><span class="co-icon">📚</span>一般常識</div>
            <div class="co" data-c="sns" onclick="selCat('sns')"><span class="co-icon">📱</span>SNS</div>
            <div class="co" data-c="music" onclick="selCat('music')"><span class="co-icon">🎵</span>音楽</div>
            <div class="co" data-c="sports" onclick="selCat('sports')"><span class="co-icon">⚽</span>スポーツ</div>
            <div class="co" data-c="anime" onclick="selCat('anime')"><span class="co-icon">🎌</span>アニメ</div>
            <div class="co" data-c="other" onclick="selCat('other')"><span class="co-icon">✨</span>その他</div>
          </div>
        </div>
        <div class="fg" style="margin-bottom:0">
          <label class="lbl">時間制限（1問ごと）</label>
          <div class="time-input-wrap">
            <input type="number" class="time-num-input" id="m-time-sec" min="5" max="3600" value="30">
            <span class="time-unit">秒 / 問</span>
            <div class="time-inf" id="time-inf-btn" onclick="toggleInfinite()">
              <svg viewBox="0 0 24 24"><path d="M18.178 8c5.096 0 5.096 8 0 8-5.095 0-7.133-8-12.739-8-4.585 0-4.585 8 0 8 5.606 0 7.644-8 12.74-8z"/></svg>無制限
            </div>
          </div>
        </div>
      </div>

      <!-- 問題追加ボタン -->
      <div style="text-align:center;margin-bottom:12px">
        <button class="btn bp" onclick="openQScreen()">
          <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>問題を追加・編集する
        </button>
        <div style="font-size:12px;color:var(--hint);margin-top:8px">問題 <span id="q-count-badge" style="color:var(--a);font-weight:700">0問</span></div>
      </div>
    </div>
  </div>
</div>

<!-- ══ 問題追加 フルスクリーン ══ -->
<div class="fs-overlay" id="qscreen">
  <div class="fs-hdr">

const COLORS=['#2d5be3','#e05b2e','#1a8a50','#be185d','#b45309','#0369a1','#b91c1c','#7c3aed'];

let currentUser=null,onlineQuizzes=[],filterCat='all',searchQ='';
let mCat=null,mInfinite=false,draftQs=[];
let currentQIdx=null,qType='choice',correctIdx=null;

const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const tl=v=>v===0?'∞':v+'秒';
function ago(ts){const m=Math.floor((Date.now()-new Date(ts).getTime())/60000);if(m<1)return'たった今';if(m<60)return m+'分前';const h=Math.floor(m/60);if(h<24)return h+'時間前';return Math.floor(h/24)+'日前';}
function getUserName(){return currentUser?.user_metadata?.display_name||currentUser?.email?.split('@')[0]||'ユーザー';}

// 画面切り替え
function showAuthScreen(){document.getElementById('auth-screen').style.display='flex';document.getElementById('main-screen').style.display='none';}
function showMainScreen(){
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('main-screen').style.display='flex';
  const name=getUserName(),email=currentUser.email||'',initial=name[0].toUpperCase(),color=COLORS[name.charCodeAt(0)%COLORS.length];
  document.getElementById('profile-ava').textContent=initial;document.getElementById('profile-ava').style.background=color;
  document.getElementById('profile-name').textContent=name;document.getElementById('profile-email').textContent=email;

// 認証
function switchAuthTab(tab){
  currentAuthTab=tab;
  document.getElementById('atab-login').classList.toggle('on',tab==='login');
  document.getElementById('atab-signup').classList.toggle('on',tab==='signup');
  document.getElementById('auth-submit-btn').textContent=tab==='login'?'ログイン':'アカウント作成';
  document.getElementById('auth-name-fg').style.display=tab==='signup'?'':'none';
  document.getElementById('pw-wrap').style.display='none';
  document.getElementById('auth-switch-text').textContent=tab==='login'?'アカウントをお持ちでない方は':'すでにアカウントをお持ちの方は';
  document.getElementById('auth-switch-btn').textContent=tab==='login'?'新規登録':'ログイン';
  document.getElementById('auth-err').textContent='';
}
function checkPwStrength(pw){
  if(currentAuthTab!=='signup')return;
  document.getElementById('pw-wrap').style.display=pw.length>0?'':'none';
  let s=0;if(pw.length>=8)s++;if(/[A-Z]/.test(pw))s++;if(/[0-9]/.test(pw))s++;if(/[^a-zA-Z0-9]/.test(pw))s++;
  const levels=[{w:'25%',c:'#e24b4a',t:'弱い'},{w:'50%',c:'#ef9f27',t:'まあまあ'},{w:'75%',c:'#97c459',t:'良い'},{w:'100%',c:'#1a8a50',t:'強い'}];
  const l=levels[Math.min(s,3)];
  document.getElementById('pw-bar-fill').style.cssText=`width:${l.w};background:${l.c}`;
  document.getElementById('pw-bar-lbl').textContent=l.t;
}
async function doAuth(){
  const email=document.getElementById('auth-email').value.trim();
  const password=document.getElementById('auth-password').value;
  const errEl=document.getElementById('auth-err');errEl.textContent='';errEl.style.color='var(--red)';
  if(!email||!password){errEl.textContent='メールアドレスとパスワードを入力してください';return;}
  const btn=document.getElementById('auth-submit-btn');
  btn.innerHTML='<span class="loading-spinner"></span>';btn.disabled=true;
  if(currentAuthTab==='login'){
    const{data,error}=await sb.auth.signInWithPassword({email,password});
    if(error){errEl.textContent=error.message;btn.textContent='ログイン';btn.disabled=false;return;}
    currentUser=data.user;await loadOnlineQuizzes();showMainScreen();render();toast('✅ ログインしました');
  }else{
    const name=document.getElementById('auth-name').value.trim();
    const{data,error}=await sb.auth.signUp({email,password,options:{data:{display_name:name||email.split('@')[0]}}});
    if(error){errEl.textContent=error.message;btn.textContent='アカウント作成';btn.disabled=false;return;}
    if(data.user&&data.session){
      currentUser=data.user;await loadOnlineQuizzes();showMainScreen();render();toast('✅ 登録してログインしました！');
    }else{
      errEl.style.color='var(--green)';errEl.textContent='確認メールを送りました。確認後ログインしてください。';btn.textContent='アカウント作成';
    }
  }
  btn.disabled=false;
}
async function doLogout(){await sb.auth.signOut();currentUser=null;onlineQuizzes=[];showAuthScreen();toast('👋 ログアウトしました');}

// データ
async function loadOnlineQuizzes(){
  try{
    let q=sb.from('quizzes').select('*').order('created_at',{ascending:false});
    if(filterCat!=='all')q=q.eq('cat',filterCat);
    const{data,error}=await q.limit(200);
    if(error)throw error;
    onlineQuizzes=(data||[]).map(r=>({id:r.id,title:r.title,cat:r.cat,timeLimit:r.time_limit,questions:r.questions,author:r.author,authorColor:r.author_color,userId:r.user_id,createdAt:r.created_at}));
  }catch(e){console.error(e);}
}

// カード
function cardHTML(z){
  const ci=CATS[z.cat]||{};const isMine=currentUser&&z.userId===currentUser.id;
  return`<div class="card">
    <div class="card-actions">
      <button class="icon-btn ib-play" onclick="startPlay('${z.id}')" title="プレイ"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3" fill="currentColor" stroke="none"/></svg></button>
      ${isMine?`<button class="icon-btn ib-del" onclick="delQuiz('${z.id}',event)"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg></button>`:''}
    </div>
    <div class="card-badge-row"><div class="card-cat ${ci.c}">${ci.e} ${ci.l}</div></div>
    <div class="card-title">${esc(z.title)}</div>
    <div class="card-meta">
      <span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>${tl(z.timeLimit)}</span>
      <span><svg viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0011 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 01-7 7 7 7 0 01-5-3z"/></svg>${(z.questions||[]).length}問</span>
    </div>
    <div class="card-foot">
      <div class="card-author"><div class="ava" style="background:${z.authorColor||'#2d5be3'}">${(z.author||'?')[0].toUpperCase()}</div>${esc(z.author||'ゲスト')}</div>
      <span class="card-date">${ago(z.createdAt)}</span>
    </div>
  </div>`;
}

function renderCom(){
  const grid=document.getElementById('com-grid'),empty=document.getElementById('com-empty'),nores=document.getElementById('com-nores');
  let list=onlineQuizzes.filter(z=>(filterCat==='all'||z.cat===filterCat)&&(!searchQ||z.title.toLowerCase().includes(searchQ)));
  if(!onlineQuizzes.length){grid.innerHTML='';grid.style.display='none';empty.style.display='';nores.style.display='none';document.getElementById('com-label').textContent='みんなのクイズ';return;}
  empty.style.display='none';
  if(!list.length){grid.style.display='none';nores.style.display='';document.getElementById('com-label').textContent='検索結果 (0件)';return;}
  nores.style.display='none';grid.style.display='';
  grid.innerHTML=list.map(cardHTML).join('');
  document.getElementById('com-label').textContent=(filterCat!=='all'||searchQ)?`検索結果 (${list.length}件)`:`みんなのクイズ (${list.length}件)`;
}
function renderMine(){
  const grid=document.getElementById('mine-grid'),empty=document.getElementById('mine-empty');
  const mine=onlineQuizzes.filter(z=>currentUser&&z.userId===currentUser.id);
  document.getElementById('mine-cnt').textContent=`(${mine.length})`;
  if(!mine.length){grid.style.display='none';empty.style.display='';}
  else{empty.style.display='none';grid.style.display='';grid.innerHTML=mine.map(cardHTML).join('');}
}
function render(){renderCom();renderMine();}

  document.querySelectorAll('.co').forEach(el=>el.classList.remove('on'));
  // メディアリセット
  ['title-img','title-aud'].forEach(k=>{delete mediaStore[k];updateMediaBtn(k);});
  updateQCountBadge();
  const el=document.getElementById('create-screen');
  el.style.display='flex';
  requestAnimationFrame(()=>el.classList.add('open'));
}
function closeCreateScreen(){
  const el=document.getElementById('create-screen');
  el.classList.remove('open');
  setTimeout(()=>{el.style.display='none';},350);
}

function openQScreen(){
  // 新規問題で開く
  currentQIdx=null;
  resetQEditor();
  const el=document.getElementById('qscreen');
  el.style.display='flex';
  requestAnimationFrame(()=>el.classList.add('open'));
  renderQList();
}
function closeQScreen(){
  const el=document.getElementById('qscreen');
  el.classList.remove('open');
  setTimeout(()=>{el.style.display='none';},350);
  updateQCountBadge();
}

function updateQCountBadge(){
  document.getElementById('q-count-badge').textContent=draftQs.length+'問';
}

// ══ メディアポップオーバー ══
function openMediaPop(key,e){
  e.stopPropagation();
  currentMediaKey=key;
  const pop=document.getElementById('media-popover');
  const btn=e.currentTarget;
  const rect=btn.getBoundingClientRect();
  const titles={'title-img':'タイトル画像','title-aud':'タイトル音声','qimg':'問題画像','qaud':'問題音声','cha-img':'選択肢A画像','chb-img':'選択肢B画像','chc-img':'選択肢C画像','chd-img':'選択肢D画像','expimg':'解説画像','expaud':'解説音声'};
  document.getElementById('mpop-title').textContent=titles[key]||key;
  const prev=document.getElementById('mpop-preview');
  if(mediaStore[key]){
    const isImg=mediaStore[key].type.startsWith('image/');
    const isAud=mediaStore[key].type.startsWith('audio/');
    if(isImg)prev.innerHTML=`<img class="media-preview-thumb" src="${mediaStore[key].dataUrl}" alt=""><div class="media-preview-name">${esc(mediaStore[key].name)}</div>`;
    else if(isAud)prev.innerHTML=`<audio class="media-preview-audio" controls src="${mediaStore[key].dataUrl}"></audio><div class="media-preview-name">${esc(mediaStore[key].name)}</div>`;
  }else{
    prev.innerHTML=`<div style="font-size:12px;color:var(--hint);margin-bottom:8px;text-align:center">まだ設定されていません</div>`;
  }
pop.style.top=(rect.bottom+6)+'px';
  pop.style.left=Math.min(rect.left,window.innerWidth-220)+'px';
  // ↓↓↓ ここに追加 ↓↓↓
  const hasMedia = !!mediaStore[key];
  const label = document.getElementById('mpop-change-label');
  const fi = document.getElementById('mpop-file-input');
  label.childNodes[0].textContent = hasMedia ? '変更' : '追加';
  fi.accept = key.includes('aud') ? 'audio/*' : 'image/*';
  fi.dataset.key = key;
  fi.value = '';
  document.getElementById('mpop-del').style.display = hasMedia ? '' : 'none';
  // ↑↑↑ ここまで ↑↑↑

  pop.classList.add('open');
}
function closeMediaPop(){document.getElementById('media-popover').classList.remove('open');currentMediaKey=null;}
function changeMedia(){
  if(!currentMediaKey) return;
  const key = currentMediaKey;
  closeMediaPop();
  
  setTimeout(() => {
    const fi = document.getElementById(key + '-file');
    if(fi) fi.click();
  }, 100);
}
function deleteMedia(){
  if(!currentMediaKey)return;
  delete mediaStore[currentMediaKey];
  updateMediaBtn(currentMediaKey);
  closeMediaPop();
  toast('🗑️ 削除しました');
}

// ↓↓↓ ここに追加 ↓↓↓
function handleMediaPop(input){
  const file = input.files[0];
  if(!file) return;
  // closeMediaPopの前にkeyを保存
  const key = currentMediaKey || input.dataset.key;
  if(!key) return;
  const reader = new FileReader();
  reader.onload = e => {
    mediaStore[key] = {dataUrl: e.target.result, name: file.name, type: file.type};
    updateMediaBtn(key);
    toast('✅ メディアを設定しました');
  };
  reader.readAsDataURL(file);
  currentMediaKey = null;
  document.getElementById('media-popover').classList.remove('open');
}
// ↑↑↑ ここまで ↑↑↑

function handleMedia(input,key){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{mediaStore[key]={dataUrl:e.target.result,name:file.name,type:file.type};updateMediaBtn(key);};
  reader.readAsDataURL(file);
}
function updateMediaBtn(key){
  const btnId='btn-'+key;
  const btn=document.getElementById(btnId);
  if(btn)btn.classList.toggle('has-media',!!mediaStore[key]);
}

// ══ 問題エディタ ══
function setQType(t){
  qType=t;
  document.getElementById('type-choice-btn').classList.toggle('on',t==='choice');
  document.getElementById('type-text-btn').classList.toggle('on',t==='text');
  document.getElementById('choice-area').style.display=t==='choice'?'':'none';
  document.getElementById('text-area').style.display=t==='text'?'':'none';
}
function selCorrect(i){correctIdx=i;document.querySelectorAll('.correct-btn').forEach((b,j)=>b.classList.toggle('on',j===i));}
function selCat(c){mCat=c;document.querySelectorAll('.co').forEach(el=>el.classList.toggle('on',el.dataset.c===c));}
function toggleInfinite(){
  mInfinite=!mInfinite;
  document.getElementById('time-inf-btn').classList.toggle('on',mInfinite);
  document.getElementById('m-time-sec').disabled=mInfinite;
  document.getElementById('m-time-sec').style.opacity=mInfinite?'0.4':'1';
}

function resetQEditor(){
  qType='choice';correctIdx=null;
  document.getElementById('aq-text').value='';
  ['ch-a','ch-b','ch-c','ch-d','aq-exp','text-ans'].forEach(id=>document.getElementById(id).value='');
  document.querySelectorAll('.correct-btn').forEach(b=>b.classList.remove('on'));
  setQType('choice');
  ['qimg','qaud','cha-img','chb-img','chc-img','chd-img','expimg','expaud'].forEach(k=>{
    delete mediaStore[k];updateMediaBtn(k);
    const f=document.getElementById(k+'-file');if(f)f.value='';
  });
}

function loadQToEditor(idx){
  currentQIdx=idx;
  const q=draftQs[idx];
  resetQEditor();
  setQType(q.type);
  document.getElementById('aq-text').value=q.text||'';
  document.getElementById('aq-exp').value=q.explanation||'';
  if(q.type==='choice'){
    ['ch-a','ch-b','ch-c','ch-d'].forEach((id,i)=>document.getElementById(id).value=q.choices[i]||'');
    correctIdx=q.correct;
    document.querySelectorAll('.correct-btn').forEach((b,j)=>b.classList.toggle('on',j===correctIdx));
    if(q.choiceImages){
      ['cha-img','chb-img','chc-img','chd-img'].forEach((k,i)=>{
        if(q.choiceImages[i]){mediaStore[k]={dataUrl:q.choiceImages[i],name:'image',type:'image/jpeg'};updateMediaBtn(k);}
      });
    }
  }else{
    document.getElementById('text-ans').value=q.textAnswer||'';
  }
  if(q.questionImage){mediaStore['qimg']={dataUrl:q.questionImage,name:'image',type:'image/jpeg'};updateMediaBtn('qimg');}
  if(q.questionAudio){mediaStore['qaud']={dataUrl:q.questionAudio,name:'audio',type:'audio/mpeg'};updateMediaBtn('qaud');}
  if(q.explanationImage){mediaStore['expimg']={dataUrl:q.explanationImage,name:'image',type:'image/jpeg'};updateMediaBtn('expimg');}
  if(q.explanationAudio){mediaStore['expaud']={dataUrl:q.explanationAudio,name:'audio',type:'audio/mpeg'};updateMediaBtn('expaud');}
  renderQList();
}

function addNewQ(){
  currentQIdx=null;
  resetQEditor();
  renderQList();
  document.getElementById('q-editor-left').scrollTop=0;
}

function saveCurrentQ(){
  const text=document.getElementById('aq-text').value.trim();
  if(!text)return toast('❗ 問題文を入力してください');
  const exp=document.getElementById('aq-exp').value.trim();
  const q={type:qType,text,explanation:exp,
    questionImage:mediaStore['qimg']?.dataUrl||null,questionAudio:mediaStore['qaud']?.dataUrl||null,
    explanationImage:mediaStore['expimg']?.dataUrl||null,explanationAudio:mediaStore['expaud']?.dataUrl||null,
  };
  if(qType==='choice'){
    const choices=['ch-a','ch-b','ch-c','ch-d'].map(id=>document.getElementById(id).value.trim());
    if(choices.some(c=>!c))return toast('❗ 選択肢A〜Dをすべて入力してください');
    if(correctIdx===null)return toast('❗ 正解を選択してください');
    q.choices=choices;q.correct=correctIdx;
    q.choiceImages=['cha-img','chb-img','chc-img','chd-img'].map(k=>mediaStore[k]?.dataUrl||null);
  }else{
    const ans=document.getElementById('text-ans').value.trim();
    if(!ans)return toast('❗ 模範解答を入力してください');
    q.textAnswer=ans;
  }
  if(currentQIdx!==null){
    draftQs[currentQIdx]=q;toast('✅ 問題を更新しました');
  }else{
    draftQs.push(q);currentQIdx=draftQs.length-1;toast(`✅ 問題${draftQs.length}を追加しました`);
  }
  renderQList();
  updateQCountBadge();
}

function renderQList(){
  const scroll=document.getElementById('q-list-scroll');
  document.getElementById('q-list-cnt').textContent=draftQs.length+'問';
  if(!draftQs.length){scroll.innerHTML=`<div style="text-align:center;padding:32px 16px;color:var(--hint);font-size:12px">まだ問題がありません<br>左のエディタで作成して保存してください</div>`;return;}
  scroll.innerHTML=draftQs.map((q,i)=>{
    const isChoice=q.type==='choice';const ansText=isChoice?q.choices[q.correct]:q.textAnswer;
    const isActive=currentQIdx===i;
    return`<div class="q-item${isActive?' active':''}" onclick="loadQToEditor(${i})">
      <div class="q-num">${i+1}</div>
      <div class="q-body">
        <span class="q-type-badge ${isChoice?'qt-choice':'qt-text'}">${isChoice?'選択式':'記述式'}</span>
        <div class="q-text">${esc(q.text)}</div>
        <div class="q-ans"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>${esc(ansText)}</div>
      </div>
      <button class="q-del-btn" onclick="removeQ(${i},event)"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>`;
  }).join('');
}
function removeQ(i,e){e.stopPropagation();draftQs.splice(i,1);if(currentQIdx===i){currentQIdx=null;resetQEditor();}else if(currentQIdx>i)currentQIdx--;renderQList();updateQCountBadge();toast('🗑️ 削除しました');}

// 試しプレイ
function startTrialPlay(){
  if(!draftQs.length)return toast('❗ 問題を1つ以上追加してください');
  const title=document.getElementById('m-title').value.trim()||'プレビュークイズ';
  const cat=mCat||'other';
  const timeSec=mInfinite?0:parseInt(document.getElementById('m-time-sec').value)||30;
  const trialQuiz={id:'trial',title,cat,timeLimit:timeSec,questions:draftQs};
  startPlayFromObj(trialQuiz);
}

async function submitQuiz(){
  const title=document.getElementById('m-title').value.trim();
  if(!title)return toast('❗ タイトルを入力してください');
  if(!mCat)return toast('❗ カテゴリを選択してください');
  const timeSec=mInfinite?0:parseInt(document.getElementById('m-time-sec').value)||30;
  if(!mInfinite&&(timeSec<1||timeSec>3600))return toast('❗ 時間制限は1〜3600秒で入力してください');
  if(!draftQs.length)return toast('❗ 問題を1つ以上追加してください');
  const btn=document.getElementById('submit-quiz-btn');
  btn.innerHTML='<span class="loading-spinner"></span>';btn.disabled=true;
  const{error}=await sb.from('quizzes').insert({
    title,cat:mCat,time_limit:timeSec,questions:draftQs,
    author:getUserName(),author_color:COLORS[Math.floor(Math.random()*COLORS.length)],
    user_id:currentUser.id,
  });
  btn.textContent='保存して投稿';btn.disabled=false;
  if(error){toast('❌ 保存失敗: '+error.message);return;}
  await loadOnlineQuizzes();
  closeCreateScreen();render();toast('✅ オンラインに投稿しました！');
}

async function delQuiz(id,e){
  e.stopPropagation();
  if(!confirm('このクイズを削除しますか？'))return;
  const{error}=await sb.from('quizzes').delete().eq('id',id).eq('user_id',currentUser.id);
  if(error){toast('❌ 削除失敗');return;}
  await loadOnlineQuizzes();render();toast('🗑️ 削除しました');
}

// プレイ
function startPlay(id){
  const z=onlineQuizzes.find(z=>z.id===id);
  if(!z||!z.questions||!z.questions.length)return toast('❗ 問題がありません');
  startPlayFromObj(z);
}
function startPlayFromObj(z){
  playQuiz=z;playIdx=0;playScore=0;playAnswered=false;
  document.getElementById('play-game').style.display='block';
  document.getElementById('play-result').classList.remove('show');
  const ci=CATS[z.cat]||{};
  document.getElementById('play-cat-label').textContent=ci.e+' '+ci.l;
  document.getElementById('play-quiz-title').textContent=z.title;
  showQuestion();openOv('play-ov');
}
function showQuestion(){
  playAnswered=false;
  const q=playQuiz.questions[playIdx],total=playQuiz.questions.length;
  document.getElementById('prog-fill').style.width=Math.round(playIdx/total*100)+'%';
  document.getElementById('prog-text').textContent=`${playIdx}/${total}`;
  document.getElementById('play-q-num').textContent=`Q${playIdx+1}`;
  document.getElementById('play-q-text').textContent=q.text;
  document.getElementById('play-fb').className='play-feedback';document.getElementById('play-fb').textContent='';
  document.getElementById('play-next').className='play-next';
  document.getElementById('play-exp-img').style.display='none';document.getElementById('play-exp-audio').style.display='none';
  const qImg=document.getElementById('play-q-img');
  if(q.questionImage){qImg.src=q.questionImage;qImg.style.display='';}else qImg.style.display='none';
  const qAud=document.getElementById('play-q-audio');
  if(q.questionAudio){qAud.src=q.questionAudio;qAud.style.display='';}else qAud.style.display='none';
  const labels=['A','B','C','D'],choicesEl=document.getElementById('play-choices');
  if(q.type==='choice'){
    choicesEl.innerHTML=q.choices.map((c,i)=>{
      const imgHtml=q.choiceImages&&q.choiceImages[i]?`<img src="${q.choiceImages[i]}" style="width:44px;height:44px;object-fit:cover;border-radius:5px;border:1px solid var(--border);flex-shrink:0" alt="">`:'';
      return`<button class="play-choice" onclick="answer(${i})"><span class="choice-key">${labels[i]}</span>${imgHtml}${esc(c)}</button>`;
    }).join('');
  }else{
    choicesEl.innerHTML=`<textarea class="play-text-input" id="play-text-inp" placeholder="答えを入力してください..." rows="3"></textarea><button class="play-text-submit" onclick="answerText()">回答する</button>`;
  }
  startTimer(playQuiz.timeLimit);
}
function showExpMedia(q){
  if(q.explanationImage){const ei=document.getElementById('play-exp-img');ei.src=q.explanationImage;ei.style.display='';}
  if(q.explanationAudio){const ea=document.getElementById('play-exp-audio');ea.src=q.explanationAudio;ea.style.display='';}
}
function answer(idx){
  if(playAnswered)return;playAnswered=true;clearInterval(timerInterval);
  const q=playQuiz.questions[playIdx],choices=document.querySelectorAll('.play-choice');
  choices.forEach(b=>b.classList.add('answered'));
  const fb=document.getElementById('play-fb');
  if(idx===q.correct){playScore++;choices[idx].classList.add('correct');fb.className='play-feedback ok show';fb.textContent='✓ 正解！'+(q.explanation?' — '+q.explanation:'');}
  else{choices[idx].classList.add('wrong');choices[q.correct].classList.add('show-correct');fb.className='play-feedback ng show';fb.textContent='✗ 不正解。正解は「'+q.choices[q.correct]+'」'+(q.explanation?' — '+q.explanation:'');}
  showExpMedia(q);
  const nextBtn=document.getElementById('play-next');nextBtn.className='play-next show';nextBtn.textContent=playIdx+1<playQuiz.questions.length?'次の問題 →':'結果を見る';
}
function answerText(){
  if(playAnswered)return;const inp=document.getElementById('play-text-inp');if(!inp)return;
  const userAns=inp.value.trim();if(!userAns)return toast('❗ 答えを入力してください');
  playAnswered=true;clearInterval(timerInterval);
  const q=playQuiz.questions[playIdx];
  const norm=s=>s.toLowerCase().replace(/\s/g,'');
  const correct=norm(userAns).includes(norm(q.textAnswer))||norm(q.textAnswer).includes(norm(userAns));
  inp.disabled=true;document.querySelector('.play-text-submit').disabled=true;
  const fb=document.getElementById('play-fb');
  if(correct){playScore++;inp.style.borderColor='var(--green)';fb.className='play-feedback ok show';fb.textContent='✓ 正解！'+(q.explanation?' — '+q.explanation:'');}
  else{inp.style.borderColor='var(--red)';fb.className='play-feedback ng show';fb.textContent='✗ 不正解。正解は「'+q.textAnswer+'」'+(q.explanation?' — '+q.explanation:'');}
  showExpMedia(q);
  const nextBtn=document.getElementById('play-next');nextBtn.className='play-next show';nextBtn.textContent=playIdx+1<playQuiz.questions.length?'次の問題 →':'結果を見る';
}
function nextQ(){playIdx++;if(playIdx>=playQuiz.questions.length){showResult();return;}showQuestion();}
function showResult(){
  clearInterval(timerInterval);
  const total=playQuiz.questions.length;
  document.getElementById('prog-fill').style.width='100%';document.getElementById('prog-text').textContent=`${total}/${total}`;
  document.getElementById('play-game').style.display='none';document.getElementById('play-result').classList.add('show');
  const pct=Math.round(playScore/total*100);
  document.getElementById('res-score').textContent=playScore*10;document.getElementById('res-total').textContent=total*10;
  document.getElementById('res-correct').textContent=playScore+'問';document.getElementById('res-wrong').textContent=(total-playScore)+'問';
  document.getElementById('res-rate').textContent=pct+'%';
  let stars='⭐',msg;
  if(pct>=90){stars='🌟🌟🌟';msg='完璧！天才クイズマスター！'}
  else if(pct>=70){stars='⭐⭐⭐';msg='素晴らしい！よく勉強してるね！'}
  else if(pct>=50){stars='⭐⭐';msg='惜しい！もう一度チャレンジ！'}
  else{stars='⭐';msg='まだまだ！もう一度頑張ろう！'}
  document.getElementById('res-stars').textContent=stars;document.getElementById('res-msg').textContent=msg;
}
function closePlay(){clearInterval(timerInterval);closeOv('play-ov');}
function restartPlay(){if(!playQuiz)return;startPlayFromObj(playQuiz);}

// タイマー
function startTimer(sec){
  clearInterval(timerInterval);
  if(sec===0){document.getElementById('timer-wrap').style.display='none';return;}
  timerSec=sec;timerRemain=sec;document.getElementById('timer-wrap').style.display='flex';
  updateTimerUI();
  timerInterval=setInterval(()=>{timerRemain--;updateTimerUI();if(timerRemain<=0){clearInterval(timerInterval);timeUp();}},1000);
}
function updateTimerUI(){
  const pct=timerSec>0?Math.round(timerRemain/timerSec*100):0;
  const fill=document.getElementById('timer-fill'),num=document.getElementById('timer-num');
  fill.style.width=pct+'%';fill.style.background=timerRemain<=5?'var(--red)':timerRemain<=10?'var(--gold)':'var(--a)';
  num.textContent=timerRemain;num.className='play-timer-num'+(timerRemain<=5?' warn':'');
}
function timeUp(){
  if(playAnswered)return;playAnswered=true;
  document.querySelectorAll('.play-choice').forEach(b=>b.classList.add('answered'));
  const q=playQuiz.questions[playIdx];
  const fb=document.getElementById('play-fb');
  fb.className='play-feedback ng show';
  fb.textContent='⏱ 時間切れ！正解は「'+(q.type==='choice'?q.choices[q.correct]:q.textAnswer)+'」'+(q.explanation?' — '+q.explanation:'');
  if(q.type==='choice'){const btns=document.querySelectorAll('.play-choice');if(btns[q.correct])btns[q.correct].classList.add('show-correct');}
  showExpMedia(q);
  const nextBtn=document.getElementById('play-next');nextBtn.className='play-next show';nextBtn.textContent=playIdx+1<playQuiz.questions.length?'次の問題 →':'結果を見る';
}

// toast
let tt;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),2800);}

// 初期化
(async()=>{
  const{data:{session}}=await sb.auth.getSession();
  if(session&&session.user){currentUser=session.user;await loadOnlineQuizzes();showMainScreen();render();}
  else showAuthScreen();
  sb.auth.onAuthStateChange(async(_,sess)=>{
    if(sess&&sess.user){currentUser=sess.user;await loadOnlineQuizzes();showMainScreen();render();}
    else{currentUser=null;showAuthScreen();}
  });
})();
</script>
