.tbar{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;padding:10px 16px;background:var(--bar);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--sep);margin-top:8px}

.editor{position:absolute;inset:0;z-index:28;background:var(--bg);display:none;flex-direction:column}.editor.on{display:flex}

.meta{margin-top:12px;font-size:13px;color:var(--sub)}
.sbar{position:absolute;left:0;right:0;bottom:0;z-index:12;display:none;background:var(--bar);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:.5px solid var(--sep);padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.sbar .sn{display:flex;justify-content:space-between;align-items:center;padding:4px 8px;font-size:13px;color:var(--sub)}.sbar .sn button{background:none;border:0;color:var(--blue);font-size:14px;font-family:inherit}
.sbar .sa{display:flex;justify-content:space-around}.sbar .sa button{background:none;border:0;color:var(--blue);font-size:15px;font-family:inherit;padding:8px 6px}.sbar .d{color:#ff3b30}
.hint{margin:0 16px;color:var(--sub);font-size:13px}.hs.wrap,.people.wrap{flex-wrap:wrap;overflow:visible}
.list div[data-al]{cursor:pointer}

.screen{overscroll-behavior:contain}
.phone.dz{outline:3px dashed var(--blue);outline-offset:-6px}
@media (hover:hover){.ph[data-id]{cursor:pointer}.ph[data-id]:hover svg,.ph[data-id]:hover img{filter:brightness(1.08)}.pill:hover,.tabs button:hover{filter:brightness(.92)}}
@media (min-width:900px){
 body{display:block}

 .tabs button{flex-direction:row;font-size:15px;gap:12px;padding:10px 14px;min-width:0;border-radius:10px;justify-content:flex-start}
 .tabs button.on{background:var(--seg)}

 .toast{left:220px;right:auto;width:420px}

}

<script type="text/html" id="camsrc"><!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>カメラ</title>
<style>
:root{--y:#ffd60a;--bg:#000;--fg:#fff;--dim:rgba(255,255,255,.6);--chip:rgba(60,60,67,.6);box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"SF Pro Text","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;overflow:hidden}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.top{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;flex:none;position:relative}
.ib{width:36px;height:36px;border:0;background:none;color:#fff;display:grid;place-items:center;font-size:20px;cursor:pointer;border-radius:50%}
.ib.on{color:var(--y)}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#rec{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:#ff3b30;border-radius:8px;padding:3px 10px;font-size:15px;font-variant-numeric:tabular-nums;display:none}
.vf{position:relative;flex:1;min-height:0;border-radius:12px;overflow:hidden;background:linear-gradient(160deg,#2a3a4a,#0e1218 60%,#2b1f2e)}
.vf video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:center;transition:transform .25s}
.vf video.m{scale:-1 1}
.grid{position:absolute;inset:0;pointer-events:none;display:none;background:
linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,.35)) 33.33% 0/1px 100% no-repeat,
linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,.35)) 66.66% 0/1px 100% no-repeat,
linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,.35)) 0 33.33%/100% 1px no-repeat,

.portrait{position:absolute;inset:0;pointer-events:none;display:none;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);-webkit-mask:radial-gradient(ellipse 45% 38% at 50% 48%,transparent 60%,#000 100%);mask:radial-gradient(ellipse 45% 38% at 50% 48%,transparent 60%,#000 100%)}
.ptag{position:absolute;top:10px;left:0;right:0;text-align:center;font-size:13px;color:var(--y);display:none;text-shadow:0 1px 3px #0008}

@keyframes fo{0%{opacity:1;transform:translate(-50%,-50%) scale(1.4)}15%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}

@keyframes fl{0%{opacity:.95}100%{opacity:0}}

.panel{position:absolute;left:0;right:0;bottom:0;background:rgba(28,28,30,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:none;justify-content:space-around;padding:10px 6px}
.panel.open{display:flex}

.panel button.on .c{background:rgba(255,214,10,.2)}
.zoom{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:6px}
.zoom span{padding:2px;border-radius:99px;background:rgba(0,0,0,.35);display:flex;gap:2px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.zb{width:34px;height:34px;border-radius:50%;border:0;background:none;color:#fff;font-size:12px;font-weight:600;cursor:pointer}
.zb.on{background:rgba(0,0,0,.55);color:var(--y);width:40px;height:40px;font-size:14px}
.modes{flex:none;height:44px;overflow:hidden;position:relative;margin-top:8px}
.track{position:absolute;left:0;top:0;height:100%;display:flex;align-items:center;gap:22px;transition:transform .3s cubic-bezier(.3,.8,.3,1);white-space:nowrap}
.track b{font-size:13px;font-weight:600;letter-spacing:.02em;color:#fff;cursor:pointer;padding:8px 2px}
.track b.on{color:var(--y)}
.ctl{flex:none;height:112px;display:flex;align-items:center;justify-content:space-between;padding:0 28px}
.thumb{width:54px;height:54px;border-radius:10px;border:1.5px solid #fff3;background:#1c1c1e center/cover;cursor:pointer;overflow:hidden}
.shutter{width:76px;height:76px;border-radius:50%;border:4px solid #fff;padding:3px;background:none;cursor:pointer;display:grid;place-items:center}
.shutter i{display:block;width:100%;height:100%;border-radius:50%;background:#fff;transition:all .15s}
.shutter:active i{transform:scale(.88)}
.shutter.v i{background:#ff3b30}
.shutter.rec i{width:34px;height:34px;border-radius:8px;background:#ff3b30}
.flip{width:54px;height:54px;border-radius:50%;background:var(--chip);border:0;color:#fff;display:grid;place-items:center;cursor:pointer}
.flip svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .4s}
.flip.s svg{transform:rotate(180deg)}
.msg{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:30px;font-size:13px;color:var(--dim);line-height:1.7;pointer-events:none}
#lib{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column;max-width:480px;margin:0 auto;padding-top:env(safe-area-inset-top,0px)}
#lib.open{display:flex}
#lib header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;font-weight:600}
#lib header button{background:none;border:0;color:#0a84ff;font-size:16px;cursor:pointer}
#items{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;align-content:start}
#items div{aspect-ratio:1;background:#1c1c1e center/cover;position:relative}
#items a{position:absolute;right:4px;bottom:4px;background:#000a;color:#fff;font-size:11px;padding:3px 7px;border-radius:8px;text-decoration:none}
#items p{grid-column:1/-1;text-align:center;color:var(--dim);margin-top:80px;font-size:14px}
#note{position:fixed;left:50%;top:64px;transform:translate(-50%,-8px);background:rgba(40,40,44,.92);color:#fff;font-size:13px;padding:8px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:40}#note.on{opacity:1;transform:translate(-50%,0)}
#big{position:fixed;inset:0;z-index:30;background:#000e;display:none;place-items:center}
#big img,#big video{max-width:100%;max-height:90%}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <button class="ib" id="bFlash" aria-label="フラッシュ"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></button>
    <button class="ib" id="bChev" aria-label="設定"><svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6" id="chev"/></svg></button>
    <button class="ib on" id="bLive" aria-label="Live"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5"/><circle cx="12" cy="12" r="6.5" stroke-dasharray="2 2.4"/><circle cx="12" cy="12" r="10"/></svg></button>
    <div id="rec">00:00</div>
  </div>
  <div class="vf" id="vf">
    <video id="v" autoplay playsinline muted></video>
    <div class="portrait" id="pBlur"></div>
    <div class="ptag" id="pTag">スタジオ照明 · f/1.8</div>
    <div class="grid" id="grid"></div>
    <div class="focus" id="focus"></div>
    <div class="flash" id="flash"></div>
    <div id="count"></div>
    <div class="msg" id="msg">カメラにアクセスできません。<br>ブラウザの許可を確認してください。<br>(プレビューのまま撮影も試せます)</div>
    <div class="panel" id="panel">
      <button id="pFlash"><span class="c">⚡︎</span>フラッシュ<br><small id="tFlash">オフ</small></button>
      <button id="pTimer"><span class="c">◔</span>タイマー<br><small id="tTimer">オフ</small></button>
      <button id="pGrid"><span class="c">#</span>グリッド<br><small id="tGrid">オフ</small></button>
      <button id="pLive"><span class="c">◎</span>Live<br><small id="tLive">オン</small></button>
    </div>
    <div class="zoom"><span id="zoom"><button class="zb" data-z=".5">.5</button><button class="zb on" data-z="1">1×</button><button class="zb" data-z="2">2</button></span></div>
  </div>
  <div class="modes" id="modes"><div class="track" id="track"></div></div>
  <div class="ctl">
    <div class="thumb" id="thumb" aria-label="ライブラリ"></div>
    <button class="shutter" id="shutter" aria-label="シャッター"><i></i></button>
    <button class="flip" id="flip" aria-label="カメラ切替"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/></svg></button>
  </div>
</div>

<div id="lib"><header><span>最近の項目</span><button id="libClose">完了</button></header><div id="items"></div></div>
<div id="big"></div><div id="note"></div>

<script>
/*CAMOFF*/
const $=s=>document.querySelector(s);
const MODES=['タイムラプス','スロー','ビデオ','写真','ポートレート','パノラマ'];
const VIDEO=[0,1,2];
let mode=3,facing='environment',stream=null,zoom=1,flash=0,timer=0,grid=false,live=true;
let rec=null,chunks=[],recT=0,recI=null,media=[];
const v=$('#v');

/* ---- mode carousel ---- */
const track=$('#track');
track.innerHTML=MODES.map((m,i)=>`<b data-i="${i}">${m}</b>`).join('');
function place(){
  const w=$('#modes').clientWidth,el=track.children[mode];
  track.style.transform=`translateX(${w/2-(el.offsetLeft+el.offsetWidth/2)}px)`;
  [...track.children].forEach((b,i)=>b.classList.toggle('on',i===mode));
  const vid=VIDEO.includes(mode);
  $('#shutter').classList.toggle('v',vid);
  $('#pBlur').style.display=mode===4?'block':'none';
  $('#pTag').style.display=mode===4?'block':'none';
  $('.vf').style.borderRadius=mode===3||mode===4?'12px':'12px';
}
track.addEventListener('click',e=>{const b=e.target.closest('b');if(b&&!rec){mode=+b.dataset.i;place()}});
let sx=null;
$('#modes').addEventListener('pointerdown',e=>sx=e.clientX);
addEventListener('pointerup',e=>{if(sx==null||rec)return;const d=e.clientX-sx;if(Math.abs(d)>40){mode=Math.max(0,Math.min(5,mode+(d<0?1:-1)));place()}sx=null});
addEventListener('resize',place);

/* ---- camera ---- */
function stopCam(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;v.srcObject=null}
let st=0;async function start(){if(st)return;st=1;try{await start0()}finally{st=0}}
async function start0(){
  stopCam();
  $('#msg').style.display='none';
  if(window.CAMOFF){$('#msg').innerHTML='カメラがオフになっています。<br>「設定」›「カメラ」でオンにしてください。';$('#msg').style.display='grid';return}
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1920},height:{ideal:1080}},audio:false});
    v.srcObject=stream;v.classList.toggle('m',facing==='user');
  }catch(e){stream=null;$('#msg').innerHTML='カメラにアクセスできません。<br>ブラウザの許可を確認してください。';$('#msg').style.display='grid'}
  setZoom(zoom);
}
function setZoom(z){
  zoom=z;
  const s=z===.5?1:z; /* 0.5×は広角が無い端末向けに等倍表示 */
  v.style.transform=`scale(${s})`;
  document.querySelectorAll('.zb').forEach(b=>{
    const on=+b.dataset.z===z;b.classList.toggle('on',on);
    b.textContent=b.dataset.z==='.5'?(on?'.5×':'.5'):(on?b.dataset.z+'×':b.dataset.z);
  });
}
document.querySelectorAll('.zb').forEach(b=>b.onclick=()=>setZoom(+b.dataset.z));
let pd=0;
$('#vf').addEventListener('touchmove',e=>{
  if(e.touches.length!==2)return;
  const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
  if(pd){zoom=Math.max(1,Math.min(5,zoom*d/pd));v.style.transition='none';v.style.transform=`scale(${zoom})`}
  pd=d;
},{passive:true});
$('#vf').addEventListener('touchend',()=>{pd=0;v.style.transition=''});

$('#flip').onclick=()=>{facing=facing==='user'?'environment':'user';$('#flip').classList.toggle('s');start()};

/* tap to focus */
$('#vf').addEventListener('click',e=>{
  if(e.target.closest('.panel,.zoom'))return;
  const r=$('#vf').getBoundingClientRect(),f=$('#focus');
  f.style.left=e.clientX-r.left+'px';f.style.top=e.clientY-r.top+'px';
  f.classList.remove('go');void f.offsetWidth;f.classList.add('go');
  $('#panel').classList.remove('open');$('#chev').setAttribute('d','m6 15 6-6 6 6');
});

/* ---- settings ---- */
$('#bChev').onclick=()=>{const p=$('#panel');p.classList.toggle('open');$('#chev').setAttribute('d',p.classList.contains('open')?'m6 9 6 6 6-6':'m6 15 6-6 6 6')};
const FL=['オフ','オン','自動'],TM=['オフ','3秒','10秒'];
function ui(){
  $('#tFlash').textContent=FL[flash];$('#pFlash').classList.toggle('on',flash>0);$('#bFlash').classList.toggle('on',flash>0);
  $('#tTimer').textContent=TM[timer];$('#pTimer').classList.toggle('on',timer>0);
  $('#tGrid').textContent=grid?'オン':'オフ';$('#pGrid').classList.toggle('on',grid);$('#grid').style.display=grid?'block':'none';
  $('#tLive').textContent=live?'オン':'オフ';$('#pLive').classList.toggle('on',live);$('#bLive').classList.toggle('on',live);
}
$('#pFlash').onclick=$('#bFlash').onclick=()=>{flash=(flash+1)%3;ui()};
$('#pTimer').onclick=()=>{timer=(timer+1)%3;ui()};
$('#pGrid').onclick=()=>{grid=!grid;ui()};
$('#pLive').onclick=$('#bLive').onclick=()=>{live=!live;ui()};

/* ---- capture ---- */
function frame(){
  const c=document.createElement('canvas'),vw=v.videoWidth||1280,vh=v.videoHeight||960;
  const W=vw,H=vh;c.width=W;c.height=H;const x=c.getContext('2d');
  if(!stream||!v.videoWidth){
    const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#2a3a4a');g.addColorStop(.6,'#0e1218');g.addColorStop(1,'#2b1f2e');
    x.fillStyle=g;x.fillRect(0,0,W,H);return c;
  }
  x.save();if(facing==='user'){x.translate(W,0);x.scale(-1,1)}
  const s=Math.max(1,zoom===.5?1:zoom),sw=W/s,sh=H/s;
  x.drawImage(v,(W-sw)/2,(H-sh)/2,sw,sh,0,0,W,H);x.restore();
  return c;
}
function doFlash(){$('#flash').classList.remove('go');void $('#flash').offsetWidth;$('#flash').classList.add('go')}
function stampName(p,ext){const d=new Date(),z=n=>String(n).padStart(2,'0');return p+'_'+d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())+'_'+z(d.getHours())+z(d.getMinutes())+z(d.getSeconds())+'_'+String(d.getMilliseconds()).padStart(3,'0')+'.'+ext}
let nt=0;function note(t){const n=$('#note');n.textContent=t;n.classList.add('on');clearTimeout(nt);nt=setTimeout(()=>n.classList.remove('on'),1600)}
function toPhotos(f){try{if(parent&&parent.camSave){parent.camSave(f);note('写真に追加しました')}}catch(e){}}
function addMedia(m){
  media.unshift(m);$('#thumb').style.backgroundImage=`url(${m.thumb})`;
}
function photo(){
  doFlash();
  if(flash===1)document.body.animate([{filter:'brightness(2)'},{filter:'none'}],{duration:250});
  const c=frame(),url=c.toDataURL('image/jpeg',.92),nm=stampName('IMG','jpg');
  addMedia({type:'img',url,thumb:url,name:nm});
  c.toBlob(b=>b&&toPhotos(new File([b],nm,{type:'image/jpeg',lastModified:Date.now()})),'image/jpeg',.92);
}
function countdown(n,cb){
  const el=$('#count');el.style.display='grid';el.textContent=n;
  const iv=setInterval(()=>{n--;if(n<=0){clearInterval(iv);el.style.display='none';cb()}else el.textContent=n},1000);
}
$('#shutter').onclick=()=>{
  if(window.CAMOFF)return;
  if(VIDEO.includes(mode)){rec?stopRec():(timer?countdown([0,3,10][timer],startRec):startRec());return}
  timer?countdown([0,3,10][timer],photo):photo();
};
function startRec(){
  const thumb=frame().toDataURL('image/jpeg',.5);
  if(stream&&window.MediaRecorder){
    chunks=[];rec=new MediaRecorder(stream);
    rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
    rec.onstop=()=>{const b=new Blob(chunks,{type:rec.mimeType||'video/webm'});
      const nm=stampName('MOV',/mp4/.test(b.type)?'mp4':'webm');addMedia({type:'vid',url:URL.createObjectURL(b),thumb,name:nm});toPhotos(new File([b],nm,{type:b.type,lastModified:Date.now()}));rec=null};
    rec.start();
  }else{rec={fake:1,thumb}}
  recT=0;$('#rec').style.display='block';$('#rec').textContent='00:00';
  $('#shutter').classList.add('rec');
  recI=setInterval(()=>{recT++;$('#rec').textContent=String(recT/60|0).padStart(2,'0')+':'+String(recT%60).padStart(2,'0')},1000);
}
function stopRec(){
  clearInterval(recI);$('#rec').style.display='none';$('#shutter').classList.remove('rec');
  if(rec&&rec.fake){addMedia({type:'img',url:rec.thumb,thumb:rec.thumb,name:'MOV_preview.jpg'});rec=null}
  else if(rec)rec.stop();
}

function wipeAcct(){SY_ON=0;SYME=null;clearTimeout(SYTM);SYTM=0;for(const k in XDT)clearTimeout(XDT[k]);
