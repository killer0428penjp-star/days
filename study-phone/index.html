<div class="simw"><div class="sim" id="sim"><iframe id="simf" sandbox="${SBX}"></iframe><button class="simx" id="simx">閉じる</button></div></div>
<div class="row"><button id="simfs" style="flex:1">全画面で試す</button></div>
<h2>説明</h2><p style="white-space:pre-wrap">${E(r.description)||'<span class="mu">説明はありません</span>'}</p><p class="mu" style="margin-top:8px">${kb(r.size)} ・ ${date(r.created_at)}</p>
${mode=='rv'||mode=='ap'?'<label class="fld">申請者へのメッセージ('+(mode=='rv'?'拒否するときは理由を書きます':'公開停止の理由など・任意')+')</label><textarea id="rvm" rows="3" maxlength="300" placeholder="例: 起動しないので直して、もう一度出してください"></textarea>':''}
${mode=='rv'?'<div class="act"><button id="rng" style="flex:1">拒否</button><button id="rok" class="on" style="flex:1">許可</button></div>':mode=='ap'?'<div class="act"><button id="rst" class="on" style="flex:1">公開停止</button></div>':''}`;
$('#simf').srcdoc=frameDoc(r.html||'',{},0);
$('#xbk').onclick=()=>{if(mode=='rv'||mode=='ap'){rv=null;rvView()}else{pv=null;view()}};
$('#simfs').onclick=()=>$('#sim').classList.add('full');$('#simx').onclick=()=>$('#sim').classList.remove('full');
if(mode=='rv'){$('#rok').onclick=()=>decide(true);$('#rng').onclick=()=>decide(false)}
if(mode=='ap')$('#rst').onclick=async()=>{if(await takeDown(r.id,$('#rvm').value)){rv=null;rvView()}}}
// ---------- 審査(管理者)----------
async function loadPend(){if(!sb||!adm)return;const{data,error}=await sb.from('phone_apps').select(COLS).eq('status','pending').order('created_at');
if(!error){pend=data;badge();if(S.tab==5&&tabS=='rv'&&!rv&&!pv)rvView()}}
function rvView(){const v=$('#srv');if(rv)return simShow(v,rv,rv.status=='approved'?'ap':'rv');
const ap=list||[],sub=r=>E(r.category)+' ・ '+date(r.created_at);
v.innerHTML=`<p class="mu" style="margin:12px 0 0">審査待ち ${pend.length}件</p>`+(pend.length?pend.map(r=>row(r,'<button class="gt on">確認</button>',sub(r))).join(''):'<p class="mu" style="text-align:center;margin:16px 0">審査待ちはありません</p>')
+`<h2>公開中 ${list===undefined?'':ap.length+'件'}</h2>`+(list===undefined?'<p class="mu">読み込み中…</p>':ap.length?ap.map(r=>row(r,'<button class="gt">管理</button>',sub(r))).join(''):'<p class="mu" style="text-align:center;margin:16px 0">公開中のアプリはありません</p>');
if(list===undefined)loadList().then(()=>{if(S.tab==5&&tabS=='rv'&&!rv&&!pv)rvView()})}
$('#srv').onclick=async e=>{const r=e.target.closest('.sr[data-t]');if(!r||rv)return;
const{data,error}=await sb.from('phone_apps').select('*').eq('id',+r.dataset.t).single();if(error)return alert(error.message);rv=data;rvView();$('main').scrollTo(0,0)};
async function decide(ok){const msg=($('#rvm')?$('#rvm').value:'').trim();if(!rv)return;if(!ok&&!msg)return alert('拒否の理由をメッセージ欄に書いてください');if(!confirm(ok?'このアプリを許可して公開しますか?':'このアプリを拒否しますか?'))return;
const{data,error}=await sb.from('phone_apps').update({status:ok?'approved':'rejected',reject_reason:ok?null:msg,reviewed_at:new Date().toISOString()}).eq('id',rv.id).select('id');
if(error)return alert('失敗しました: '+error.message);if(!data||!data.length)return alert('このアカウントには審査の権限がありません');
rv=null;list=undefined;await loadPend();rvView()}
function badge(){$('#srvb').textContent='審査'+(pend.length?'('+pend.length+')':'');$$('#home .ic[data-t="5"] .bdg').forEach(x=>x.remove());
if(adm&&pend.length){const ic=$('#home .ic[data-t="5"]');if(ic)ic.insertAdjacentHTML('beforeend',`<b class="bdg">${pend.length}</b>`)}}
window.badge=badge;
// ---------- アカウント(設定の一番上)----------
let me=null;
const guest='<i style="background:linear-gradient(145deg,#8a8f98,#4b4f57);color:#fff"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="3.5"/><path d="M5 20c1-4 4-5.5 7-5.5s6 1.5 7 5.5"/></svg></i>';
function accUI(){const P=me&&S.prof&&S.prof.uid==me.id?S.prof:{},nm=me?(P.name||me.email.split('@')[0]):'ログイン';
$('#accic').innerHTML=me?iconOf({icon:P.icon,name:nm}):guest;$('#accn').textContent=nm;
$('#accs').textContent=me?(adm?'管理者 ・ '+me.email:me.email):'ログインまたは新規登録';
$('#accin').hidden=!!me;$('#accout').hidden=!me;
if(me){$('#pfic').innerHTML=iconOf({icon:P.icon,name:nm});if(document.activeElement!==$('#pfn'))$('#pfn').value=P.name||nm;$('#pfe').textContent=me.email;$('#pfa').hidden=!adm}}
async function chkAdmin(){let a=false;me=null;
if(sb){try{const{data:{session}}=await sb.auth.getSession();if(session){me={id:session.user.id,email:session.user.email||''};
const[ad,pf]=await Promise.all([sb.from('phone_admins').select('user_id').eq('user_id',me.id).maybeSingle(),sb.from('phone_profiles').select('name,icon').eq('user_id',me.id).maybeSingle()]);
a=!!(ad.data);if(pf.data)S.prof={uid:me.id,name:pf.data.name,icon:pf.data.icon};else if(!S.prof||S.prof.uid!=me.id)S.prof={uid:me.id,name:'',icon:''}}}catch(e){}}
if(!me)S.prof=null;save();adm=a;accUI();
clearInterval(pt2);if(a){loadPend();pt2=setInterval(loadPend,30000)}else{pend=[];rv=null;badge()}
if(S.tab==5&&!pv)enter(1)}
const accShow=p=>{$('#setm').hidden=p;$('#accp').hidden=!p;$('main').scrollTo(0,0)};
$('#acc').onclick=()=>accShow(true);$('#accbk').onclick=()=>accShow(false);
$('#adl').onclick=async()=>{if(!sb)return noSb();const email=$('#ade').value.trim(),password=$('#adp').value;if(!email||!password)return alert('メールアドレスとパスワードを入力してください');
const{error}=await sb.auth.signInWithPassword({email,password});if(error)return alert('ログインできません: '+error.message);$('#adp').value='';await chkAdmin()};
$('#adr').onclick=async()=>{if(!sb)return noSb();const email=$('#ade').value.trim(),password=$('#adp').value;if(!email||password.length<6)return alert('メールアドレスと6文字以上のパスワードを入力してください');
const{data,error}=await sb.auth.signUp({email,password});
const retry=error&&(error.status==429||/seconds|rate limit|already/i.test(error.message));
if(error&&!retry)return alert('登録できません: '+error.message);
if(!(data&&data.session)){const r=await sb.auth.signInWithPassword({email,password});
if(r.error){const m=r.error.message||'';
if(/confirm/i.test(m))return alert('このメールアドレスはまだ認証されていません。supabase.sql の8番(メール認証なし)を実行し、このメールだけ認証済みにするSQLも実行してください');
if(retry)return alert('このメールアドレスは登録済みか、短時間に何度も送信しています。「ログイン」を押して、パスワードを確認してください。('+m+')');
return alert('登録できません: '+m)}}
$('#adp').value='';await chkAdmin()};
async function saveProf(icon){if(!me)return false;const P=S.prof&&S.prof.uid==me.id?S.prof:{},name=$('#pfn').value.trim().slice(0,20);if(!name){alert('名前を入力してください');return false}
const n={uid:me.id,name,icon:icon!==undefined?icon:(P.icon||'')};
const{error}=await sb.from('phone_profiles').upsert({user_id:me.id,name:n.name,icon:n.icon||null,updated_at:new Date().toISOString()});
if(error){alert('保存できませんでした: '+(noTbl(error)?'データベースの準備ができていません(supabase.sqlを実行してください)':error.message));return false}
S.prof=n;save();accUI();return true}
$('#pfs').onclick=async()=>{const b=$('#pfs');b.disabled=true;const ok=await saveProf();b.disabled=false;if(ok){b.textContent='保存しました';setTimeout(()=>b.textContent='保存',1200)}};
$('#pfi').onclick=$('#pfic').onclick=()=>$('#pfif').click();
$('#pfif').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const rd=new FileReader();
rd.onload=()=>{const im=new Image();im.onerror=()=>alert('画像を読み込めませんでした');im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),s=Math.min(im.width,im.height)||1;x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,128,128);saveProf(c.toDataURL('image/png'))};im.src=rd.result};rd.readAsDataURL(f)};
$('#ado').onclick=async()=>{if(!confirm('ログアウトしますか?'))return;if(sb)await sb.auth.signOut();await chkAdmin();accShow(false)};
OPEN[4]=()=>{accShow(false);accUI()};
// ---------- 画面の切り替え ----------
function view(){const P=!!pv;if(!adm&&tabS=='rv')tabS='dl';const sg=$('#sseg');sg.hidden=P;sg.style.setProperty('--n',adm?3:2);sg.style.setProperty('--i',['dl','dv','rv'].indexOf(tabS));
$$('#sseg button').forEach(b=>b.classList.toggle('on',b.dataset.s==tabS));$('#srvb').hidden=!adm;
['dl','dv','rv'].forEach(k=>$('#s'+k).hidden=P||tabS!=k);$('#spv').hidden=!P;if(P)simShow($('#spv'),pv,'pv')}
function enter(keep){view();if(pv)return;
if(tabS=='dl')dlView();else if(tabS=='dv')mineSync();else if(tabS=='rv'){if(!keep||!rv)rvView();if(!keep)loadPend()}}
$('#sseg').onclick=e=>{const b=e.target.closest('button[data-s]');if(!b)return;tabS=b.dataset.s;det=null;rv=null;enter()};
OPEN[5]=()=>{pv=null;enter();if(S.mine.some(m=>m.st=='pending')&&tabS!='dv')mineSync();if(list===undefined||Date.now()-lt>20000)loadList().then(()=>{if(tabS=='dl'&&S.tab==5&&!pv)dlView()})};
mineRender();chkAdmin();
if(sb)sb.auth.onAuthStateChange(()=>setTimeout(chkAdmin,0));
})();

// ===== 起動 =====
function boot(){
S.inst=(S.inst||[]).filter(t=>t==4||t==5||t>=1000);
[5,4].forEach(t=>{if(!S.inst.includes(t))S.inst.push(t)});
S.inst.forEach(t=>{if(t>=1000){const r=loadX(t-1000);if(r)regExt(r)}});
const ok=t=>APPS[t];S.inst=S.inst.filter(ok);
S.hm??={p:[[5,4]],d:[],h:[]};S.hm.h=[];
S.hm.p=(S.hm.p||[[]]).map(a=>a.filter(ok)).filter(a=>a.length);if(!S.hm.p.length)S.hm.p=[[]];S.hm.d=(S.hm.d||[]).filter(ok);
const all=()=>[...S.hm.p.flat(),...S.hm.d];
S.inst.forEach(t=>{if(!all().includes(t))S.hm.p[S.hm.p.length-1].push(t)});
renderHome();theme();save();
}
boot();

</script></body></html>
