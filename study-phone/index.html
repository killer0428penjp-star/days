function tl(t,l){const i=LI[l];if(i===undefined)return null;const r=D.get(t);if(r&&r[i])return r[i];for(const[re,o]of RULES){const m=re.exec(t);if(m)return o[i].replace(/\$(\d)/g,(_,n)=>tl(m[n],l)||m[n])}return null}
const ORIG=new Map(),TRV=new Map();let TRB=0,ATTRS=0;
function trNode(n,l){const cur=n.nodeValue;let ja=ORIG.get(n);if(ja!==undefined&&cur!==TRV.get(n))ja=undefined;if(ja===undefined)ja=cur;const t=ja.trim();if(!t)return;const o=l=='ja'?null:tl(t,l);if(o){const v=ja.replace(t,o);ORIG.set(n,ja);TRV.set(n,v);if(cur!==v)n.nodeValue=v}else if(ORIG.has(n)){if(cur!==ja)n.nodeValue=ja;ORIG.delete(n);TRV.delete(n)}}
function trAttr(root,l){root.querySelectorAll('[placeholder],[aria-label]').forEach(e=>['placeholder','aria-label'].forEach(a=>{if(!e.hasAttribute(a))return;const k='data-ja-'+a;if(!e.hasAttribute(k))e.setAttribute(k,e.getAttribute(a));const ja=e.getAttribute(k),o=l=='ja'?ja:(tl(ja,l)||ja);if(e.getAttribute(a)!==o){e.setAttribute(a,o);ATTRS=1}}))}
const TROOTS=()=>['#t4','#lock','#pc','#pwsv','#pwbar'].map(s=>$(s)).filter(Boolean);
function trAll(){if(TRB)return;const l=uiL();if(l=='ja'&&!ORIG.size&&!ATTRS)return;TRB=1;try{TROOTS().forEach(r=>{const w=document.createTreeWalker(r,NodeFilter.SHOW_TEXT),arr=[];let n;while(n=w.nextNode())arr.push(n);arr.forEach(n=>{const p=n.parentElement;if(!p||p.closest('[data-nt],script,style,svg'))return;trNode(n,l)});trAttr(r,l)});for(const n of [...ORIG.keys()]){if(!n.isConnected){ORIG.delete(n);TRV.delete(n)}else if(l=='ja')trNode(n,l)}if(l=='ja')ATTRS=0}finally{TRB=0;MO.takeRecords()}}
const MO=new MutationObserver(()=>trAll());TROOTS().forEach(r=>MO.observe(r,{childList:true,subtree:true,characterData:true}));
