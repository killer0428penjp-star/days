<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>時計 - 勉強タイマー＆記録</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
@property --p {
  syntax: '<percentage>';
  inherits: false;
  initial-value: 100%;
}
:root {
  --bg: #fff;
  --fg: #1b1d21;
  --mu: #737985;
  --bd: #dfe1e6;
  --sf: #f3f4f6;
  --hl: #e4e6ea;
  --dt: #e6e8ec;
  --e: cubic-bezier(.22,.9,.28,1);
  --sp: cubic-bezier(.3,1.35,.5,1);
  --mi: "Shippori Mincho", "Hiragino Mincho ProN", serif;
}
[data-t="dark"] {
  --bg: #0e0f11;
  --fg: #eceef1;
  --mu: #8e95a1;
  --bd: #2a2d33;
  --sf: #17191c;
  --hl: #2b2e35;
  --dt: #1c1e22;
}
* {
  box-sizing: border-box;
  margin: 0;
  -webkit-tap-highlight-color: transparent;
}
html, body {
  min-height: 100%;
}
body {
  background: radial-gradient(var(--dt) 1.3px, transparent 1.5px) 0 0 / 22px 22px fixed var(--bg);
  color: var(--fg);
  font: clamp(14px, 3.8vw, 16px)/1.6 "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  overflow-wrap: anywhere;
  padding-top: env(safe-area-inset-top);
  transition: background-color .4s, color .4s;
}
header, .card, input, select, .wheels::before {
  transition: background-color .4s, border-color .4s, color .4s;
}
:focus-visible {
  outline: 2px solid var(--fg);
  outline-offset: 2px;
}

/* ヘッダー＆テーマ切り替え */
header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: calc(56px + env(safe-area-inset-top));
  padding: env(safe-area-inset-top) 4% 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--bd);
  z-index: 10;
}
.lg {
  display: flex;
  align-items: center;
  gap: 9px;
  font: 600 1.15em var(--mi);
}
.lg u {
  text-decoration: none;
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border: 1.5px solid var(--fg);
  border-radius: 7px;
  transform: rotate(-6deg);
  font-size: .85em;
}
.thm {
  display: flex;
  position: relative;
  border: 1px solid var(--bd);
  border-radius: 999px;
  padding: 3px;
  background: var(--bg);
}
.thm::before {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--fg);
  transition: transform .55s var(--sp);
}
.thm[data-i="1"]::before { transform: translateX(34px); }
.thm[data-i="2"]::before { transform: translateX(68px); }
.tb {
  width: 34px;
  height: 34px;
  padding: 0;
  border: 0;
  background: none !important;
  position: relative;
  z-index: 1;
  border-radius: 50%;
  display: grid;
  place-items: center;
  transition: color .3s;
}
.tb.on {
  color: var(--bg);
}
@media (hover: hover) {
  .tb:hover { color: var(--fg); }
  .tb.on:hover { color: var(--bg); }
}

/* 共通UIパーツ */
button, select, input {
  font: inherit;
  color: var(--fg);
  border: 1px solid var(--bd);
  border-radius: 999px;
  padding: .45em 1.1em;
  background-color: var(--bg);
}
input, select {
  max-width: 100%;
  transition: border-color .3s, box-shadow .3s;
}
input:focus, select:focus {
  outline: none;
  border-color: var(--fg);
  box-shadow: 0 0 0 3px var(--hl);
}
button {
  cursor: pointer;
  background-image: linear-gradient(var(--fg), var(--fg));
  background-repeat: no-repeat;
  background-position: 0 100%;
  background-size: 100% 0;
  transition: background-size .4s var(--e), color .3s, transform .25s var(--sp), border-color .3s;
}
@media (hover: hover) {
  button:not(:disabled):hover {
    background-size: 100% 100%;
    color: var(--bg);
    border-color: var(--fg);
  }
}
button:active { transform: scale(.93); }
button:disabled { opacity: .4; cursor: default; }
.ib {
  width: 38px;
  height: 38px;
  padding: 0;
  display: grid;
  place-items: center;
}
main {
  max-width: 600px;
  margin: 0 auto;
  padding: calc(72px + env(safe-area-inset-top)) 4% calc(40px + env(safe-area-inset-bottom));
}
svg {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.card {
  border: 1px solid var(--bd);
  border-radius: 22px;
  padding: 5%;
  margin-bottom: 14px;
  background: var(--bg);
}
.row {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
.sp {
  justify-content: space-between;
}
.mu {
  color: var(--mu);
  font-size: .85em;
}
h2 {
  font: 600 1.2em var(--mi);
  margin: 24px 0 10px;
  display: inline-block;
  background: linear-gradient(transparent 62%, var(--hl) 0);
  padding: 0 .2em;
  margin-left: -.2em;
}
h2:first-child {
  margin-top: 4px;
}

/* セグメント切り替え */
.seg {
  display: flex;
  border: 1px solid var(--bd);
  border-radius: 999px;
  padding: 3px;
  position: relative;
  touch-action: pan-y;
  background: var(--bg);
}
.seg::before {
  content: "";
  position: absolute;
  top: 3px;
  bottom: 3px;
  left: 3px;
  width: calc(50% - 3px);
  border-radius: 999px;
  background: var(--fg);
  transition: transform .55s var(--sp);
}
.seg[data-i="1"]::before {
  transform: translateX(100%);
}
.seg button {
  flex: 1;
  border: 0;
  background: none !important;
  position: relative;
  z-index: 1;
  transition: color .3s;
}
.seg button.on {
  color: var(--bg);
}
@media (hover: hover) {
  .seg button:hover { color: var(--fg); }
  .seg button.on:hover { color: var(--bg); }
}

/* ストップウォッチ・ダイヤル */
.dial {
  transition: transform .6s var(--sp), opacity .3s;
  position: relative;
  width: min(76vw, 290px);
  aspect-ratio: 1;
  margin: 8px auto 14px;
  touch-action: pan-y;
  user-select: none;
  cursor: grab;
}
.dial svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
}
.tr { stroke: var(--bd); stroke-width: 1.2; }
.rg {
  stroke: var(--fg);
  stroke-width: 2.4;
  stroke-dasharray: 282.74;
  transform-box: view-box;
  transform-origin: 50% 50%;
  transform: rotate(-90deg);
}
.tk {
  stroke: var(--mu);
  stroke-width: 3;
  stroke-dasharray: .5 4.317;
  opacity: 0;
  transition: opacity .6s;
}
.hd {
  stroke: var(--fg);
  stroke-width: 1.6;
  opacity: 0;
  transition: opacity .6s;
  transform-box: view-box;
  transform-origin: 50% 50%;
}
.ana .tk, .ana .hd { opacity: 1; }
#disp {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  font: 400 clamp(30px, 10.5vw, 46px) var(--mi);
  transition: transform .7s var(--sp);
}
.ana #disp {
  transform: translateY(34%) scale(.5);
}
#disp i {
  display: inline-block;
  width: .62em;
  text-align: center;
  font-style: normal;
}
#disp i.p { width: .3em; }
.bt {
  width: clamp(72px, 22vw, 92px);
  aspect-ratio: 1;
  border-radius: 50%;
  padding: 0;
}
#b2.run {
  background-size: 100% 100%;
  color: var(--bg);
  border-color: var(--fg);
}
#dots {
  cursor: pointer;
  letter-spacing: .3em;
  padding: 8px;
}

/* タイマー（iOS風ホイール） */
.wheels {
  position: relative;
  display: flex;
  height: 180px;
}
.wheels::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 72px;
  height: 36px;
  border-radius: 12px;
  background: var(--sf);
}
.wh {
  position: relative;
  flex: 1;
  height: 180px;
  z-index: 1;
}
.wh ul {
  position: relative;
  height: 100%;
  overflow-y: scroll;
  scroll-snap-type: y mandatory;
  list-style: none;
  padding: 72px 0;
  scrollbar-width: none;
  overscroll-behavior: contain;
  touch-action: pan-y;
}
.wh ul::-webkit-scrollbar { display: none; }
.wh li {
  height: 36px;
  scroll-snap-align: center;
  text-align: right;
  padding-right: 52%;
  font: 400 1.35em/36px var(--mi);
  will-change: transform;
}
.wh em {
  position: absolute;
  left: 52%;
  top: 72px;
  line-height: 36px;
  font-style: normal;
  font-size: .85em;
  pointer-events: none;
  padding-left: 8px;
}
.trow {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--bd);
}
.big {
  font: 400 clamp(34px, 11vw, 52px)/1.15 var(--mi);
}
.bt.sm {
  width: 58px;
}
.pbar {
  height: 3px;
  background: var(--hl);
  border-radius: 3px;
  overflow: hidden;
  margin-top: 6px;
}
.pbar u {
  display: block;
  height: 100%;
  background: var(--fg);
  width: 0;
}

/* 記録・グラフ */
.res {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  text-align: center;
}
.res div {
  border: 1px solid var(--bd);
  border-radius: 16px;
  padding: 12px 4px;
  background: var(--bg);
}
.res b {
  display: block;
  font: 400 1.25em var(--mi);
}
.ch {
  position: relative;
  height: 150px;
  margin: 12px 0 28px 30px;
  border-bottom: 1px solid var(--fg);
}
.gl {
  position: absolute;
  left: 0;
  right: 0;
  border-top: 1px dashed var(--bd);
}
.gl b {
  position: absolute;
  left: -30px;
  top: -10px;
  font-size: .7em;
  color: var(--mu);
  font-weight: 400;
}
.bars {
  position: absolute;
  inset: 0;
  display: flex;
  gap: 7px;
}
.c {
  flex: 1;
  display: flex;
  align-items: flex-end;
  position: relative;
}
.c u {
  width: 100%;
  background: var(--fg);
  border-radius: 6px 6px 0 0;
  transform-origin: bottom;
  animation: grow .8s var(--e) both;
  animation-delay: calc(var(--i) * 60ms);
  min-height: 2px;
}
@keyframes grow { from { transform: scaleY(0); } }
.c span {
  position: absolute;
  bottom: -23px;
  width: 100%;
  text-align: center;
  font-size: .7em;
  color: var(--mu);
}
.pie {
  width: min(52vw, 200px);
  aspect-ratio: 1;
  border-radius: 50%;
  margin: 14px auto;
  background: var(--fg);
  -webkit-mask: conic-gradient(#000 var(--p), transparent 0);
  mask: conic-gradient(#000 var(--p), transparent 0);
}
.pie.sw { animation: sweep 1.1s var(--e); }
@keyframes sweep { from { --p: 0%; } }
.dot {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  margin-right: 6px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>
<body>

<header>
  <div class="lg"><u>時</u><span>時計</span></div>
  <div class="thm" data-i="2" title="テーマ切り替え（ホワイト / ダーク / 時間で自動）">
    <button class="tb" data-m="light" title="ホワイトモード" aria-label="ホワイトモード">
      <svg width="19" height="19" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg>
    </button>
    <button class="tb" data-m="dark" title="ダークモード" aria-label="ダークモード">
      <svg width="19" height="19" viewBox="0 0 24 24"><path d="M20 14A8 8 0 1 1 10 4a6.5 6.5 0 0 0 10 10z"/></svg>
    </button>
    <button class="tb" data-m="auto" title="時間による自動切り替え（17時〜翌5時はダーク）" aria-label="時間による自動切り替え">
      <svg width="19" height="19" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
    </button>
  </div>
</header>

<main>
  <h2>勉強タイマー</h2>
  <div class="seg" id="mseg">
    <button data-k="sw" class="on">ストップウォッチ</button>
    <button data-k="tm">タイマー</button>
  </div>

  <!-- ストップウォッチ画面 -->
  <div class="card" id="swc" style="margin-top:10px">
    <div class="dial" id="dial" title="左右スワイプまたは下の●をタップでアナログ/デジタル切替">
      <svg viewBox="0 0 100 100">
        <circle class="tr" cx="50" cy="50" r="46" fill="none"/>
        <circle class="tk" cx="50" cy="50" r="44" fill="none"/>
        <circle class="rg" id="rg" cx="50" cy="50" r="45" fill="none" stroke-linecap="round"/>
        <path class="hd" id="hand" d="M50 50V14"/>
      </svg>
      <div id="disp"></div>
    </div>
    <div class="row sp" style="margin-top:12px">
      <button class="bt" id="b1">リセット</button>
      <span class="mu" id="dots" title="表示スタイル切替">● ○</span>
      <button class="bt" id="b2">開始</button>
    </div>
    <ol id="laps" class="mu" style="padding-left:1.4em;margin-top:8px"></ol>
  </div>

  <!-- タイマー画面 -->
  <div class="card" id="tmc" style="margin-top:10px;display:none">
    <div id="tset">
      <div class="wheels">
        <div class="wh" data-n="24"><em>時間</em></div>
        <div class="wh" data-n="60"><em>分</em></div>
        <div class="wh" data-n="60"><em>秒</em></div>
      </div>
      <div class="row sp" style="margin-top:12px">
        <button class="bt" id="c1">キャンセル</button>
        <button class="bt" id="c2">開始</button>
      </div>
    </div>
    <div id="tmr" style="display:none">
      <div class="trow">
        <div>
          <div class="big" id="tbig"></div>
          <div class="mu" id="tcap"></div>
        </div>
        <button class="bt sm" id="tp">❚❚</button>
      </div>
      <div class="pbar"><u id="tpb"></u></div>
      <button id="tx" style="margin-top:12px">キャンセル</button>
    </div>
    <h2>最近の項目</h2>
    <div id="rec"></div>
  </div>

  <!-- 科目・通知音設定 -->
  <div class="row" style="margin-top:2px">
    <select id="subj" style="flex:1" aria-label="科目"></select>
    <select id="snd" style="flex:1" aria-label="通知音"></select>
    <button class="ib" id="tsn" title="通知音を試聴">♪</button>
  </div>

  <!-- 記録＆グラフ -->
  <h2>記録</h2>
  <div class="res">
    <div><span class="mu">合計</span><b id="s1"></b></div>
    <div><span class="mu">1日平均</span><b id="s2"></b></div>
    <div><span class="mu">日数</span><b id="s3"></b></div>
  </div>
  <div class="row sp" style="margin-top:12px">
    <button class="ib" onclick="wk(-1)" aria-label="前の週">‹</button>
    <span id="wl" class="mu"></span>
    <button class="ib" onclick="wk(1)" aria-label="次の週">›</button>
  </div>
  <div class="ch" id="wb2" style="touch-action:pan-y"></div>

  <h2>1日の内訳</h2>
  <input type="date" id="pd" aria-label="日付選択">
  <div class="pie" id="pie"></div>
  <div id="leg"></div>
</main>

<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

// データの読み込みと初期化（元のスマホ版と同じキーで互換性あり）
let S = JSON.parse(localStorage.getItem('st') || '{}');
S.logs ??= [];
S.theme ??= 'auto';
S.snd ??= 0;
S.mode ??= 'sw';
S.wk = 0;
S.ana ??= 0;
S.T ??= { sw: { run: 0, t0: 0, acc: 0 }, tm: { run: 0, t0: 0, acc: 0, target: 0 } };
S.laps ??= [];
S.pk ??= [0, 25, 0];
S.rec ??= [];

const save = () => localStorage.setItem('st', JSON.stringify(S));
const pad = n => String(n).padStart(2, '0');
const dk = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const hm = s => Math.floor(s / 3600) + '時間' + pad(Math.floor(s % 3600 / 60)) + '分';

const SUBJ = {
  '5教科': ['国語', '数学', '英語', '理科', '社会'],
  '4副教科': ['音楽', '美術', '保健体育', '技術家庭'],
  '高校科目': ['情報', '古文・漢文', '物理', '化学', '生物', '地学', '日本史', '世界史', '地理', '公民'],
  '他': ['その他']
};

const SND = [
  ['sine', [880, 880]],
  ['square', [660, 880]],
  ['triangle', [523, 659, 784]],
  ['sine', [440, 440, 440]],
  ['sawtooth', [330, 440]],
  ['square', [988, 740, 988]],
  ['triangle', [392, 523, 392, 523]],
  ['sine', [1200]],
  ['sawtooth', [220, 330, 440]],
  ['sine', [784, 988, 1175, 988]]
];
const SN = ['ビープ', 'ツー', 'チャイム', 'トリプル', 'ブザー', 'アラート', 'メロディ', 'ピン', 'アップ', 'ベル'];

let ac;
function beep(i) {
  ac ??= new AudioContext();
  const [ty, fs] = SND[i];
  fs.forEach((f, k) => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = ty;
    o.frequency.value = f;
    g.gain.value = .15;
    o.connect(g);
    g.connect(ac.destination);
    const t = ac.currentTime + k * .22;
    o.start(t);
    o.stop(t + .18);
  });
}

// テーマ制御（ホワイト / ダーク / 時間による自動）
function applyTheme() {
  let t = S.theme;
  if (t === 'auto') {
    const h = new Date().getHours();
    t = (h >= 17 || h < 5) ? 'dark' : 'light';
  }
  document.documentElement.dataset.t = t;
  $$('button.tb').forEach(b => b.classList.toggle('on', b.dataset.m === S.theme));
  const thm = $('.thm');
  if (thm) thm.dataset.i = ['light', 'dark', 'auto'].indexOf(S.theme);
}
$$('button.tb').forEach(b => {
  b.onclick = () => {
    S.theme = b.dataset.m;
    save();
    applyTheme();
  };
});
setInterval(applyTheme, 60000);
applyTheme();

// グラフ用集計関数
function dayTotals() {
  const m = {};
  S.logs.forEach(l => m[l.d] = (m[l.d] || 0) + l.sec);
  return m;
}
function week(off) {
  const m = dayTotals(), r = [], n = new Date();
  for (let i = 6; i >= 0; i--) {
    const d = new Date(n.getFullYear(), n.getMonth(), n.getDate() - i + off * 7);
    r.push([d, m[dk(d)] || 0]);
  }
  return r;
}
function bars(el, off) {
  const w = week(off), mx = Math.max(1, Math.ceil(Math.max(...w.map(x => x[1])) / 3600));
  let h = '';
  for (let i = 1; i <= mx; i++) h += `<i class="gl" style="bottom:${i / mx * 100}%"><b>${i}h</b></i>`;
  h += '<div class="bars">' + w.map(([d, s], i) => `<div class="c" style="--i:${i}"><u style="height:${s / 3600 / mx * 100}%" title="${hm(s)}"></u><span>${d.getMonth() + 1}/${d.getDate()}</span></div>`).join('') + '</div>';
  el.innerHTML = h;
}

// 時計・ストップウォッチ・タイマー処理
const el = k => {
  const o = S.T[k];
  return o.acc + (o.run ? Date.now() - o.t0 : 0);
};
function addLog(sec) {
  if (sec > .5) {
    S.logs.push({ d: dk(new Date()), s: $('#subj').value, sec: Math.round(sec) });
  }
}
function go(k) {
  const o = S.T[k];
  o.run = 1;
  o.t0 = Date.now();
}
function stop(k) {
  const o = S.T[k], d = Date.now() - o.t0;
  addLog(d / 1000);
  o.acc += d;
  o.run = 0;
}
function f2(ms, cs) {
  const s = ms / 1000;
  return (s >= 3600 ? pad(Math.floor(s / 3600)) + ':' : '') + pad(Math.floor(s % 3600 / 60)) + ':' + pad(Math.floor(s % 60)) + (cs ? '.' + pad(Math.floor(ms % 1000 / 10)) : '');
}
const jp = s => {
  s = Math.round(s);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60;
  return (h ? h + '時間 ' : '') + (m ? m + '分 ' : '') + (r || !(h || m) ? r + '秒' : '');
};
const big = s => {
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60;
  return h ? `${h}:${pad(m)}:${pad(r)}` : m ? `${m}:${pad(r)}` : '' + r;
};

function startTm(sec) {
  const o = S.T.tm;
  if (!sec) return;
  if (o.run) stop('tm');
  o.acc = 0;
  o.target = sec * 1000;
  S.rec = [sec, ...S.rec.filter(x => x != sec)].slice(0, 6);
  go('tm');
  save();
  draw();
  stats();
}
function endTm() {
  const o = S.T.tm;
  if (o.run) stop('tm');
  o.acc = 0;
  o.target = 0;
  save();
  draw();
  stats();
}

function fx(u) {
  const c = u.scrollTop + 90;
  [...u.children].forEach(l => {
    const o = (l.offsetTop + 18 - c) / 36, a = Math.min(Math.abs(o), 3);
    l.style.transform = `perspective(260px) rotateX(${-o * 26}deg) scale(${1 - a * .07})`;
    l.style.opacity = Math.max(.12, 1 - a * .3);
  });
}
function wset() {
  $$('.wh ul').forEach((u, i) => {
    u.scrollTop = S.pk[i] * 36;
    fx(u);
  });
}

function draw() {
  const tm = S.mode === 'tm', o = S.T.tm, w = S.T.sw;
  $('#mseg').dataset.i = tm ? 1 : 0;
  $$('#mseg button').forEach(b => b.classList.toggle('on', b.dataset.k === S.mode));
  $('#swc').style.display = tm ? 'none' : 'block';
  $('#tmc').style.display = tm ? 'block' : 'none';
  $('#b2').textContent = w.run ? '停止' : (w.acc ? '再開' : '開始');
  $('#b2').classList.toggle('run', !!w.run);
  $('#b1').textContent = w.run ? 'ラップ' : 'リセット';
  $('#dots').textContent = S.ana ? '○ ●' : '● ○';
  $('#dial').classList.toggle('ana', !!S.ana);
  $('#laps').innerHTML = S.laps.map(l => '<li>' + f2(l, 1) + '</li>').join('');

  const act = !!o.target;
  $('#tset').style.display = act ? 'none' : 'block';
  $('#tmr').style.display = act ? 'block' : 'none';
  $('#tp').textContent = o.run ? '❚❚' : '▶';
  $('#tcap').textContent = jp(o.target / 1000);
  $('#rec').innerHTML = S.rec.map(x => `<div class="trow"><div><div class="big">${big(x)}</div><div class="mu">${jp(x)}</div></div><button class="bt sm" data-s="${x}">▶</button></div>`).join('') || '<p class="mu">まだありません</p>';
  if (tm && !act) wset();
  tick();
}

function tick() {
  const ms = el('sw');
  $('#disp').innerHTML = [...f2(ms, 1)].map(c => `<i${/\d/.test(c) ? '' : ' class="p"'}>${c}</i>`).join('');
  const p = (ms % 60000) / 60000;
  $('#rg').style.strokeDashoffset = 282.74 * (1 - p);
  $('#hand').style.transform = `rotate(${p * 360}deg)`;

  const o = S.T.tm;
  if (o.target) {
    const r = Math.max(0, o.target - el('tm'));
    $('#tbig').textContent = big(Math.ceil(r / 1000));
    $('#tpb').style.width = (100 - r / o.target * 100) + '%';
  }
}

let x0;
const sw = (el, fn) => {
  el.addEventListener('touchstart', e => x0 = e.touches[0].clientX, { passive: 1 });
  el.addEventListener('touchend', e => {
    const d = e.changedTouches[0].clientX - x0;
    if (Math.abs(d) > 50) fn(d);
  });
};

const COL = ['#3b3f46', '#6b7280', '#9aa0aa', '#c4c9d2', '#52606d', '#7b8794', '#a5adb8', '#2f343b', '#8a93a0', '#d3d7de', '#5a6270'];
function stats() {
  const m = dayTotals(), ds = Object.keys(m), tot = ds.reduce((a, d) => a + m[d], 0);
  $('#s1').textContent = hm(tot);
  $('#s2').textContent = ds.length ? hm(tot / ds.length) : '0時間00分';
  $('#s3').textContent = ds.length + '日';

  const w = week(S.wk);
  $('#wl').textContent = `${w[0][0].getMonth() + 1}/${w[0][0].getDate()} – ${w[6][0].getMonth() + 1}/${w[6][0].getDate()}`;
  bars($('#wb2'), S.wk);

  $('#pd').value || ($('#pd').value = dk(new Date()));
  const d = $('#pd').value, by = {};
  S.logs.filter(l => l.d === d).forEach(l => by[l.s] = (by[l.s] || 0) + l.sec);
  const en = Object.entries(by), sum = en.reduce((a, x) => a + x[1], 0);
  let a = 0;
  $('#pie').style.background = sum ? 'conic-gradient(' + en.map(([s, v], i) => {
    const g = `${COL[i % COL.length]} ${a / sum * 100}% ${(a + v) / sum * 100}%`;
    a += v;
    return g;
  }).join(',') + ')' : 'var(--sf)';
  const pe = $('#pie');
  pe.classList.remove('sw');
  void pe.offsetWidth;
  pe.classList.add('sw');
  $('#leg').innerHTML = en.map(([s, v], i) => `<div class="row sp" style="margin-top:6px"><span><span class="dot" style="background:${COL[i % COL.length]}"></span>${s}</span><span class="mu">${hm(v)}</span></div>`).join('') || '<p class="mu" style="text-align:center">この日の記録はありません</p>';
}
function wk(d) {
  S.wk = Math.min(0, S.wk + d);
  stats();
}

// イベント登録
$('#b2').onclick = () => {
  const o = S.T.sw;
  o.run ? stop('sw') : go('sw');
  save();
  draw();
  stats();
};
$('#b1').onclick = () => {
  const o = S.T.sw;
  if (o.run) S.laps.push(el('sw'));
  else { o.acc = 0; S.laps = []; }
  save();
  draw();
};
$('#c2').onclick = () => startTm(S.pk[0] * 3600 + S.pk[1] * 60 + S.pk[2]);
$('#c1').onclick = () => { S.pk = [0, 0, 0]; wset(); };
$('#tp').onclick = () => {
  const o = S.T.tm;
  o.run ? stop('tm') : go('tm');
  save();
  draw();
  stats();
};
$('#tx').onclick = endTm;
$('#rec').onclick = e => {
  const b = e.target.closest('[data-s]');
  if (b) startTm(+b.dataset.s);
};

// ホイール生成
$$('.wh').forEach((w, i) => {
  const u = document.createElement('ul');
  for (let j = 0; j < +w.dataset.n; j++) u.insertAdjacentHTML('beforeend', `<li>${j}</li>`);
  w.prepend(u);
  let q = 0;
  u.onscroll = () => {
    S.pk[i] = Math.round(u.scrollTop / 36);
    if (!q) {
      q = 1;
      requestAnimationFrame(() => { q = 0; fx(u); });
    }
  };
});

// タイマー完了監視
setInterval(() => {
  const o = S.T.tm;
  if (o.run && el('tm') >= o.target) {
    addLog((o.target - o.acc) / 1000);
    o.acc = 0;
    o.target = 0;
    o.run = 0;
    save();
    beep(S.snd);
    draw();
    stats();
  }
  if (S.T.sw.run || o.run) tick();
}, 200);

$('#mseg').onclick = e => {
  if (e.target.dataset.k) {
    S.mode = e.target.dataset.k;
    save();
    draw();
  }
};
sw($('#mseg'), d => {
  S.mode = d < 0 ? 'tm' : 'sw';
  save();
  draw();
});

// アナログ・デジタル切り替えスワイプ
(() => {
  const d = $('#dial');
  let x = 0, dx = 0, on = 0;
  d.addEventListener('pointerdown', e => {
    x = e.clientX; dx = 0; on = 1;
    d.setPointerCapture(e.pointerId);
    d.style.transition = 'none';
  });
  d.addEventListener('pointermove', e => {
    if (!on) return;
    dx = e.clientX - x;
    const r = Math.sign(dx) * Math.min(Math.abs(dx), 160);
    d.style.transform = `translateX(${r * .5}px) rotate(${r * .05}deg)`;
    d.style.opacity = 1 - Math.min(Math.abs(dx) / 320, .45);
  });
  const end = () => {
    if (!on) return;
    on = 0;
    d.style.transition = '';
    d.style.transform = '';
    d.style.opacity = '';
    if (Math.abs(dx) > 50) {
      S.ana = dx < 0 ? 1 : 0;
      save();
      draw();
    }
  };
  d.addEventListener('pointerup', end);
  d.addEventListener('pointercancel', end);
})();
$('#dots').onclick = () => { S.ana = !S.ana; save(); draw(); };

// セレクトボックス初期化
$('#subj').innerHTML = Object.entries(SUBJ).map(([g, a]) => `<optgroup label="${g}">` + a.map(x => `<option>${x}</option>`).join('') + '</optgroup>').join('');
$('#subj').value = S.subj || '数学';
$('#subj').onchange = () => { S.subj = $('#subj').value; save(); };

$('#snd').innerHTML = SN.map((n, i) => `<option value="${i}">音${i + 1} ${n}</option>`).join('');
$('#snd').value = S.snd;
$('#snd').onchange = () => { S.snd = +$('#snd').value; save(); beep(S.snd); };
$('#tsn').onclick = () => beep(S.snd);

$('#pd').onchange = stats;
sw($('#wb2'), d => wk(d > 0 ? -1 : 1));

// 滑らかな描画ループ
(function L() {
  if (S.T.sw.run || S.T.tm.run) tick();
  requestAnimationFrame(L);
})();

draw();
stats();
</script>
</body>
</html>
