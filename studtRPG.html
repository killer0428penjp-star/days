<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
:root{--bg:#f6f1e6;--card:#fffaf0;--bd:#b8975a;--tx:#3b2f1e}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;overflow:hidden}
.scr{position:fixed;inset:0;display:none;align-items:center;justify-content:center}.scr.on{display:flex}
button,input,select{font:inherit;padding:.5em .9em;border-radius:8px;border:2px solid var(--bd);background:#fff;color:var(--tx)}
button{cursor:pointer;box-shadow:0 2px 0 var(--bd)}button:hover{background:#f6e7c1}button:active{transform:translateY(2px);box-shadow:none}button:disabled{opacity:.45;cursor:default}
.card{background:var(--card);border:3px solid var(--bd);padding:5vmin;border-radius:14px;width:min(92vw,420px);display:flex;flex-direction:column;gap:2.2vmin;max-height:94vh;overflow:auto;box-shadow:0 6px 20px #0003}
.row{display:flex;gap:2vmin}.row>*{flex:1;min-width:0}
#auth{background:linear-gradient(#cfe9ff,#e9f5d6)}
#hud{position:fixed;top:1.5vmin;left:1.5vmin;z-index:20;display:none;text-align:left;font-size:max(14px,2.2vmin);line-height:1.5;box-shadow:0 3px 0 var(--bd),0 4px 10px #0003}
#tb{position:fixed;top:1.5vmin;right:1.5vmin;z-index:20;display:flex;gap:6px}#tb button{padding:.4em .7em}
.mb{display:none}
#back{display:none}#menu{position:fixed;top:calc(1.5vmin + 3.1em);right:1.5vmin;z-index:25;display:none;flex-direction:column;gap:6px;background:var(--card);border:3px solid var(--bd);border-radius:12px;padding:8px;box-shadow:0 4px 14px #0004}#menu button{text-align:left;white-space:nowrap}
#map{isolation:isolate}#lmap{width:100%;height:100%}
.pin{width:18px;height:18px;border-radius:50%;background:#e33;border:3px solid #fff;box-shadow:0 0 8px #000a;transform:translate(-9px,-9px);animation:pu 1.2s infinite}.pin.lk{background:#999;animation:none}
@keyframes pu{50%{transform:translate(-9px,-9px) scale(1.35)}}
.pl{position:absolute;left:14px;top:-14px;white-space:nowrap;background:var(--card);border:2px solid var(--bd);border-radius:6px;padding:1px 7px;font-weight:bold;font-size:13px}
#town{flex-direction:column;background:#e8dfc9}
#cv{width:min(100vw,calc((100vh - 70px)*1.5));aspect-ratio:3/2;image-rendering:pixelated;touch-action:none;background:#6fbf5a}
#hint{position:fixed;top:calc(1.5vmin + 4.8em);left:50%;transform:translateX(-50%);background:#fffaf0;border:2px solid var(--bd);padding:.4em 1em;border-radius:20px;z-index:10;display:none;font-size:max(13px,2.2vmin)}
#dlg{position:fixed;left:2%;right:2%;bottom:2%;min-height:22%;background:#fffdf5f2;color:var(--tx);border:3px solid #8a6d3b;border-radius:12px;padding:2.5vmin 3vmin;z-index:70;display:none;cursor:pointer;font-family:var(--f);font-size:var(--s);box-shadow:0 4px 16px #0004}
#dnm{color:#b5651d;font-weight:bold;margin-bottom:.4em}
#gear{position:absolute;top:6px;right:8px;background:none;border:0;box-shadow:none;font-size:1.3em;padding:2px 6px}
#set{display:none;position:absolute;bottom:105%;right:0;background:var(--card);border:2px solid var(--bd);border-radius:8px;padding:12px;width:min(90vw,300px);font-size:14px;gap:8px;flex-direction:column;cursor:default;font-family:sans-serif}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#3b2f1ee6;color:#fff;padding:.5em 1.2em;border-radius:20px;z-index:90;display:none}
/* バトル */
#battle{flex-direction:column;align-items:stretch;justify-content:flex-start;background:var(--card)}
#field{position:relative;flex:0 0 44%;background:linear-gradient(#bfe3ff 0 55%,#9fd27a 55%);overflow:hidden}
#field.red{animation:fr .5s}@keyframes fr{0%{box-shadow:inset 0 0 0 100vmax #f005}100%{box-shadow:none}}
.sp{position:absolute;width:min(22vw,20vh);image-rendering:pixelated;transition:transform .15s,opacity .6s;filter:drop-shadow(0 4px 2px #0003)}
#esp{right:12%;top:12%}#msp{left:10%;bottom:4%}
.hb{position:absolute;background:#fffdf0;border:3px solid #5a4a2a;border-radius:10px;padding:6px 10px;width:min(46%,260px);font-size:max(12px,1.8vh);z-index:2}
#ehb{left:4%;top:6%}#mhb{right:4%;bottom:6%}
.bar{height:12px;background:#ccc;border-radius:6px;overflow:hidden;border:1px solid #444;margin-top:3px}
.bar i{display:block;height:100%;width:100%;background:#3c6;transition:width .5s,background .3s}
.f{position:absolute;font-weight:bold;font-size:min(9vw,6vh);color:#e33;text-shadow:0 0 4px #fff,0 0 4px #fff,0 0 4px #fff;animation:fl .95s forwards;pointer-events:none;z-index:5}
@keyframes fl{from{transform:translateY(0) scale(1.4);opacity:1}to{transform:translateY(-60px) scale(1);opacity:0}}
.hit{animation:hit .5s}
@keyframes hit{0%,100%{transform:translateX(0);filter:none}20%{transform:translateX(-14px);filter:brightness(2.2) saturate(0)}40%{transform:translateX(14px)}60%{transform:translateX(-10px);filter:brightness(2.2) saturate(0)}80%{transform:translateX(8px)}}
.atkP{transform:translate(18vw,-8vh)!important}.atkE{transform:translate(-18vw,8vh)!important}
.ko{opacity:.15;transform:rotate(80deg) translateY(30px)}
#panel{flex:1;overflow:auto;padding:1.5vmin;display:flex;flex-direction:column;align-items:center;gap:1.2vmin}
#items{display:flex;gap:2vmin;align-items:center}#bst{color:#c60;font-weight:bold;font-size:14px}
#q{font-size:max(18px,3.2vmin);text-align:center;white-space:pre-line;font-weight:bold}
#ch{display:grid;grid-template-columns:1fr 1fr;gap:1.4vmin;width:min(94vw,560px)}
#ch button{padding:.9em .4em;font-size:max(15px,2.7vmin)}
.ok{background:#bdebc8!important;border-color:#2a9a52!important}.ng{background:#f7c4c4!important;border-color:#c33!important}
#ex{width:min(94vw,560px);display:flex;flex-direction:column;gap:1vmin;align-items:center}
.res{font-size:max(17px,3vmin);font-weight:bold}.res.g{color:#1a8a42}.res.r{color:#c22}
.exp{background:#fff6d8;border:2px solid #e0c060;border-radius:10px;padding:1.2vmin 1.8vmin;width:100%;line-height:1.6;font-size:max(14px,2.3vmin)}
.rc{width:100%;border:4px solid #d4a017;border-radius:14px;background:linear-gradient(#fff8dc,#ffe9a8);text-align:center;padding:2vmin;display:flex;flex-direction:column;gap:1vmin;font-size:max(16px,2.8vmin)}
.rc.lose{border-color:#889;background:linear-gradient(#f2f2f2,#d8d8e0)}.rc h2{margin:0;font-size:max(26px,5vmin)}
.rc .lvup{color:#7a3fd0;font-weight:bold}
/* モーダル */
#modal{position:fixed;inset:0;background:#0006;z-index:60;display:none;align-items:center;justify-content:center}
.pf{width:min(94vw,460px);max-height:94vh;overflow:auto;background:var(--card);border:4px solid #8a6d3b;border-radius:16px;box-shadow:0 0 0 3px #e8d49a,0 8px 24px #0005}
.ph{display:flex;gap:12px;align-items:center;padding:14px;background:linear-gradient(135deg,#f3d27a,#e29a4a);border-bottom:4px solid #8a6d3b}
.ph h3{margin:0;color:#fff;text-shadow:0 1px 2px #6a3b0a}
.av{width:64px;height:64px;border-radius:50%;background:#bfe3ff;border:3px solid #8a6d3b;flex:none;overflow:hidden}.av canvas{width:100%;height:100%;image-rendering:pixelated}
.ph input{width:100%;padding:.3em .6em;font-weight:bold}.ttl{margin-top:4px;font-size:13px;color:#fff;text-shadow:0 1px 2px #6a3b0a;font-weight:bold}
.pb{padding:14px;display:flex;flex-direction:column;gap:10px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.c{border:3px solid;border-radius:10px;padding:8px;text-align:center}.c small{display:block;font-size:11px;font-weight:bold}.c b{font-size:22px}
.lv{background:#eee3ff;border-color:#8b5cf6;color:#5b34b8}.co{background:#fff3c4;border-color:#d4a017;color:#8a6200}.dy{background:#dff5df;border-color:#3a9a3a;color:#1f6a1f}
.tags{display:flex;gap:8px;flex-wrap:wrap}.tg{padding:3px 12px;border-radius:20px;font-size:13px;font-weight:bold;border:2px solid}.tg.b{background:#dcecff;border-color:#4a90d9;color:#1f5fa8}.tg.p{background:#ffe0ec;border-color:#e0709a;color:#a8305f}
.slot{border:2px dashed #b9a572;border-radius:8px;padding:10px;color:#9a8a60;font-size:13px;text-align:center}
.pf>.row{padding:0 14px 14px}
.li{display:flex;align-items:center;gap:8px;padding:8px;border:2px solid #e0c98a;border-radius:10px;background:#fffdf3;cursor:pointer}
.li b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}.li small{color:#8a7a50}
.tabs{display:flex;gap:6px}.tabs button.on{background:#f3d27a}
details{border:2px solid #e0c98a;border-radius:8px;padding:6px 10px;background:#fffdf3;font-size:14px}details summary{cursor:pointer}
.sm{font-size:12px;color:#8a7a50}
#fig{display:flex;justify-content:center;width:min(94vw,560px)}#fig:empty{display:none}#avg button.on{background:#f3d27a;border-color:#d4a017}#sr:disabled{opacity:.4}
#nav{position:fixed;left:0;right:0;bottom:0;height:calc(62px + env(safe-area-inset-bottom));z-index:30;display:none;background:var(--card);border-top:3px solid var(--bd);padding:4px 4px calc(4px + env(safe-area-inset-bottom));gap:4px;align-items:stretch}
#nav button{flex:1;min-width:0;padding:2px;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;box-shadow:none;white-space:nowrap}
#nav button span{font-size:22px}#nav button.c{background:#f3d27a;border-color:#d4a017}
#sub{position:fixed;right:6px;bottom:calc(70px + env(safe-area-inset-bottom));z-index:31;display:none;flex-direction:column;gap:6px;background:var(--card);border:3px solid var(--bd);border-radius:12px;padding:8px;box-shadow:0 4px 14px #0004}
#map,#town,#study{bottom:calc(62px + env(safe-area-inset-bottom))}#study{background:#fff}#stf{width:100%;height:100%;border:0;display:block}
/* オンライン対戦・問題作成 */
#ol{flex-direction:column;justify-content:flex-start;align-items:stretch;background:var(--bg)}
#oh{display:flex;align-items:center;gap:10px;padding:calc(4.8em + env(safe-area-inset-top)) 10px 8px;border-bottom:3px solid var(--bd);background:var(--card);flex:none}
#ob{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:10px;width:min(100%,560px);align-self:center}
#of{flex:none;display:none;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:3px solid var(--bd);text-align:center;font-weight:bold}
#ob>*{flex:none}.big{padding:1.1em;font-size:1.15em;font-weight:bold}.go{background:#f3d27a;border-color:#d4a017}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{flex:1}.seg button.on{background:#f3d27a;border-color:#d4a017}
.oc{background:var(--card);border:3px solid var(--bd);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.orow{display:flex;gap:8px;align-items:center}.orow>*{min-width:0}.orow>input:not([type=radio]),.orow>select,.orow>button.big{flex:1}
.og{display:grid;grid-template-columns:1fr 1fr;gap:8px}.og label{display:flex;flex-direction:column;font-size:12px;gap:2px}
textarea{font:inherit;padding:.5em;border:2px solid var(--bd);border-radius:8px;min-height:3.2em;width:100%;background:#fff;color:var(--tx)}
.oq{font-size:max(18px,3vmin);font-weight:bold;white-space:pre-line;text-align:center}
.oim{max-width:100%;max-height:220px;border-radius:8px;border:2px solid #e0c98a;align-self:center}
.ofg{display:flex;justify-content:center}.otm{text-align:center;font-weight:bold;color:#c60}
#och{display:grid;grid-template-columns:1fr 1fr;gap:8px}#och input{grid-column:1/-1}.ohb{font-size:14px}.fl{flex:1;font-size:12px}
</style></head><body>

<button id="hud" onclick="openProf()"></button>
<div id="tb"><button id="back" onclick="backToMap()">← 戻る</button><button onclick="setLang()">EN/JA</button><button class="mb" id="gb" onclick="toggleMenu()" title="メニュー">⚙</button></div>

<!-- ############ ここから問題データ(★=難易度 × 教科。ブロックごとに独立。1つ壊れても他は動きます) ############ -->
<script>window.QB={};function Q(star,subj,rows){var M={math:'数学',japanese:'国語',english:'英語',science:'理科',social:'社会'};subj=M[subj]||subj;var k=star+'|'+subj;if(!QB[k])QB[k]=[];for(var i=0;i<rows.length;i++)QB[k].push(rows[i])}</script>
<!-- ================ ★1(小学生の範囲) 数学 ================ -->
<script>Q(1,'数学',[
  // ["問題文","選択肢A","選択肢B","選択肢C","選択肢D","正解(A〜D)","解説"],   ← この形で、ここに追加
  ["0.6 + 0.7 = ?", "1.2", "1.3", "0.13", "1.4", "B", "小数のたし算は位をそろえて計算します。0.6+0.7=1.3です。"],
  ["3/4 + 1/4 = ?", "1", "3/16", "1/4", "4/8", "A", "分母が同じ分数のたし算は、分子だけをたします。(3+1)/4=4/4=1です。"],
  ["1/2 + 1/3 = ?", "2/6", "2/5", "1/5", "5/6", "D", "通分して 3/6+2/6=5/6です。分母どうし・分子どうしをそのままたしてはいけません。"],
  ["2/3 × 3/4 = ?", "6/7", "2/7", "5/7", "1/2", "D", "分数のかけ算は、分子どうし・分母どうしをかけます。(2×3)/(3×4)=6/12=1/2です。"],
  ["6 ÷ 3/4 = ?", "3/2", "8", "9/2", "2", "B", "分数でわるときは、逆数をかけます。6×4/3=8です。"],
  ["たて6cm、よこ9cmの長方形の面積は?", "54cm²", "27cm²", "15cm²", "30cm²", "A", "長方形の面積=たて×よこ=6×9=54cm²です。"],
  ["底辺10cm、高さ6cmの三角形の面積は?", "15cm²", "30cm²", "60cm²", "16cm²", "B", "三角形の面積=底辺×高さ÷2=10×6÷2=30cm²です。"],
  ["半径5cmの円の面積は?(円周率3.14)", "157cm²", "31.4cm²", "15.7cm²", "78.5cm²", "D", "円の面積=半径×半径×円周率=5×5×3.14=78.5cm²です。"],
  ["直径10cmの円の円周の長さは?(円周率3.14)", "31.4cm", "78.5cm", "15.7cm", "62.8cm", "A", "円周=直径×円周率=10×3.14=31.4cmです。"],
  ["1辺4cmの立方体の体積は?", "48cm³", "16cm³", "64cm³", "96cm³", "C", "立方体の体積=1辺×1辺×1辺=4×4×4=64cm³です。"],
  ["たて3cm、よこ5cm、高さ2cmの直方体の体積は?", "10cm³", "62cm³", "15cm³", "30cm³", "D", "直方体の体積=たて×よこ×高さ=3×5×2=30cm³です。"],
  ["12と18の最大公約数は?", "2", "3", "6", "36", "C", "12=2×2×3、18=2×3×3。共通する素因数をかけると2×3=6です。"],
  ["4と6の最小公倍数は?", "2", "12", "24", "10", "B", "4の倍数(4,8,12…)と6の倍数(6,12…)で最初に共通するのは12です。"],
  ["時速60kmで2時間30分走ると、進む道のりは?", "150km", "120km", "130km", "180km", "A", "2時間30分=2.5時間。道のり=速さ×時間=60×2.5=150kmです。"],
  ["40人のクラスで男子が24人います。男子の割合は何%?", "6%", "40%", "60%", "24%", "C", "割合=24÷40=0.6。百分率にすると60%です。"],

/* 1問 = ["問題文","選択肢A","選択肢B","選択肢C","選択肢D","正解(A〜D か 1〜4)","解説", 図(省略可)]
   旧形式 ["問題文","正解",["誤1","誤2","誤3"],"解説", 図] も読めます */
function normRow(r,star,s,n){const bad=m=>({err:`${n}番目: ${m}`});
 if(!Array.isArray(r))return bad('[ ] の配列になっていません');
 let q=r[0],a,w,e,fig;
 if(Array.isArray(r[2])){a=String(r[1]),w=[...new Set(r[2].map(String))].filter(x=>x!==a);e=r[3];fig=r[4];if(w.length<3)return bad('誤答が3つ未満です')}
 else{const ch=[r[1],r[2],r[3],r[4]].map(x=>x==null?'':String(x).trim());if(ch.some(x=>!x))return bad('選択肢が4つそろっていません(「問題,A,B,C,D,正解,解説」の順)');if(new Set(ch).size<4)return bad('同じ選択肢があります');
  const k=String(r[5]==null?'':r[5]).trim(),idx=k.length==1?('ABCD'.indexOf(k.toUpperCase())>=0?'ABCD'.indexOf(k.toUpperCase()):'1234'.indexOf(k)):-1;
  if(idx<0)return bad(`正解は "A"〜"D" か 1〜4 で書いてください(今: ${String(r[5]).slice(0,10)})`);a=ch[idx];w=ch.filter((_,j)=>j!=idx);e=r[6];fig=r[7]}
 if(typeof q!='string'||!q.trim())return bad('問題文が空です');
 const it={id:`${star}-${SKEY[s]}-${qhash(q+'\u0001'+[a,...w].sort().join('\u0001'))}`,q,a,w,e:e?String(e):'この問題の解説は まだありません。',f:'',img:''};
 if(fig){fig=String(fig);if(/^<svg/i.test(fig))it.f=fig;else if(/\.(png|jpe?g|gif|webp|svg)$/i.test(fig)||/^https?:/.test(fig))it.img=fig}
 return{item:it}}
function readBlock(star,s){const blk=window.QB&&window.QB[star+'|'+s],items=[],errs=[],seen=new Set();
 if(!blk)return{items,errs:['ブロックが見つからないか、ブロックの中にエラー(カッコ・カンマ・引用符)があります'],missing:true};
 blk.forEach((r,i)=>{const o=normRow(r,star,s,i+1);if(o.err)return errs.push(o.err);if(seen.has(o.item.id))return errs.push(`${i+1}番目: 同じ問題が重複しています`);seen.add(o.item.id);items.push(o.item)});
 return{items,errs,missing:false}}
async function loadPool(star,s){const k=star+'|'+s;if(POOL[k])return POOL[k];
 const b=readBlock(star,s);let all=b.items.slice();const from=[];
 for(let d=1;d<7&&all.length<10;d++)for(const st of[star-d,star+d]){if(st<1||st>7||all.length>=10)continue;const o=readBlock(st,s);if(o.items.length){from.push(st);all=all.concat(o.items.filter(x=>!all.some(y=>y.id==x.id)))}}
 return POOL[k]={items:b.items,all,borrowed:all.length-b.items.length,from,errs:b.errs,n:b.items.length}}
function san(svg){const d=document.createElement('div');d.innerHTML=svg;d.querySelectorAll('script,foreignObject,iframe,object,embed').forEach(e=>e.remove());d.querySelectorAll('*').forEach(el=>[...el.attributes].forEach(a=>{if(/^on/i.test(a.name)||/javascript:/i.test(a.value))el.removeAttribute(a.name)}));return d.innerHTML}
