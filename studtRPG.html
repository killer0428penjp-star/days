<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>勉強RPG</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f6f1e6;--card:#fffaf0;--bd:#b8975a;--tx:#3b2f1e}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;overflow:hidden}
.scr{position:fixed;inset:0;display:none;align-items:center;justify-content:center}.scr.on{display:flex}
button,input,select{font:inherit;padding:.6em 1em;border-radius:8px;border:2px solid var(--bd);background:#fff;color:var(--tx)}
button{cursor:pointer;box-shadow:0 2px 0 var(--bd)}button:hover{background:#f6e7c1}button:active{transform:translateY(2px);box-shadow:none}
.card{background:var(--card);border:3px solid var(--bd);padding:5vmin;border-radius:14px;width:min(92vw,420px);display:flex;flex-direction:column;gap:2.2vmin;max-height:94vh;overflow:auto;box-shadow:0 6px 20px #0003}
.row{display:flex;gap:2vmin}.row>*{flex:1;min-width:0}
#auth{background:linear-gradient(#cfe9ff,#e9f5d6)}
#hud{position:fixed;top:1.5vmin;left:1.5vmin;z-index:20;display:none;text-align:left;font-size:max(14px,2.2vmin);line-height:1.5;border-width:3px;box-shadow:0 3px 0 var(--bd),0 4px 10px #0003}
#lang{position:fixed;top:1.5vmin;right:1.5vmin;z-index:20;padding:.4em .8em}
#map{isolation:isolate}#lmap{width:100%;height:100%}
.pin{width:18px;height:18px;border-radius:50%;background:#e33;border:3px solid #fff;box-shadow:0 0 8px #000a;transform:translate(-9px,-9px);animation:pu 1.2s infinite}
@keyframes pu{50%{transform:translate(-9px,-9px) scale(1.35)}}
.pl{position:absolute;left:14px;top:-14px;white-space:nowrap;background:var(--card);border:2px solid var(--bd);border-radius:6px;padding:1px 7px;font-weight:bold;font-size:13px}
#town{flex-direction:column;background:#e8dfc9}
#cv{width:min(100vw,calc(100vh*1.5));aspect-ratio:3/2;image-rendering:pixelated;touch-action:none;background:#cfe8b0}
#hint{position:fixed;top:9vmin;left:50%;transform:translateX(-50%);background:#fffaf0;border:2px solid var(--bd);padding:.4em 1em;border-radius:20px;z-index:10;display:none;font-size:max(13px,2.2vmin)}
#dlg{position:fixed;left:2%;right:2%;bottom:2%;min-height:22%;background:#fffdf5f2;color:var(--tx);border:3px solid #8a6d3b;border-radius:12px;padding:2.5vmin 3vmin;z-index:50;display:none;cursor:pointer;font-family:var(--f);font-size:var(--s);box-shadow:0 4px 16px #0004}
#dnm{color:#b5651d;font-weight:bold;margin-bottom:.4em}
#gear{position:absolute;top:6px;right:8px;background:none;border:0;box-shadow:none;font-size:1.3em;padding:2px 6px}
#set{display:none;position:absolute;bottom:105%;right:0;background:var(--card);border:2px solid var(--bd);border-radius:8px;padding:12px;width:min(90vw,300px);font-size:14px;gap:8px;flex-direction:column;cursor:default;font-family:sans-serif}
/* バトル */
#battle{flex-direction:column;align-items:stretch;justify-content:flex-start;background:var(--card)}
#field{position:relative;flex:0 0 46%;background:linear-gradient(#bfe3ff 0 55%,#9fd27a 55%);overflow:hidden}
#field.red{animation:fr .5s}@keyframes fr{0%{box-shadow:inset 0 0 0 100vmax #f005}100%{box-shadow:none}}
.sp{position:absolute;font-size:min(18vw,16vh);line-height:1;transition:transform .15s,opacity .6s}
#esp{right:12%;top:12%}#msp{left:10%;bottom:6%}
.hb{position:absolute;background:#fffdf0;border:3px solid #5a4a2a;border-radius:10px;padding:6px 10px;width:min(46%,260px);font-size:max(12px,1.8vh);z-index:2}
#ehb{left:4%;top:6%}#mhb{right:4%;bottom:8%}
.bar{height:12px;background:#ccc;border-radius:6px;overflow:hidden;border:1px solid #444;margin-top:3px}
.bar i{display:block;height:100%;width:100%;background:#3c6;transition:width .5s,background .3s}
.f{position:absolute;font-weight:bold;font-size:min(9vw,6vh);color:#e33;text-shadow:0 0 4px #fff,0 0 4px #fff,0 0 4px #fff;animation:fl .95s forwards;pointer-events:none;z-index:5}
@keyframes fl{from{transform:translateY(0) scale(1.4);opacity:1}to{transform:translateY(-60px) scale(1);opacity:0}}
.hit{animation:hit .5s}
@keyframes hit{0%,100%{transform:translateX(0);filter:none}20%{transform:translateX(-14px);filter:brightness(2.2) saturate(0)}40%{transform:translateX(14px)}60%{transform:translateX(-10px);filter:brightness(2.2) saturate(0)}80%{transform:translateX(8px)}}
.atkP{transform:translate(18vw,-8vh)!important}.atkE{transform:translate(-18vw,8vh)!important}
.ko{opacity:.15;transform:rotate(80deg) translateY(30px)}
#panel{flex:1;overflow:auto;padding:2vmin;display:flex;flex-direction:column;align-items:center;gap:1.5vmin}
#q{font-size:max(18px,3.4vmin);text-align:center;white-space:pre-line;font-weight:bold}
#ch{display:grid;grid-template-columns:1fr 1fr;gap:1.6vmin;width:min(94vw,560px)}
#ch button{padding:1em .4em;font-size:max(15px,2.8vmin)}
.ok{background:#bdebc8!important;border-color:#2a9a52!important}.ng{background:#f7c4c4!important;border-color:#c33!important}
#ex{width:min(94vw,560px);display:flex;flex-direction:column;gap:1vmin;align-items:center}
.res{font-size:max(17px,3vmin);font-weight:bold}.res.g{color:#1a8a42}.res.r{color:#c22}
.exp{background:#fff6d8;border:2px solid #e0c060;border-radius:10px;padding:1.2vmin 1.8vmin;width:100%;line-height:1.6;font-size:max(14px,2.4vmin)}
/* プロフィール */
#modal{position:fixed;inset:0;background:#0006;z-index:60;display:none;align-items:center;justify-content:center}
.pf{width:min(92vw,440px);max-height:94vh;overflow:auto;background:var(--card);border:4px solid #8a6d3b;border-radius:16px;box-shadow:0 0 0 3px #e8d49a,0 8px 24px #0005}
.ph{display:flex;gap:12px;align-items:center;padding:14px;background:linear-gradient(135deg,#f3d27a,#e29a4a);border-bottom:4px solid #8a6d3b}
.av{width:64px;height:64px;border-radius:50%;background:#fff;border:3px solid #8a6d3b;font-size:38px;display:flex;align-items:center;justify-content:center;flex:none}
.ph input{width:100%;padding:.3em .6em;font-weight:bold}.ttl{margin-top:4px;font-size:13px;color:#fff;text-shadow:0 1px 2px #6a3b0a;font-weight:bold}
.pb{padding:14px;display:flex;flex-direction:column;gap:12px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.c{border:3px solid;border-radius:10px;padding:8px;text-align:center}.c small{display:block;font-size:11px;font-weight:bold}.c b{font-size:24px}
.lv{background:#eee3ff;border-color:#8b5cf6;color:#5b34b8}.co{background:#fff3c4;border-color:#d4a017;color:#8a6200}.dy{background:#dff5df;border-color:#3a9a3a;color:#1f6a1f}
.tags{display:flex;gap:8px;flex-wrap:wrap}.tg{padding:3px 12px;border-radius:20px;font-size:13px;font-weight:bold;border:2px solid}.tg.b{background:#dcecff;border-color:#4a90d9;color:#1f5fa8}.tg.p{background:#ffe0ec;border-color:#e0709a;color:#a8305f}
.slot{border:2px dashed #b9a572;border-radius:8px;padding:10px;color:#9a8a60;font-size:13px;text-align:center}
.pf .row{padding:0 14px 14px}
</style></head><body>

<button id="lang" onclick="setLang()">EN / JA</button>
<button id="hud" onclick="openProf()"></button>
<div id="hint"></div>

<div id="auth" class="scr on"><div class="card">
<h2 style="margin:0;text-align:center" data-i="title"></h2>
<input id="em" data-p="uid" autocapitalize="none" autocomplete="username" maxlength="20">
<input id="pw" type="password" data-p="pass" autocomplete="current-password">
<input id="nm" data-p="name">
<div class="row"><input id="ag" type="number" min="1" max="120" data-p="age">
<select id="ge"><option value="m" data-i="male"></option><option value="f" data-i="female"></option><option value="n" data-i="none"></option></select></div>
<div class="row"><button onclick="login()" data-i="login"></button><button onclick="signup()" data-i="signup"></button></div>
<button onclick="guest()" data-i="guest"></button>
<div id="msg" style="color:#c44;min-height:1.2em"></div>
</div></div>

<div id="map" class="scr"><div id="lmap"></div></div>
<div id="town" class="scr"><canvas id="cv" width="720" height="480"></canvas></div>

<div id="battle" class="scr">
<div id="field">
 <div class="hb" id="ehb"><b id="en"></b><div class="bar"><i id="eh"></i></div><small id="et"></small></div>
 <div class="sp" id="esp">👴</div>
 <div class="sp" id="msp">🧑</div>
 <div class="hb" id="mhb"><b id="mn"></b><div class="bar"><i id="mh"></i></div><small id="mt"></small></div>
</div>
<div id="panel"><div id="q"></div><div id="ch"></div><div id="ex"></div></div>
</div>

<div id="dlg" style="--f:sans-serif;--s:18px"><button id="gear">⚙</button>
<div id="set">
<label><span data-i="size"></span> <input id="s1" type="range" min="12" max="36" value="18"></label>
<label><span data-i="font"></span> <select id="s2"><option value="sans-serif">Sans</option><option value="serif">Serif</option><option value="monospace">Mono</option><option value="'Hiragino Maru Gothic ProN',cursive">Maru</option></select></label>
<label><input id="s3" type="checkbox"> <span data-i="auto"></span></label>
<label><span data-i="speed"></span> <input id="s4" type="range" min="10" max="120" value="40"></label>
</div><div id="dnm"></div><div id="dtx"></div></div>

<div id="modal"><div class="pf">
<div class="ph"><div class="av">🧑</div><div style="flex:1;min-width:0"><div class="row" style="padding:0"><input id="pn"><button onclick="saveName()" data-i="save" style="flex:none"></button></div><div class="ttl" id="ttl"></div></div></div>
<div class="pb" id="pbody"></div>
<div class="row"><button onclick="logout()" data-i="logout"></button><button onclick="$('modal').style.display='none'" data-i="close"></button></div>
</div></div>

<script>
const SB_URL='https://wxvodrdrkapoulivmzyr.supabase.co',SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4dm9kcmRya2Fwb3VsaXZtenlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxOTEwODUsImV4cCI6MjEwODc2NzA4NX0.D54gcTMqfdHNYjs29U41zgEQpRC8v4QkBC7m4XkUSXE';
const sb=(SB_URL&&window.supabase)?supabase.createClient(SB_URL,SB_KEY):null;
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const T={ja:{title:'勉強RPG',uid:'ID(英数字3〜20字)',pass:'パスワード(6文字以上)',name:'名前',age:'年齢',male:'男性',female:'女性',none:'選択しない',login:'ログイン',signup:'新規登録',guest:'ゲストで始める',logout:'ログアウト',coin:'コイン',lv:'Lv',days:'冒険日数',profile:'プロフィール',save:'保存',close:'閉じる',slot:'(今後追加予定)',size:'文字サイズ',font:'フォント',auto:'オート',speed:'再生速度(小さいほど速い)',town:'始まりの町',hint:'まず長老の家へ行ってみよう',locked:'この家にはまだ入れないようだ…',nosb:'Supabase未設定です。ゲストで始めてください',need:'ID(英数字3〜20字)・パスワード(6文字以上)・名前を入力してください',confirmon:'SupabaseのConfirm emailがONです。OFFにしてください',win:'勝利!',draw:'引き分け',lose:'敗北…',ageL:'年齢を入力してください',next:'次へ',expl:'解説',titles:['見習い勉強者','勉強の冒険者','数式の戦士','計算の騎士','算数の勇者']},
en:{title:'Study RPG',uid:'ID (3-20 letters/digits)',pass:'Password (6+ chars)',name:'Name',age:'Age',male:'Male',female:'Female',none:'Prefer not to say',login:'Log in',signup:'Sign up',guest:'Play as guest',logout:'Log out',coin:'Coins',lv:'Lv',days:'Days',profile:'Profile',save:'Save',close:'Close',slot:'(coming soon)',size:'Text size',font:'Font',auto:'Auto',speed:'Speed (lower = faster)',town:'Starting Town',hint:"Visit the Elder's house first",locked:"You can't enter this house yet...",nosb:'Supabase is not configured. Play as guest.',need:'Enter ID (3-20 letters/digits), password (6+) and name',confirmon:'Supabase Confirm email is ON. Turn it OFF.',win:'Victory!',draw:'Draw',lose:'Defeated...',ageL:'Enter your age',next:'Next',expl:'Explanation',titles:['Novice','Adventurer','Math Fighter','Calc Knight','Hero']}};
let S=JSON.parse(localStorage.getItem('rpgstudy')||'null')||{lang:'ja',name:'',age:'',gender:'n',start:Date.now(),coin:0,prologue:false,cleared:false};
let user=null,ts={size:18,font:'sans-serif',auto:false,speed:40};
const t=k=>(T[S.lang]||T.ja)[k]||k,save=()=>localStorage.setItem('rpgstudy',JSON.stringify(S));
function i18n(){document.documentElement.lang=S.lang;
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
 document.querySelectorAll('[data-p]').forEach(e=>e.placeholder=t(e.dataset.p));
 if(mkr)mkr.setIcon(mkIcon());hud();}
function setLang(){S.lang=S.lang=='ja'?'en':'ja';save();i18n();}
const lvl=()=>1+Math.floor(S.coin/1000);
function hud(){$('hud').innerHTML=`⚔ ${S.name||'-'} &nbsp; ${t('lv')}.${lvl()}<br>💰 ${S.coin}`;}
function show(id){document.querySelectorAll('.scr').forEach(e=>e.classList.toggle('on',e.id==id));
 const hide=id=='auth'||id=='battle';$('hud').style.display=hide?'none':'block';$('lang').style.display=id=='battle'?'none':'block';
 $('hint').style.display=(id=='town'&&!S.cleared)?'block':'none';
 if(id=='map'){initMap();setTimeout(()=>lm.invalidateSize(),60)}}

/* ===== 世界マップ(Leaflet + OpenStreetMap) ===== */
let lm,mkr;
const mkIcon=()=>L.divIcon({className:'tm',html:`<div class="pin"></div><div class="pl">${t('town')}</div>`,iconSize:[0,0]});
function initMap(){if(lm)return;
 lm=L.map('lmap',{zoomControl:false,minZoom:2,maxZoom:9,maxBounds:[[-85,-200],[85,200]],maxBoundsViscosity:.8}).setView([30,60],2);
 L.control.zoom({position:'bottomright'}).addTo(lm);
 L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(lm);
 mkr=L.marker([35.68,139.76],{icon:mkIcon()}).addTo(lm).on('click',goTown);}

/* ===== 認証 ===== */
const msg=m=>$('msg').textContent=m||'';
const form=()=>({name:$('nm').value.trim(),age:+$('ag').value||'',gender:$('ge').value});
const mail=id=>id.toLowerCase()+'@studyrpg.example.com',okId=id=>/^[A-Za-z0-9_]{3,20}$/.test(id);
async function signup(){if(!sb)return msg(t('nosb'));const id=$('em').value.trim(),p=$('pw').value,f=form();
 if(!okId(id)||p.length<6||!f.name)return msg(t('need'));
 const{data,error}=await sb.auth.signUp({email:mail(id),password:p,options:{data:f}});
 if(error)return msg(error.message);if(!data.session)return msg(t('confirmon'));
 await sb.from('profiles').update({name:f.name,age:f.age||null,gender:f.gender}).eq('id',data.session.user.id);
 afterLogin();}
async function login(){if(!sb)return msg(t('nosb'));
 const{error}=await sb.auth.signInWithPassword({email:mail($('em').value.trim()),password:$('pw').value});
 if(error)return msg(error.message);afterLogin();}
async function afterLogin(){const{data:{session}}=await sb.auth.getSession();if(!session)return;user=session.user;
 const{data:p}=await sb.from('profiles').select('*').eq('id',user.id).single();
 if(p){const u={};
  if(!p.name){const n=prompt(t('name'));if(n&&n.trim())u.name=n.trim()}
  if(p.age==null){const a=+prompt(t('ageL'));if(a)u.age=a}
  if(Object.keys(u).length){const{error}=await sb.from('profiles').update(u).eq('id',user.id);if(error)alert(error.message);else Object.assign(p,u)}
  S.name=p.name||'';S.age=p.age||'';S.gender=p.gender||'n';S.coin=p.coin;S.start=new Date(p.created_at).getTime();
  sb.from('profiles').update({last_login_at:new Date().toISOString()}).eq('id',user.id);}
 save();start();}
function guest(){const f=form();S.name=f.name||'ゲスト';S.age=f.age;S.gender=f.gender;if(!S.start)S.start=Date.now();save();start();}
async function logout(){if(sb)await sb.auth.signOut();user=null;$('modal').style.display='none';show('auth');}
if(sb)sb.auth.getSession().then(({data:{session}})=>{if(session)afterLogin();});

/* ===== 会話 ===== */
function applyTs(){const d=$('dlg');d.style.setProperty('--f',ts.font);d.style.setProperty('--s',ts.size+'px');}
$('gear').onclick=e=>{e.stopPropagation();$('set').style.display=$('set').style.display=='flex'?'none':'flex';};
$('set').onclick=e=>e.stopPropagation();
$('s1').oninput=e=>{ts.size=+e.target.value;applyTs()};$('s2').onchange=e=>{ts.font=e.target.value;applyTs()};
$('s3').onchange=e=>ts.auto=e.target.checked;$('s4').oninput=e=>ts.speed=+e.target.value;
function dlg(lines,who=''){return new Promise(res=>{const box=$('dlg'),tx=$('dtx');let i=0,full='',n=0,typing=false,timer,tok=0;
 box.style.display='block';$('dnm').textContent=who;
 const end=()=>{clearInterval(timer);typing=false;const k=tok;if(ts.auto)setTimeout(()=>{if(k==tok&&box.style.display=='block')next()},1300);};
 const next=()=>{if(i>=lines.length){box.style.display='none';$('set').style.display='none';box.onclick=null;res();return}
  tok++;full=lines[i++];n=0;typing=true;tx.textContent='';clearInterval(timer);
  timer=setInterval(()=>{tx.textContent=full.slice(0,++n);if(n>=full.length)end()},ts.speed)};
 box.onclick=()=>{if(typing){tx.textContent=full;end()}else next()};next();});}
const PROLOGUE=['むかしむかし、この世界は平和だった。','だが ある日、魔王「おすC大魔神」が現れ、世界を支配してしまった。','しかし大魔神には 弱点があった。……それは「勉強がまったくできない」こと。','主人公「ならば、ぼくが勉強して、おすCに勉強を教えよう。そうすれば、世界の支配もやめてくれるはずだ!」','こうして、勉強で世界を救う旅が始まった。','まずは「始まりの町」を目指そう。(マップは拡大・縮小できます)'];

/* ===== 流れ・プロフィール ===== */
async function start(){hud();show('map');if(!S.prologue){await dlg(PROLOGUE,'');S.prologue=true;save();}}
function goTown(){show('town');draw();}
function openProf(){const d=Math.floor((Date.now()-S.start)/864e5)+1,L=lvl(),ex=S.coin%1000,g={m:t('male'),f:t('female'),n:t('none')}[S.gender]||'';
 $('pn').value=S.name;$('ttl').textContent=`${t('lv')}.${L}  ${t('titles')[Math.min(L-1,4)]}`;
 $('pbody').innerHTML=`<div class="st"><div class="c lv"><small>${t('lv')}</small><b>${L}</b></div><div class="c co"><small>${t('coin')}</small><b>${S.coin}</b></div><div class="c dy"><small>${t('days')}</small><b>${d}</b></div></div>
 <div><small><b>EXP</b> ${ex} / 1000</small><div class="bar"><i style="width:${ex/10}%;background:#8b5cf6"></i></div></div>
 <div class="tags"><span class="tg b">${t('age')}: ${S.age||'-'}</span><span class="tg p">${g}</span></div>
 <div class="slot">${t('slot')}</div><div class="slot">${t('slot')}</div>`;
 $('modal').style.display='flex';}
async function saveName(){const n=$('pn').value.trim();if(!n)return;
 if(sb&&user){const{error}=await sb.from('profiles').update({name:n}).eq('id',user.id);if(error)return alert(error.message)}
 S.name=n;save();hud();}

/* ===== 町 ===== */
const MAP=["TTTTTTTTTTTTTTT","TGGHHGGGGHHGGGT","TGGHEGGGGHdGGGT","TGGGRGGGGGRGGGT","TRRRRRRRRRRRRRT","TGGGGGGRGGGGGGT","TGGGGGGRGGGGGGT","TGGGGGGRGGGGGGT","TGGGGGGRGGGGGGT","TTTTTTTXTTTTTTT"];
const TS=48,cv=$('cv'),cx=cv.getContext('2d');let px=7,py=6,dir='d',busy=false,bob=0;
function tile(c,x,y){const X=x*TS,Y=y*TS;cx.fillStyle=c=='R'||c=='X'?'#d9c58f':'#6fbf5a';cx.fillRect(X,Y,TS,TS);
 if(c=='T'){cx.fillStyle='#3d8a3d';cx.beginPath();cx.arc(X+24,Y+24,21,0,7);cx.fill();}
 if(c=='H'){cx.fillStyle='#c97a4a';cx.fillRect(X,Y,TS,TS);cx.fillStyle='#8a3a2a';cx.fillRect(X,Y,TS,14);}
 if(c=='E'||c=='d'){cx.fillStyle='#c97a4a';cx.fillRect(X,Y,TS,TS);cx.fillStyle=c=='E'?'#ffd65a':'#999';cx.fillRect(X+12,Y+8,24,40);}
 if(c=='X'){cx.fillStyle='#fff';cx.font='20px sans-serif';cx.fillText('▼',X+13,Y+32);}}
function draw(){cx.clearRect(0,0,720,480);MAP.forEach((r,y)=>[...r].forEach((c,x)=>tile(c,x,y)));

async function mv(dx,dy,d){if(busy||!$('town').classList.contains('on'))return;dir=d;const nx=px+dx,ny=py+dy,c=(MAP[ny]||'')[nx];
 if(!c||'TH'.includes(c)){draw();return}const ox=px,oy=py;px=nx;py=ny;draw();

addEventListener('keydown',e=>{const m={ArrowUp:[0,-1,'u'],w:[0,-1,'u'],ArrowDown:[0,1,'d'],s:[0,1,'d'],ArrowLeft:[-1,0,'l'],a:[-1,0,'l'],ArrowRight:[1,0,'r'],d:[1,0,'r']}[e.key];
 if(m){e.preventDefault();mv(...m)}});

/* ===== 問題(中1数学・単元別50問。答えはコードで計算、全問に解説つき) ===== */
const BANK=(()=>{let s=11;const r=(a,b)=>{s=(s*1103515245+12345)&0x7fffffff;return a+((s>>8)%(b-a+1))};
 const B=[],add=(q,a,c,e)=>{a=String(a);const w=[...new Set(c.map(String))].filter(v=>v!==a).slice(0,3);B.push({q,a,w,e})};
 const sg=n=>n<0?`(${n})`:n;
 // 正負の数 加減 (10)
 for(let i=0;i<10;i++){const a=r(2,15),b=r(2,15);
  if(i%2==0){const x=b-a;add(`(-${a}) + ${b} = ?`,x,[a+b,-(a+b),a-b,x+1,x-1],`符号がちがう足し算は、絶対値の大きい方から小さい方をひき、大きい方の符号をつけます。${b} - ${a} = ${x}`)}
  else{const x=-(a+b);add(`(-${a}) - ${b} = ?`,x,[a+b,a-b,b-a,x-1,x+1],`ひき算は、ひく数の符号を変えて足し算にします。(-${a}) - ${b} = (-${a}) + (-${b}) = ${x}`)}}
 // 正負の数 乗除 (6)
 for(let i=0;i<6;i++){const a=r(2,9),b=r(2,9);
  if(i<3)add(`(-${a}) × (-${b}) = ?`,a*b,[-a*b,a+b,-(a+b),a*b+a,a*b-b],`負の数どうしのかけ算は、答えが正の数になります。${a} × ${b} = ${a*b}`);
  else add(`${a*b} ÷ (-${a}) = ?`,-b,[b,-a,a,-b-1,-b+2],`正の数 ÷ 負の数は、答えが負の数になります。${a*b} ÷ ${a} = ${b} なので、答えは -${b}`)}
 // 文字式の値 (6)
 for(let i=0;i<6;i++){const m=r(2,6),k=r(1,5),n=r(1,9),x=-m*k+n;
  add(`x = -${k} のとき、${m}x + ${n} の値は?`,x,[m*k+n,-m*k-n,-m*k-n+2*n+0,x+1,x-1,x+2],`x に -${k} を代入します。${m} × (-${k}) + ${n} = ${-m*k} + ${n} = ${x}`)}
 // 一次方程式 (8)
 for(let i=0;i<8;i++){const x=r(-6,8),a=r(2,6),b=r(1,9)*(r(0,1)?1:-1),c=a*x+b,bs=b>0?'+':'-';
  add(`${a}x ${bs} ${Math.abs(b)} = ${c} のとき、x = ?`,x,[x+1,x-1,-x,c-b,x+2,x-2],`${bs=='+'?'+':'-'}${Math.abs(b)} を移項すると ${a}x = ${c} ${bs=='+'?'-':'+'} ${Math.abs(b)} = ${c-b}。両辺を ${a} でわって x = ${x}`)}
 // 比例・反比例 (6)
 for(let i=0;i<3;i++){const p=r(2,5),k=r(2,6),n=r(6,12),y=k*n;
  add(`y は x に比例し、x = ${p} のとき y = ${p*k} です。x = ${n} のとき y = ?`,y,[y+k,y-k,k+n,p*n,y+2],`比例なので y = ax と表せます。${p*k} = a × ${p} より a = ${k}。よって y = ${k}x で、x = ${n} のとき y = ${y}`)}
 for(let i=0;i<3;i++){let p,n,a;do{a=[12,18,24,36][r(0,3)];p=[1,2,3,4,6][r(0,4)];n=[2,3,4,6][r(0,3)]}while(a%p||a%n||p==n);const y=a/n;
  add(`y は x に反比例し、x = ${p} のとき y = ${a/p} です。x = ${n} のとき y = ?`,y,[y+2,y-1,a/p,y*2,a],`反比例なので y = a/x と表せ、x × y = 一定です。${p} × ${a/p} = ${a} より a = ${a}。y = ${a} ÷ ${n} = ${y}`)}
 // 図形 (8)
 for(let i=0;i<2;i++){const R=r(3,9);add(`半径 ${R}cm の円の周の長さは?(円周率はπ)`,`${2*R}π cm`,[`${R}π cm`,`${R*R}π cm`,`${2*R*R}π cm`,`${4*R}π cm`],`円周 = 2 × π × 半径 = 2 × π × ${R} = ${2*R}π (cm)`)}
 for(let i=0;i<2;i++){const R=r(3,9);add(`半径 ${R}cm の円の面積は?(円周率はπ)`,`${R*R}π cm²`,[`${2*R}π cm²`,`${R}π cm²`,`${2*R*R}π cm²`,`${R*R*R}π cm²`],`円の面積 = π × 半径 × 半径 = π × ${R} × ${R} = ${R*R}π (cm²)`)}
 for(let i=0;i<2;i++){const[R,th,l]=[[6,60,2],[6,90,3],[12,90,6],[9,120,6]][r(0,3)];
  add(`半径 ${R}cm、中心角 ${th}° のおうぎ形の弧の長さは?`,`${l}π cm`,[`${l*2}π cm`,`${l+1}π cm`,`${l*3}π cm`,`${R}π cm`],`弧の長さ = 2π × 半径 × (中心角 ÷ 360) = 2π × ${R} × ${th}/360 = ${l}π (cm)`)}
 {const R=r(2,5),h=r(3,8);add(`底面の半径 ${R}cm、高さ ${h}cm の円柱の体積は?`,`${R*R*h}π cm³`,[`${R*h}π cm³`,`${2*R*R*h}π cm³`,`${R*R+h}π cm³`,`${2*R*h}π cm³`],`円柱の体積 = 底面積 × 高さ = π × ${R}² × ${h} = ${R*R*h}π (cm³)`)}
 {const R=r(2,6);add(`半径 ${R}cm の球の表面積は?`,`${4*R*R}π cm²`,[`${2*R*R}π cm²`,`${R*R}π cm²`,`${4*R}π cm²`,`${4*R*R*R}π cm²`],`球の表面積 = 4π × 半径² = 4π × ${R}² = ${4*R*R}π (cm²)`)}
 // 素数・素因数分解 (4)
 {const P=[11,13,17,19,23,29,31,37][r(0,7)],C=[21,27,33,39,49,51,57,63,91];const cs=[0,0,0].map((_,i)=>C[(r(0,8)+i*3)%9]);
  add('次のうち、素数はどれ?',P,cs,`素数とは、1 とその数自身しか約数をもたない数です。${P} はどの数でもわり切れないので素数です。ほかの数は 3 や 7 でわり切れます。`)}
 const PF=[[12,'2² × 3'],[18,'2 × 3²'],[20,'2² × 5'],[24,'2³ × 3'],[30,'2 × 3 × 5'],[36,'2² × 3²'],[45,'3² × 5'],[60,'2² × 3 × 5']];
 for(let i=0;i<2;i++){const k=r(0,7),[n,a]=PF[k];add(`${n} を素因数分解すると?`,a,PF.filter((_,j)=>j!=k).map(v=>v[1]).sort(()=>s%3-1),`小さい素数から順にわっていきます。${n} = ${a}`)}
 {const[a,b,g]=[[12,18,6],[24,36,12],[20,30,10],[18,27,9]][r(0,3)];add(`${a} と ${b} の最大公約数は?`,g,[g*2,g/3<1?g+1:Math.round(g/3)||1,a,g+2,a+b],`${a} と ${b} を割り切れる最大の数が最大公約数です。素因数分解して共通部分をかけると ${g} になります。`)}
 // 資料の活用 (2)
 {const n4=[0,0,0,0].map(()=>r(50,90)),sm=n4.reduce((x,y)=>x+y,0);let l=r(50,90);l+=(5-(sm+l)%5)%5;const all=[...n4,l],av=(sm+l)/5;
  add(`5人の点数は ${all.join(', ')} です。平均点は?`,av,[av+1,av-1,av+3,Math.max(...all)],`平均 = 合計 ÷ 人数。合計は ${sm+l} なので ${sm+l} ÷ 5 = ${av}`)}
 {let a=new Set;while(a.size<5)a.add(r(20,95));a=[...a];const so=[...a].sort((x,y)=>x-y),m=so[2];
  add(`データ ${a.join(', ')} の中央値は?`,m,[a[0]==m?so[0]:a[0],so[1],so[3],so[4],m+1],`値を小さい順に並べると ${so.join(', ')}。真ん中(3番目)の値が中央値で、${m} です。`)}
 return B})();
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

/* ===== 長老イベント&バトル ===== */
async function enter(){
 await dlg(['長老「おお、よく来たのう。わしは長老ざいがす。」','長老「大魔神に挑むなら、まず わしの試練を受けるのじゃ。」','長老「勉強の力で、わしを倒してみせよ!」'],'長老ざいがす');
 const res=await battle();
 await dlg([res=='win'?'長老「見事じゃ……!これが勉強の力か。」':res=='draw'?'長老「ふむ、互角じゃな。また来るがよい。」':'長老「まだまだじゃな。出直してまいれ。」'],'長老ざいがす');
 if(res=='win')S.cleared=true;save();px=4;py=3;dir='d';show('town');draw();}
const anim=(id,c,ms)=>{const e=$(id);e.classList.remove(c);void e.offsetWidth;e.classList.add(c);return sleep(ms).then(()=>e.classList.remove(c))};
function flo(id,txt){const e=$(id),f=document.createElement('div');f.className='f';f.textContent=txt;f.style.left=e.offsetLeft+e.offsetWidth/5+'px';f.style.top=e.offsetTop+'px';$('field').appendChild(f);setTimeout(()=>f.remove(),950)}
function choose(q){return new Promise(res=>{$('ch').innerHTML='';shuf([q.a,...q.w]).forEach(v=>{const b=document.createElement('button');b.textContent=v;
 b.onclick=()=>{[...$('ch').children].forEach(x=>{x.disabled=true;if(x.textContent===q.a)x.classList.add('ok')});if(v!==q.a)b.classList.add('ng');setTimeout(()=>res(v===q.a),500)};$('ch').appendChild(b)})})}
async function battle(){show('battle');let me=2000,en=2000;
 $('en').textContent='長老ざいがす';$('mn').textContent=`${S.name} ${t('lv')}.${lvl()}`;['esp','msp'].forEach(i=>$(i).classList.remove('ko'));
 const bar=(id,h,tid)=>{const e=$(id);e.style.width=Math.max(h,0)/20+'%';e.style.background=h>1000?'#3c6':h>400?'#ec3':'#e44';$(tid).textContent=Math.max(h,0)+' / 2000'};
 const upd=()=>{bar('eh',en,'et');bar('mh',me,'mt')};upd();
 const qs=shuf(BANK).slice(0,10);
 for(let i=0;i<10&&me>0&&en>0;i++){const q=qs[i];$('ex').innerHTML='';$('q').textContent=`第${i+1}問 / 10\n${q.q}`;
  const ok=await choose(q);let m;
  if(ok){await anim('msp','atkP',320);anim('esp','hit',500);flo('esp','-400');en-=400;upd();m='⭕ 正解!こうげき命中!ざいがすに 400 ダメージ!'}
  else{await anim('esp','atkE',320);anim('msp','hit',500);flo('msp','-400');$('field').classList.remove('red');void $('field').offsetWidth;$('field').classList.add('red');me-=400;upd();m='❌ 不正解… はんげきをうけた!じぶんに 400 ダメージ!'}
  if(en<=0)$('esp').classList.add('ko');if(me<=0)$('msp').classList.add('ko');
  await sleep(500);
  $('ex').innerHTML=`<div class="res ${ok?'g':'r'}">${m}</div><div class="exp">💡 ${t('expl')}<br>${ok?'':'答え: <b>'+q.a+'</b><br>'}${q.e}</div><button id="nx">${t('next')} ▶</button>`;
  await new Promise(r=>$('nx').onclick=r);}
 const r=me>en?'win':me<en?'lose':'draw',gain={win:1000,draw:300,lose:0}[r];
 await dlg([`${t(r)}  +${gain} ${t('coin')}`]);
 if(sb&&user){await sb.rpc('finish_battle',{result:r});const{data:p}=await sb.from('profiles').select('coin').eq('id',user.id).single();if(p)S.coin=p.coin}
 else S.coin+=gain;
 save();hud();return r;}
