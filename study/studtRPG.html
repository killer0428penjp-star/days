<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>勉強RPG</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<style>
:root{--bg:#f6f1e6;--card:#fffaf0;--bd:#b8975a;--tx:#3b2f1e}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;overflow:hidden}
.scr{position:fixed;inset:0;display:none;align-items:center;justify-content:center}.scr.on{display:flex}
button,input,select{font:inherit;padding:.5em .9em;border-radius:8px;border:2px solid var(--bd);background:#fff;color:var(--tx)}
button{cursor:pointer;box-shadow:0 2px 0 var(--bd)}button:hover{background:#f6e7c1}button:active{transform:translateY(2px);box-shadow:none}button:disabled{opacity:.45;cursor:default}
.card{background:var(--card);border:3px solid var(--bd);padding:5vmin;border-radius:14px;width:min(92vw,420px);display:flex;flex-direction:column;gap:2.2vmin;max-height:94vh;overflow:auto;box-shadow:0 6px 20px #0003}
.row{display:flex;gap:2vmin}.row>*{flex:1;min-width:0}
#auth{background:linear-gradient(#cfe9ff,#e9f5d6)}
#hud{position:fixed;top:1.5vmin;left:1.5vmin;z-index:20;display:none;text-align:left;font-size:max(14px,2.2vmin);line-height:1.5;box-shadow:0 3px 0 var(--bd),0 4px 10px #0003}
#tb{position:fixed;top:1.5vmin;right:1.5vmin;z-index:20;display:flex;gap:6px}#tb button{padding:.4em .7em}
.mb{display:none}
#back{display:none}#menu{position:fixed;top:calc(1.5vmin + 3.1em);right:1.5vmin;z-index:25;display:none;flex-direction:column;gap:6px;background:var(--card);border:3px solid var(--bd);border-radius:12px;padding:8px;box-shadow:0 4px 14px #0004}#menu button{text-align:left;white-space:nowrap}
#map{isolation:isolate}#lmap{width:100%;height:100%}
.pin{width:18px;height:18px;border-radius:50%;background:#e33;border:3px solid #fff;box-shadow:0 0 8px #000a;transform:translate(-9px,-9px);animation:pu 1.2s infinite}.pin.lk{background:#999;animation:none}
@keyframes pu{50%{transform:translate(-9px,-9px) scale(1.35)}}
.nolbl .pl{display:none}.pl{position:absolute;left:14px;top:-14px;white-space:nowrap;background:var(--card);border:2px solid var(--bd);border-radius:6px;padding:1px 7px;font-weight:bold;font-size:13px}
#town{flex-direction:column;background:#e8dfc9}
#cv{width:min(100vw,calc((100vh - 70px)*1.5));aspect-ratio:3/2;image-rendering:pixelated;touch-action:none;background:#6fbf5a}
#hint{position:fixed;top:calc(1.5vmin + 4.8em);left:50%;transform:translateX(-50%);background:#fffaf0;border:2px solid var(--bd);padding:.4em 1em;border-radius:20px;z-index:10;display:none;font-size:max(13px,2.2vmin)}
#dlg{position:fixed;left:2%;right:2%;bottom:2%;min-height:22%;background:#fffdf5f2;color:var(--tx);border:3px solid #8a6d3b;border-radius:12px;padding:2.5vmin 3vmin;z-index:70;display:none;cursor:pointer;font-family:var(--f);font-size:var(--s);box-shadow:0 4px 16px #0004}
#dnm{color:#b5651d;font-weight:bold;margin-bottom:.4em}
#gear{position:absolute;top:6px;right:8px;background:none;border:0;box-shadow:none;font-size:1.3em;padding:2px 6px}
#set{display:none;position:absolute;bottom:105%;right:0;background:var(--card);border:2px solid var(--bd);border-radius:8px;padding:12px;width:min(90vw,300px);font-size:14px;gap:8px;flex-direction:column;cursor:default;font-family:sans-serif}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#3b2f1ee6;color:#fff;padding:.5em 1.2em;border-radius:20px;z-index:90;display:none}
/* バトル */
#battle{flex-direction:column;align-items:stretch;justify-content:flex-start;background:var(--card)}
#field{position:relative;flex:0 0 44%;background:linear-gradient(#bfe3ff 0 55%,#9fd27a 55%);overflow:hidden}
#field.red{animation:fr .5s}@keyframes fr{0%{box-shadow:inset 0 0 0 100vmax #f005}100%{box-shadow:none}}
.sp{position:absolute;width:min(22vw,20vh);image-rendering:pixelated;transition:transform .15s,opacity .6s;filter:drop-shadow(0 4px 2px #0003)}
#esp{right:12%;top:12%}#msp{left:10%;bottom:4%}
.hb{position:absolute;background:#fffdf0;border:3px solid #5a4a2a;border-radius:10px;padding:6px 10px;width:min(46%,260px);font-size:max(12px,1.8vh);z-index:2}
#ehb{left:4%;top:6%}#mhb{right:4%;bottom:6%}
.bar{height:12px;background:#ccc;border-radius:6px;overflow:hidden;border:1px solid #444;margin-top:3px}
.bar i{display:block;height:100%;width:100%;background:#3c6;transition:width .5s,background .3s}
.f{position:absolute;font-weight:bold;font-size:min(9vw,6vh);color:#e33;text-shadow:0 0 4px #fff,0 0 4px #fff,0 0 4px #fff;animation:fl .95s forwards;pointer-events:none;z-index:5}
@keyframes fl{from{transform:translateY(0) scale(1.4);opacity:1}to{transform:translateY(-60px) scale(1);opacity:0}}
.hit{animation:hit .5s}
@keyframes hit{0%,100%{transform:translateX(0);filter:none}20%{transform:translateX(-14px);filter:brightness(2.2) saturate(0)}40%{transform:translateX(14px)}60%{transform:translateX(-10px);filter:brightness(2.2) saturate(0)}80%{transform:translateX(8px)}}
.atkP{transform:translate(18vw,-8vh)!important}.atkE{transform:translate(-18vw,8vh)!important}
.ko{opacity:.15;transform:rotate(80deg) translateY(30px)}
#panel{flex:1;overflow:auto;padding:1.5vmin;display:flex;flex-direction:column;align-items:center;gap:1.2vmin}
#items{display:flex;gap:2vmin;align-items:center}#bst{color:#c60;font-weight:bold;font-size:14px}
#q{font-size:max(18px,3.2vmin);text-align:center;white-space:pre-line;font-weight:bold}
#ch{display:grid;grid-template-columns:1fr 1fr;gap:1.4vmin;width:min(94vw,560px)}
#ch button{padding:.9em .4em;font-size:max(15px,2.7vmin)}
.ok{background:#bdebc8!important;border-color:#2a9a52!important}.ng{background:#f7c4c4!important;border-color:#c33!important}
#ex{width:min(94vw,560px);display:flex;flex-direction:column;gap:1vmin;align-items:center}
.res{font-size:max(17px,3vmin);font-weight:bold}.res.g{color:#1a8a42}.res.r{color:#c22}
.exp{background:#fff6d8;border:2px solid #e0c060;border-radius:10px;padding:1.2vmin 1.8vmin;width:100%;line-height:1.6;font-size:max(14px,2.3vmin)}
.rc{width:100%;border:4px solid #d4a017;border-radius:14px;background:linear-gradient(#fff8dc,#ffe9a8);text-align:center;padding:2vmin;display:flex;flex-direction:column;gap:1vmin;font-size:max(16px,2.8vmin)}
.rc.lose{border-color:#889;background:linear-gradient(#f2f2f2,#d8d8e0)}.rc h2{margin:0;font-size:max(26px,5vmin)}
.rc .lvup{color:#7a3fd0;font-weight:bold}
/* モーダル */
#modal{position:fixed;inset:0;background:#0006;z-index:60;display:none;align-items:center;justify-content:center}
.pf{width:min(94vw,460px);max-height:94vh;overflow:auto;background:var(--card);border:4px solid #8a6d3b;border-radius:16px;box-shadow:0 0 0 3px #e8d49a,0 8px 24px #0005}
.ph{display:flex;gap:12px;align-items:center;padding:14px;background:linear-gradient(135deg,#f3d27a,#e29a4a);border-bottom:4px solid #8a6d3b}
.ph h3{margin:0;color:#fff;text-shadow:0 1px 2px #6a3b0a}
.av{width:64px;height:64px;border-radius:50%;background:#bfe3ff;border:3px solid #8a6d3b;flex:none;overflow:hidden}.av canvas{width:100%;height:100%;image-rendering:pixelated}
.ph input{width:100%;padding:.3em .6em;font-weight:bold}.ttl{margin-top:4px;font-size:13px;color:#fff;text-shadow:0 1px 2px #6a3b0a;font-weight:bold}
.pb{padding:14px;display:flex;flex-direction:column;gap:10px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.c{border:3px solid;border-radius:10px;padding:8px;text-align:center}.c small{display:block;font-size:11px;font-weight:bold}.c b{font-size:22px}
.lv{background:#eee3ff;border-color:#8b5cf6;color:#5b34b8}.co{background:#fff3c4;border-color:#d4a017;color:#8a6200}.dy{background:#dff5df;border-color:#3a9a3a;color:#1f6a1f}
.tags{display:flex;gap:8px;flex-wrap:wrap}.tg{padding:3px 12px;border-radius:20px;font-size:13px;font-weight:bold;border:2px solid}.tg.b{background:#dcecff;border-color:#4a90d9;color:#1f5fa8}.tg.p{background:#ffe0ec;border-color:#e0709a;color:#a8305f}
.slot{border:2px dashed #b9a572;border-radius:8px;padding:10px;color:#9a8a60;font-size:13px;text-align:center}
.pf>.row{padding:0 14px 14px}
.li{display:flex;align-items:center;gap:8px;padding:8px;border:2px solid #e0c98a;border-radius:10px;background:#fffdf3;cursor:pointer}
.li b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}.li small{color:#8a7a50}
.tabs{display:flex;gap:6px}.tabs button.on{background:#f3d27a}
details{border:2px solid #e0c98a;border-radius:8px;padding:6px 10px;background:#fffdf3;font-size:14px}details summary{cursor:pointer}
.sm{font-size:12px;color:#8a7a50}
#fig{display:flex;justify-content:center;width:min(94vw,560px)}#fig:empty{display:none}#avg button.on{background:#f3d27a;border-color:#d4a017}#sr:disabled{opacity:.4}
#nav{position:fixed;left:0;right:0;bottom:0;height:calc(62px + env(safe-area-inset-bottom));z-index:30;display:none;background:var(--card);border-top:3px solid var(--bd);padding:4px 4px calc(4px + env(safe-area-inset-bottom));gap:4px;align-items:stretch}
#nav button{flex:1;min-width:0;padding:2px;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;box-shadow:none;white-space:nowrap}
#nav button span{font-size:22px}#nav button.c{background:#f3d27a;border-color:#d4a017}
#sub{position:fixed;right:6px;bottom:calc(70px + env(safe-area-inset-bottom));z-index:31;display:none;flex-direction:column;gap:6px;background:var(--card);border:3px solid var(--bd);border-radius:12px;padding:8px;box-shadow:0 4px 14px #0004}
#map,#town,#study{bottom:calc(62px + env(safe-area-inset-bottom))}#study{background:#fff}#stf{width:100%;height:100%;border:0;display:block}
/* オンライン対戦・問題作成 */
#ol{flex-direction:column;justify-content:flex-start;align-items:stretch;background:var(--bg)}
#oh{display:flex;align-items:center;gap:10px;padding:calc(6px + env(safe-area-inset-top)) 10px 6px;border-bottom:3px solid var(--bd);background:var(--card);flex:none}
#ob{flex:1;overflow:auto;padding:8px;display:flex;flex-direction:column;gap:6px;width:min(100%,560px);align-self:center}
#of{flex:none;display:none;padding:6px 10px calc(6px + env(safe-area-inset-bottom));background:var(--card);border-top:3px solid var(--bd);text-align:center;font-weight:bold;font-size:13px}
#ob>*{flex:none}#ol button{padding:.35em .7em;font-size:13px;border-width:2px;border-radius:9px}#ol input,#ol select{padding:.3em .5em;font-size:14px}
#ol .big{padding:.7em;font-size:15px;font-weight:bold}.go{background:#f3d27a;border-color:#d4a017}
.seg{display:flex;gap:4px;flex-wrap:wrap}.seg button{flex:1;min-width:0}.seg button.on{background:#f3d27a;border-color:#d4a017}
.oc{background:var(--card);border:2px solid var(--bd);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px}
.orow{display:flex;gap:6px;align-items:center}.orow>*{min-width:0}.orow>input:not([type=radio]),.orow>select{flex:1}.orow>button{flex:1}
.og{display:grid;grid-template-columns:1fr 1fr;gap:6px}.og label{display:flex;flex-direction:column;font-size:11px;gap:2px}
#ol details{border:2px solid var(--bd);border-radius:9px;padding:4px 8px;background:var(--card);display:flex;flex-direction:column;gap:6px}
#ol details>summary{cursor:pointer;font-weight:bold;font-size:13px;padding:2px 0}#ol details[open]>summary{margin-bottom:4px}#ol details details{background:transparent;border-color:#e0c98a}
textarea{font:inherit;font-size:14px;padding:.4em;border:2px solid var(--bd);border-radius:8px;min-height:2.6em;width:100%;background:#fff;color:var(--tx)}
.oq{font-size:max(18px,3vmin);font-weight:bold;white-space:pre-line;text-align:center}
.oim{max-width:100%;max-height:220px;border-radius:8px;border:2px solid #e0c98a;align-self:center}
.ofg{display:flex;justify-content:center}.otm{text-align:center;font-weight:bold;color:#c60}
#och{display:grid;grid-template-columns:1fr 1fr;gap:8px}#och input{grid-column:1/-1}#ol #och button{padding:.7em;font-size:15px}.ohb{font-size:14px}.fl{flex:1;font-size:12px}
/* 報酬ロード */
#rd{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;background:linear-gradient(#4aa6e8 0,#4aa6e8 18%,#6cc84a 18%,#5ab23c 100%)}
#rdt{display:flex;align-items:center;gap:10px;padding:calc(6px + env(safe-area-inset-top)) 10px 8px;background:#14202c;color:#fff;box-shadow:0 3px 0 #0006}
#rdb{background:#fff;border:0;border-radius:10px;font-size:20px;padding:.2em .7em}.rtl{flex:1;display:flex;flex-direction:column;line-height:1.2}.rtl b{font-size:18px;color:#fff;text-shadow:0 2px 0 #000}.rtl small{color:#ffc830;font-weight:bold}
#rdl{min-width:96px;font-size:13px;text-align:right}#rdl b{font-size:16px;color:#ffd23a}
#rds{flex:1;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}#rdk{display:flex;align-items:center;height:100%;padding:0 40px;width:max-content;background:linear-gradient(transparent 56%,#f4a6a0 56%,#f4a6a0 80%,transparent 80%)}
.rn{width:110px;flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.rb{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:76px;justify-content:flex-end;font-weight:bold;font-size:13px;color:#fff;text-shadow:0 2px 0 #0007}.rb span{background:#0006;border-radius:10px;padding:0 7px}.rb .big{font-size:42px;filter:drop-shadow(0 0 8px #ffe060)}.rb.sk{min-height:96px}
.rb canvas{width:64px;height:64px;image-rendering:pixelated;background:#bfe3ff;border-radius:50%;border:4px solid #1b8a7a}
.rp{position:relative;width:100%;height:46px;display:flex;align-items:center}.rp i{flex:1;height:10px;display:block}.rp .pad{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:#ffd23a;border:3px solid #f0a020;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:bold;color:#2a9d3a}
.rn.lock .pad{background:#d9c27a;filter:grayscale(.5);color:#555;font-size:18px}.rn.can .pad{animation:rbn 1s infinite;box-shadow:0 0 14px 4px #fff8}.rn.can .rb{filter:drop-shadow(0 0 8px #fff)}
.rn.done .rb{opacity:.85}.rlv{font-weight:bold;color:#f0a020;text-shadow:0 2px 0 #7a4a00;font-size:15px}@keyframes rbn{50%{transform:translate(-50%,-62%)}}
#rda{display:none;position:absolute;right:10px;bottom:70px;z-index:2;background:#fff;border:3px solid #f0a020;border-radius:14px;padding:.6em 1em;font-weight:bold}
#rdn{display:flex;gap:6px;overflow-x:auto;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#1a3a4a}.bd{flex:none;width:40px;height:40px;border-radius:50%;background:#2a4a8a;border:3px solid #1d3466;color:#fff;font-weight:bold;display:flex;align-items:center;justify-content:center;opacity:.7}.bd.on{background:#2fa66a;border-color:#146b3f;opacity:1}.bd.cur{background:#ffd23a;border-color:#f0a020;color:#5a3a00;opacity:1}
/* ===== ガチャ画面 ===== */
.gx{position:fixed;inset:0;z-index:65;color:#fff;overflow:hidden;display:flex;flex-direction:column;background:#120a2a;user-select:none;-webkit-user-select:none}
.gx-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,#5b2fa8 0,#2a1560 45%,#0f0826 100%)}
.gx-star{position:absolute;inset:0;background-image:radial-gradient(2px 2px at 20px 30px,#fff9,transparent),radial-gradient(1.5px 1.5px at 90px 80px,#fff8,transparent),radial-gradient(2px 2px at 160px 20px,#ffe9a8,transparent),radial-gradient(1.5px 1.5px at 60px 140px,#fff7,transparent);background-size:200px 180px;animation:gxtw 3s ease-in-out infinite alternate;opacity:.8}
@keyframes gxtw{from{opacity:.35}to{opacity:.95}}
.gx-top{position:relative;z-index:2;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 8px}
.gx .gx-x{width:40px;height:40px;padding:0;border-radius:50%;background:#0008;color:#fff;border:2px solid #fff6;box-shadow:none;font-size:18px}
.gx .gx-x:hover{background:#000b}
.gx-ti{flex:1;font-weight:bold;font-size:18px;text-align:center;text-shadow:0 2px 6px #000}
.gx-jw{background:#0008;border:2px solid #9fd8ff;border-radius:20px;padding:4px 12px;font-size:15px;white-space:nowrap}
.gx-main{position:relative;z-index:2;flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:12px;padding:6px 14px calc(18px + env(safe-area-inset-bottom))}
.gx-ban{position:relative;width:min(100%,360px);flex:none;height:230px;border-radius:18px;border:3px solid #ffd96a;background:linear-gradient(160deg,#7a3fd0,#3a1b82);overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 0 24px #ffc83a88}
.gx-rays{position:absolute;left:50%;top:50%;width:560px;height:560px;margin:-280px 0 0 -280px;background:repeating-conic-gradient(from 0deg,#ffffff30 0 8deg,transparent 8deg 20deg);animation:gxspin 14s linear infinite;border-radius:50%;pointer-events:none;-webkit-mask-image:radial-gradient(circle,#000 0,transparent 70%);mask-image:radial-gradient(circle,#000 0,transparent 70%)}
.gx-rays.big{width:900px;height:900px;margin:-450px 0 0 -450px;animation-duration:8s}
@keyframes gxspin{to{transform:rotate(360deg)}}
.gx-hero{position:relative;filter:drop-shadow(0 6px 10px #0009);animation:gxfl 2.4s ease-in-out infinite alternate}
@keyframes gxfl{from{transform:translateY(-4px)}to{transform:translateY(6px)}}
.gx-tag{position:absolute;left:10px;top:10px;background:linear-gradient(90deg,#ffc83a,#ff8a3a);color:#4a2400;font-weight:bold;font-size:12px;padding:3px 10px;border-radius:12px;letter-spacing:.08em}
.gx-nm{position:absolute;left:0;right:0;bottom:0;padding:18px 10px 8px;text-align:center;font-weight:bold;font-size:17px;background:linear-gradient(transparent,#000b);text-shadow:0 2px 4px #000}
.gx-nm small{display:block;color:#ffd96a;letter-spacing:.2em;font-size:13px}
.gx-info{font-size:13px;color:#e6dcff;text-align:center}
.gx-pity{width:min(100%,360px)}
.gx-pb{height:12px;background:#0007;border:2px solid #fff5;border-radius:8px;overflow:hidden;padding:0}
.gx-pb i{display:block;height:100%;background:linear-gradient(90deg,#ffc83a,#ff7a3a);transition:width .4s}
.gx-pity span{display:block;text-align:center;font-size:13px;margin-top:3px}
.gx-btns{display:flex;gap:12px;width:min(100%,360px)}
.gx-btns button{flex:1;padding:12px 6px;border-radius:14px;font-weight:bold;line-height:1.35;font-size:15px;color:#fff;border:3px solid #fff8;box-shadow:0 4px 0 #0006}
.gx-btns .gx-b1,.gx-btns .gx-b1:hover{background:linear-gradient(#4aa8ff,#2a6fd0)}
.gx-btns .gx-b10,.gx-btns .gx-b10:hover{background:linear-gradient(#ffb23a,#e0601f)}
.gx-btns button:hover{filter:brightness(1.12)}
.gx-btns button b{font-size:17px}.gx-btns small{display:block;font-size:11px;font-weight:normal}
.gx-sub{display:flex;gap:10px;width:min(100%,360px)}
.gx-sub button,.gx-sub button:hover{flex:1;background:#0007;color:#fff;border-color:#fff5;box-shadow:none;font-size:14px}
.gx-pop{position:absolute;inset:0;z-index:5;background:#000a;display:flex;align-items:center;justify-content:center;padding:14px}
.gx-pb2{width:min(100%,420px);max-height:86%;overflow:auto;background:#1c1240;border:3px solid #ffd96a;border-radius:16px;padding:14px;color:#fff}
.gx-pb2 .sm{font-size:12.5px;line-height:1.6}
.gx .gx-cl,.gx .gx-cl:hover{width:100%;margin-top:12px;background:#ffd96a;color:#3a2400;border-color:#b8860b;font-weight:bold}
.gx-pr{display:flex;justify-content:space-between;background:#0006;border-radius:8px;padding:6px 12px;margin:4px 0;font-size:16px}
.gx-lg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

<script>

const hm=s=>{s=Math.round(s);if(s<60)return'1分未満';const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h}時間${m}分`:`${m}分`};

function addLog(dt){const t=Date.now(),g=S[S.length-1];if(g&&g.u==cfg.sub&&t-g.e<3000)g.e=t;else S.push({s:t-dt*1000,e:t,u:cfg.sub});if(P)P.tick(dt)}

 $('tm').textContent=clk(m==1?Math.floor(v):Math.ceil(v));

 if(run!==lr){lr=run;if(P&&P.state)P.state(run)}}
function resetT(){run=false;active=false;brk=false;el=0;rem=full();sv(1);render()}

async function setMode(m){if(m==cfg.mode)return;if(active&&!await ask('モードを切り替えますか?','タイマーが動いている途中、または一時停止中です。<br>切り替えると<b>タイマーはリセット</b>されます。','リセットして切り替える'))return;cfg.mode=m;sc();resetT()}

setInterval(()=>{if(!run)return;const t=Date.now(),dt=Math.min((t-last)/1000,5);last=t;step(dt);if(++n%8==0)sv();render()},250);

/* 初期化(アナログ文字盤・入力欄) */
(()=>{let f='<circle cx="100" cy="100" r="96" fill="#fff" stroke="#8a6d3b" stroke-width="4"/>';

 const cl=(e,k,lo,hi,fn)=>$(e).onchange=ev=>{cfg[k]=Math.max(lo,Math.min(hi,+ev.target.value||lo));ev.target.value=cfg[k];sc();if(!active)rem=full();render()};
 cl('cw','w',1,180);cl('cb','b',1,60);cl('lim','lim',1,600);$('rep').onchange=e=>{cfg.rep=e.target.checked;sc()}})();
/* ===== 確認ダイアログ(デザイン付き) ===== */
function ask(t,m,ok='OK',cancel='キャンセル'){return new Promise(r=>{$('dh').textContent=t;$('dm').innerHTML=m;
 $('db').innerHTML=`<button id="dc">${cancel}</button><button id="dk" style="background:#f3d27a;border-color:#d4a017">${ok}</button>`;$('dlg').style.display='flex';

/* ===== モーダル ===== */
function modal(t,h){$('mh').textContent=t;$('mb').innerHTML=h;$('modal').style.display='flex'}
/* ===== 記録 ===== */
let hT='d',hD=dk(new Date()),wO=0;
const openHist=()=>histR();
function histR(){modal('📊 勉強の記録',`<div class="tabs"><button class="${hT=='d'?'on':''}" onclick="hT='d';histR()">日別</button><button class="${hT=='w'?'on':''}" onclick="hT='w';histR()">週間</button></div>`+(hT=='d'?dayHTML():weekHTML()))}
function pie(k,a){const C=150,R=110,pt=(d,r)=>[C+r*Math.sin(d*Math.PI/180),C-r*Math.cos(d*Math.PI/180)],d0=D0(k);
 let h=`<svg viewBox="0 0 300 300" style="width:100%;max-width:340px;align-self:center;background:#fff;border:2px solid #e0c98a;border-radius:12px"><circle cx="150" cy="150" r="${R}" fill="#f4f1ea" stroke="#b8975a"/>`;
 a.forEach((g,i)=>{const s=(g.s-d0)/864e5*360,e=Math.max((g.e-d0)/864e5*360,s+1.2),[x1,y1]=pt(s,R),[x2,y2]=pt(e,R);
  h+=`<path d="M150 150L${x1} ${y1}A${R} ${R} 0 ${e-s>180?1:0} 1 ${x2} ${y2}Z" fill="${COL[SUBJ.indexOf(g.u)]}" style="cursor:pointer" onclick="seg(${i})"/>`});

function dayHTML(){const ks=[...new Set([dk(new Date()),...S.flatMap(g=>[dk(new Date(g.s)),dk(new Date(g.e))])])].sort().reverse(),wd='日月火水木金土';
 if(!ks.includes(hD))hD=ks[0];

 return `<select onchange="hD=this.value;histR()">${ks.map(k=>{const d=new Date(k+'T00:00');return`<option value="${k}" ${k==hD?'selected':''}>${d.getMonth()+1}/${d.getDate()}(${wd[d.getDay()]}) ${hm(dayTot(k))}</option>`}).join('')}</select>`
 +pie(hD,a)+`<div id="sg" class="exp">円グラフ(上が0時・時計まわり24時間)の色をタップすると、何時から何時までかわかります</div>`

async function delSeg(i){const g=dayArr(hD)[i];if(!await ask('記録を削除',`${tm(g.s)}〜${tm(g.e)} ${g.u}<br>この記録を削除しますか?(元に戻せません)`,'削除'))return;S.splice(g.i,1);sv(1);render();histR()}

function weekHTML(){const e=new Date();e.setHours(0,0,0,0);e.setDate(e.getDate()+wO*7);
 const ds=[...Array(7)].map((_,i)=>{const d=new Date(e);d.setDate(e.getDate()-6+i);return d}),vs=ds.map(d=>dayTot(dk(d))),av=sum(vs)/7,mx=Math.max(...vs,3600),wd='日月火水木金土';

const SUBJ=['数学','国語','英語','理科','社会'],SKEY={'数学':'math','国語':'japanese','英語':'english','理科':'science','社会':'social'},POOL={};
const SUBJC={'数学':'#3a7ad9','国語':'#d95a5a','英語':'#2a9a6a','理科':'#8a5ad9','社会':'#d99a2a'};
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const STAR={1:{lab:'小学生の範囲',xp:1000,coin:1000},2:{lab:'中1基礎',xp:1000,coin:1000},3:{lab:'中1応用',xp:1500,coin:1500},4:{lab:'中2基礎',xp:3000,coin:2000},5:{lab:'中2応用',xp:5000,coin:5000},6:{lab:'中3基礎',xp:7000,coin:5000},7:{lab:'中3応用',xp:10000,coin:10000}};

const qhash=s=>{let h=5381;for(const c of s)h=((h<<5)+h+c.codePointAt(0))>>>0;return h.toString(36)};
/* 1問 = ["問題文","選択肢A","選択肢B","選択肢C","選択肢D","正解(A〜D か 1〜4)","解説", 図(省略可)]
   旧形式 ["問題文","正解",["誤1","誤2","誤3"],"解説", 図] も読めます */
function normRow(r,star,s,n){const bad=m=>({err:`${n}番目: ${m}`});
 if(!Array.isArray(r))return bad('[ ] の配列になっていません');
 let q=r[0],a,w,e,fig;
 if(Array.isArray(r[2])){a=String(r[1]),w=[...new Set(r[2].map(String))].filter(x=>x!==a);e=r[3];fig=r[4];if(w.length<3)return bad('誤答が3つ未満です')}
 else{const ch=[r[1],r[2],r[3],r[4]].map(x=>x==null?'':String(x).trim());if(ch.some(x=>!x))return bad('選択肢が4つそろっていません(「問題,A,B,C,D,正解,解説」の順)');if(new Set(ch).size<4)return bad('同じ選択肢があります');
  const k=String(r[5]==null?'':r[5]).trim(),idx=k.length==1?('ABCD'.indexOf(k.toUpperCase())>=0?'ABCD'.indexOf(k.toUpperCase()):'1234'.indexOf(k)):-1;
  if(idx<0)return bad(`正解は "A"〜"D" か 1〜4 で書いてください(今: ${String(r[5]).slice(0,10)})`);a=ch[idx];w=ch.filter((_,j)=>j!=idx);e=r[6];fig=r[7]}
 if(typeof q!='string'||!q.trim())return bad('問題文が空です');
 const it={u:r.u||'',id:`${star}-${SKEY[s]}-${qhash(q+'\u0001'+[a,...w].sort().join('\u0001'))}`,q,a,w,e:e?String(e):'この問題の解説は まだありません。',f:'',img:''};
 if(fig){fig=String(fig);if(/^<svg/i.test(fig))it.f=fig;else if(/\.(png|jpe?g|gif|webp|svg)$/i.test(fig)||/^https?:/.test(fig))it.img=fig}
 return{item:it}}
function readBlock(star,s){const blk=window.QB&&window.QB[star+'|'+s],items=[],errs=[],seen=new Set();
 if(!blk)return{items,errs:['ブロックが見つからないか、ブロックの中にエラー(カッコ・カンマ・引用符)があります'],missing:true};
 blk.forEach((r,i)=>{const o=normRow(r,star,s,i+1);if(o.err)return errs.push(o.err);if(seen.has(o.item.id))return errs.push(`${i+1}番目: 同じ問題が重複しています`);seen.add(o.item.id);items.push(o.item)});
 return{items,errs,missing:false}}
async function loadPool(star,s){const k=star+'|'+s;if(POOL[k])return POOL[k];
 const b=readBlock(star,s);let all=b.items.slice();const from=[];
 for(let d=1;d<7&&all.length<10;d++)for(const st of[star-d,star+d]){if(st<1||st>7||all.length>=10)continue;const o=readBlock(st,s);if(o.items.length){from.push(st);all=all.concat(o.items.filter(x=>!all.some(y=>y.id==x.id)))}}
 return POOL[k]={items:b.items,all,borrowed:all.length-b.items.length,from,errs:b.errs,n:b.items.length}}
function san(svg){const d=document.createElement('div');d.innerHTML=svg;d.querySelectorAll('script,foreignObject,iframe,object,embed').forEach(e=>e.remove());d.querySelectorAll('*').forEach(el=>[...el.attributes].forEach(a=>{if(/^on/i.test(a.name)||/javascript:/i.test(a.value))el.removeAttribute(a.name)}));return d.innerHTML}
function figHTML(q){let h='';if(q.f)h+=san(q.f);if(q.img)h+=`<img src="${esc(q.img)}" alt="図" style="max-width:100%;max-height:220px;border-radius:8px;border:2px solid #e0c98a;background:#fff">`;return h?`<div style="display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:4px 0">${h}</div>`:''}

function connect(){O.msg={};O.w=[];O.peer=null;O.opSur=O.mySur=false;const c=sb.channel('ob-'+O.room,{config:{broadcast:{self:false},presence:{key:user.id}}});O.ch=c;
 c.on('broadcast',{event:'m'},({payload:p})=>onMsg(p)).on('presence',{event:'sync'},()=>{const st=c.presenceState(),ks=Object.keys(st).filter(k=>k!=user.id),was=O.peer;O.peer=ks.length?{name:(st[ks[0]][0]||{}).name||'相手'}:null;ft();if(O.v=='room'){const b=document.querySelector('[data-a=start]');if(b)b.disabled=!O.peer}
  if(was&&!O.peer&&O.v=='play')setTimeout(()=>{if(!O.peer&&O.v=='play'){O.opSur=true;flush();O.cancel&&O.cancel()}},6000)}).subscribe(s=>{if(s=='SUBSCRIBED')c.track({name:S.name||'名無し'})})}
const send=(k,v)=>O.ch&&O.ch.send({type:'broadcast',event:'m',payload:{k,v}}),flush=()=>{const w=O.w;O.w=[];w.forEach(f=>f())};
const got=k=>new Promise(r=>{const c=()=>{if(O.mySur||O.opSur)r(null);else if(k in O.msg)r(O.msg[k]);else O.w.push(c)};c()});
function onMsg(p){if(p.k=='start'){O.s=p.v.s;return runOnline(p.v.qs)}if(p.k=='sur'){O.opSur=true;flush();O.cancel&&O.cancel();return}

async function buildQs(s){let all=[];
 if(s.setId){const{data,error}=await sb.from('qsets').select('items').eq('id',s.setId).single();if(error){toast(error.message);return[]}all=data.items}
 else{const seen=new Set();for(const st of s.stars)for(const sj of s.subs){const p=await loadPool(st,sj);p.items.forEach(x=>{if(!seen.has(x.id)){seen.add(x.id);all.push(x)}})}
  all=all.map(x=>{const c=shuf([x.a,...shuf(x.w).slice(0,3)]);return{t:'c4',q:x.q,c,k:c.indexOf(x.a),e:x.e,f:x.f,img:x.img}})}

function ask(box,it,time){return new Promise(res=>{let done=false,tm;const fin=v=>{if(done)return;done=true;clearInterval(tm);O.cancel=null;res(v)};O.cancel=()=>fin(null);
 box.innerHTML=`<div class="oq">${eh(it.q)}</div>${media(it)}<div class="otm" id="otm"></div><div id="och"></div>`;const c=$('och');
 if(it.t=='w'){c.innerHTML='<input id="owi" placeholder="答えを入力"><button id="owb">こたえる</button>';const go=()=>{if($('owi').value.trim())fin(chk($('owi').value,it))};$('owb').onclick=go;$('owi').onkeydown=e=>{if(e.key=='Enter')go()}}
 else it.c.forEach((x,i)=>{const b=document.createElement('button');b.textContent=x;b.onclick=()=>{[...c.children].forEach((y,j)=>{y.disabled=true;if(j==it.k)y.classList.add('ok')});if(i!=it.k)b.classList.add('ng');setTimeout(()=>fin(i==it.k),it.fast?0:450)};c.appendChild(b)});
 if(time>0){let r=time;const u=()=>{const e=$('otm');if(e)e.textContent='⏱ '+r+'秒'};u();tm=setInterval(()=>{r--;u();if(r<=0)fin(false)},1000)}})}
const wait=b=>new Promise(r=>{b.onclick=r});
/* ---- 対戦本編(人・bot共通) ---- */
async function battle(T){const{s,qs}=T,hp={...T.mx};O.mySur=false;if(!O.room)O.opSur=false;O.v='play';render();
 $B().innerHTML='<div id="phd"></div><div id="opq" class="oc"></div><button data-a="sur" style="background:#f5d0d0">🏳 降参</button>';
 const hd=i=>$('phd').innerHTML=`<div class="sm">第${i+1}問 / ${qs.length} ${T.fast?'⚡早押し':'📝同時回答'}</div>`+bar(T.nm.m+'(あなた)',hp.m,T.mx.m)+bar(T.nm.o,hp.o,T.mx.o);
 const dmg=(side,it)=>Math.max(1,Math.round((it.dmg||400)*T.dm[side]/400));
 for(let i=0;i<qs.length;i++){hd(i);const it={...qs[i],fast:T.fast},box=$('opq'),r=await T.round(i,it,box,it.time>0?it.time:s.time);if(!r||O.mySur||O.opSur)break;
  let msg,g;if(T.fast){if(r.w=='m'){hp.o-=dmg('m',it);msg='⚡ あなたが先に正解!';g=1}else if(r.w=='o'){hp.m-=dmg('o',it);msg='⚡ 相手が先に正解…'}else msg='どちらも不正解'}
  else{if(r.m)hp.o-=dmg('m',it);if(r.o)hp.m-=dmg('o',it);msg=`あなた: ${r.m?'⭕':'❌'} / 相手: ${r.o?'⭕':'❌'}`;g=r.m}
  hd(i);g?SE.ok():SE.ng();if(g||r.o||r.w=='o')SE.hit();box.innerHTML=`<div class="res ${g?'g':'r'}">${msg}</div>${exp(it)}<button id="onx">次へ ▶</button>`;
  const nb=$('onx');await wait(nb);if(O.mySur||O.opSur)break;if(T.next){nb.disabled=true;nb.textContent='相手を待っています…';if(!await T.next(i))break}if(hp.m<=0||hp.o<=0)break}
 const res=O.mySur?'lose':O.opSur?'win':(hp.m<=0&&hp.o<=0)||hp.m==hp.o?'draw':hp.m>hp.o?'win':'lose';O.cancel=null;O.v='result';res=='win'?SE.win():res=='lose'?SE.lose():SE.item();
 $B().innerHTML=`<div class="rc ${res=='lose'?'lose':''}"><h2>${res=='win'?'🏆 勝ち!':res=='lose'?'💧 負け…':'🤝 引き分け'}</h2>${O.mySur?'(降参)':O.opSur?'(相手が降参または退出)':''}<div>${esc(T.nm.m)}: ${Math.max(hp.m,0)} / ${esc(T.nm.o)}: ${Math.max(hp.o,0)}</div><div class="sm">履歴・図鑑・コイン・EXPには反映されません</div></div><button class="big go" data-a="again">🔁 もう一度</button><button class="big" data-a="toset">対戦前設定に戻る(終わる)</button>`;ft()}
function runOnline(qs){const s=O.s,h=O.role=='h',fast=s.mode!='n';O.msg={};O.opSur=O.mySur=false;
 const T={s,qs,fast,mx:h?{m:s.hh,o:s.gh}:{m:s.gh,o:s.hh},dm:h?{m:s.hd,o:s.gd}:{m:s.gd,o:s.hd},nm:{m:S.name||'あなた',o:(O.peer&&O.peer.name)||(h?'相手':O.hn)},
  next:async i=>{send('n'+i,1);return await got('n'+i)!==null}};
 T.round=fast?(i,it,box,tm)=>{
   if(h){const R={d:0,hl:0,gl:0},end=w=>{if(R.d)return;R.d=1;O.onP=null;const v={w};O.msg['r'+i]=v;send('r'+i,v);flush();O.cancel&&O.cancel()};
    O.onP=(k,ok)=>{if(R.d||k!='p'+i)return;if(ok)end('g');else{R.gl=1;if(R.hl)end(null)}};
    ask(box,it,tm).then(v=>{if(R.d||v===null)return;if(v)end('h');else{R.hl=1;lock(box);if(R.gl)end(null)}})}
   else ask(box,it,tm).then(v=>{if(v===null)return;send('p'+i,v?1:0);if(!v)lock(box)});
   return got('r'+i).then(v=>v&&{w:v.w==null?null:(v.w=='h')==h?'m':'o'})}
  :async(i,it,box,tm)=>{const r=await ask(box,it,tm);if(r===null)return null;send('a'+i,r?1:0);box.insertAdjacentHTML('beforeend','<div class="sm">相手の回答を待っています…</div>');const o=await got('a'+i);return o===null?null:{m:r,o:!!o}};
 battle(T)}
function runBot(qs){const s=O.s,b=O.bot,fast=s.mode!='n';O.qs0=qs;
 const T={s,qs,fast,mx:{m:s.hh,o:s.gh},dm:{m:s.hd,o:s.gd},nm:{m:S.name||'あなた',o:'🤖 bot Lv'+O.botLv}};
 T.round=(i,it,box,tm)=>{const w=it.t=='w',acc=b.a*(w?.85:1),ok=Math.random()<acc;
  if(!fast)return ask(box,it,tm).then(r=>r===null?null:{m:r,o:ok});
  return new Promise(res=>{let ml=0,bl=0,fin=0;const end=x=>{if(fin)return;fin=1;clearTimeout(bt);O.botEnd=null;O.cancel&&O.cancel();res(x)};
   const bt=setTimeout(()=>{if(ok)end({w:'o'});else{bl=1;if(ml)end({w:null})}},b.t*(w?1.5:1)*(.6+Math.random()*.8)*1000);O.botEnd=()=>end(null);
   ask(box,it,tm).then(v=>{if(fin||v===null)return;if(v)end({w:'m'});else{ml=1;lock(box);if(bl)end({w:null})}})})};
 battle(T)}

 return `<details class="qd" data-d="q${i}" ${O.dt['q'+i]?'open':''}><summary>第${i+1}問 ・ ${tl} ・ ${esc((x.q||'(未入力)').slice(0,14))}</summary><div class="orow"><select data-p="${P}t" data-r="1">${[['c4','4択'],['c2','2択'],['w','筆記']].map(([v,l])=>`<option value="${v}" ${x.t==v?'selected':''}>${l}</option>`).join('')}</select><button data-a="qdel" data-v="${i}">🗑 削除</button></div><textarea data-p="${P}q" placeholder="問題文">${esc(x.q)}</textarea>`+
 (x.t=='w'?`<input data-p="${P}ans" placeholder="正解(複数の正解は / で区切る)" value="${esc(x.ans)}">`:x.c.map((c,j)=>`<div class="orow"><input type="radio" name="k${i}" style="flex:none" data-p="${P}k" data-n="1" value="${j}" ${x.k==j?'checked':''}><input data-p="${P}c.${j}" placeholder="選択肢${'ABCD'[j]}(○=正解)" value="${esc(c)}"></div>`).join('')+`<input data-p="${P}ans" placeholder="答えの文章(任意)" value="${esc(x.ans)}">`)+
 dtl(`q${i}s`,'⚙ ダメージ・制限時間',`<div class="og"><label>ダメージ<input type="number" data-p="${P}dmg" data-n="1" value="${x.dmg}"></label><label>秒(0=なし)<input type="number" data-p="${P}time" data-n="1" value="${x.time}"></label></div>`)+dtl(`q${i}m`,'🖼🔊 画像・音声',fl('img','🖼 画像')+fl('aud','🔊 音声'))+dtl(`q${i}e`,'💡 解説',`<textarea data-p="${P}e" placeholder="解説">${esc(x.e)}</textarea>${fl('eimg','🖼 解説の画像')}`)+`</details>`}
function chkSet(){const m=O.m;if(!m.title.trim())return'タイトルを入れてください';if(!m.qs.length)return'問題がありません';
 for(let i=0;i<m.qs.length;i++){const x=m.qs[i],n=`第${i+1}問: `;if(!x.q.trim())return n+'問題文が空です';if(x.t=='w'){if(!x.ans.trim())return n+'正解を入れてください'}else{const c=x.c.map(s=>s.trim());if(c.some(s=>!s))return n+'選択肢が空です';if(new Set(c).size<c.length)return n+'同じ選択肢があります'}}return''}
const clean=()=>O.m.qs.map(x=>({...x,c:x.t=='w'?[]:x.c.map(s=>s.trim()),dmg:Math.max(1,x.dmg|0),time:Math.max(0,x.time|0)}));
function shrink(f,max){return new Promise((res,rej)=>{const im=new Image,u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.7))};im.onerror=rej;im.src=u})}
async function onFile(inp){const f=inp.files[0];if(!f)return;const p=inp.dataset.file;try{let d;if(p.endsWith('aud')){if(f.size>400*1024)return toast('音声は400KBまでです');d=await new Promise((r,j)=>{const x=new FileReader;x.onload=()=>r(x.result);x.onerror=j;x.readAsDataURL(f)})}else d=await shrink(f,640);setP(O,p,d);render()}catch(e){toast('読み込めませんでした')}}
async function pub(){const e=chkSet();if(e)return toast(e);const m=O.m;const{error}=await sb.from('qsets').insert({author_name:S.name||'名無し',title:m.title.trim(),subject:m.subject,vis:m.vis,items:clean()});if(error)return toast(error.message);toast('投稿しました!');O.m={title:'',subject:'数学',vis:'public',qs:[mkq()]};O.dt={q0:1};O.mt='view';O.f.src='mine';render()}
/* ---- 観覧 ---- */
const pick=()=>`<div class="sm"><b>対戦に使う問題セットを選ぶ</b></div><div id="vw"></div><button data-a="nav" data-v="create">← 戻る</button>`;
async function loadSets(){const f=O.f,pk=O.v=='pick';
 const draw=()=>{const e=$('vw');if(!e)return;e.innerHTML=seg('bsrc',[['all','全て'],['friend','フレンド'],['public','公開'],['mine','自分']],f.src)+seg('bsort',[['new','新規順'],['pop','人気順']],f.sort)+`<div class="orow"><input id="bq" placeholder="タイトル・作者で検索" value="${esc(f.q)}"><button data-a="bs">🔍</button></div><div id="sl"></div>`;
  $('sl').innerHTML=O.sets.length?O.sets.map(r=>`<div class="oc"><div><b>${esc(r.title)}</b> <span class="tg b">${esc(r.subject)}</span>${r.vis=='friends'?' 👥':''}</div><span class="sm">${esc(r.author_name)} ・ ${String(r.created_at).slice(0,10)} ・ ❤${r.likes}</span><div class="orow">${pk?`<button class="go" data-a="pk" data-v="${r.id}">✔ これで対戦</button>`:`<button data-a="bplay" data-v="${r.id}">▶遊ぶ</button><button data-a="bbat" data-v="${r.id}">⚔対戦</button><button data-a="blike" data-v="${r.id}">${O.lk.has(r.id)?'❤':'🤍'}</button>${r.author_id==user.id?`<button data-a="bdel" data-v="${r.id}">🗑</button>`:''}`}</div></div>`).join(''):'<div class="slot">投稿がありません</div>'};
 $('vw').innerHTML='<div class="sm">読み込み中…</div>';
 let q=sb.from('qsets').select('id,author_id,author_name,title,subject,vis,likes,created_at').order(f.sort=='pop'?'likes':'created_at',{ascending:false}).limit(50);
 if(f.src=='mine')q=q.eq('author_id',user.id);else if(f.src=='public')q=q.eq('vis','public');
 else if(f.src=='friend'){const{data:fs}=await sb.from('friendships').select('*').eq('status','accepted');const ids=(fs||[]).map(x=>x.requester_id==user.id?x.addressee_id:x.requester_id);if(!ids.length){O.sets=[];return draw()}q=q.in('author_id',ids)}
 const s=f.q.replace(/[,()%*\\]/g,'').trim();if(s)q=q.or(`title.ilike.%${s}%,author_name.ilike.%${s}%`);
 const[{data,error},{data:lk}]=await Promise.all([q,sb.from('qlikes').select('set_id')]);if(error){$('vw').innerHTML=`<div class="sm" style="color:#c22">${esc(error.message)}</div>`;return}
 O.sets=data||[];O.lk=new Set((lk||[]).map(x=>x.set_id));draw()}
/* ---- 1人で遊ぶ(履歴・図鑑なし) ---- */
async function solo(items,title,back){O.v='solo';let me=2000,en=2000,sur=false;O.mySur=false;$B().innerHTML='<div id="phd"></div><div id="opq" class="oc"></div><button data-a="sur" style="background:#f5d0d0">🏳 降参</button>';
 const hd=i=>$('phd').innerHTML=`<div class="sm">${esc(title)} 第${i+1}問 / ${items.length}</div>`+bar(S.name||'あなた',me,2000)+bar('相手',en,2000);
 for(let i=0;i<items.length&&me>0&&en>0;i++){hd(i);const it=items[i],box=$('opq'),r=await ask(box,it,it.time|0);if(r===null){sur=true;break}
  const d=it.dmg||400;if(r){en-=d;SE.ok();SE.hit()}else{me-=d;SE.ng()}hd(i);box.innerHTML=`<div class="res ${r?'g':'r'}">${r?'⭕ 正解! '+d+'ダメージ':'❌ 不正解… '+d+'ダメージをうけた'}</div>${exp(it)}<button id="onx">次へ ▶</button>`;await wait($('onx'));if(O.mySur){sur=true;break}}
 const res=sur?'lose':me>en?'win':me<en?'lose':'draw';O.v='sres';res=='win'?SE.win():SE.lose();
 $B().innerHTML=`<div class="rc ${res=='lose'?'lose':''}"><h2>${res=='win'?'🏆 勝ち!':res=='lose'?'💧 負け…':'🤝 引き分け'}</h2><div class="sm">履歴・図鑑には記録されません</div></div><button class="big go" data-a="sagain">🔁 もう一度</button><button class="big" data-a="sback">もどる</button>`;O.again=()=>solo(items,title,back);O.sback=back}
/* ---- レベル報酬ロード(トロフィーロード風) ---- */
const flv=()=>{const L=lvl();return L+(S.exp-cum(L))/need(L)};
const MS=(()=>{const a=[];for(let m=2;m<=15;m++)a.push(m);for(let t=155;t<=170;t+=5)a.push(t/10);for(let t=172;t<=400;t+=2)a.push(t/10);return a})();
const stp=m=>m<=15?1:m<=17?.5:.2,rw=m=>({coin:10*Math.max(10,Math.round(m*stp(m)*10)*10),jewel:10*Math.max(10,Math.round(m*stp(m)*2)*10),skin:Number.isInteger(m)&&m%10==0});
const got_=m=>(S.lr||[]).includes(String(m)),pend=()=>MS.filter(m=>m<=flv()+1e-9&&!got_(m));
const RD=document.createElement('div');RD.id='rd';RD.innerHTML='<div id="rdt"><button id="rdb">◀</button><div class="rtl"><b>レベル報酬ロード</b><small>プロフィール</small></div><div id="rdl"></div></div><div id="rds"><div id="rdk"></div></div><button id="rda"></button><div id="rdn"></div>';document.body.appendChild(RD);
function renderRoad(keep){if(!Array.isArray(S.lr))S.lr=[];const cur=flv(),LV=[1,...MS],sc=$('rds'),sx=sc.scrollLeft;let si=0;LV.forEach((v,i)=>{if(v<=cur+1e-9)si=i});
 const f=si<LV.length-1?(cur-LV[si])/(LV[si+1]-LV[si]):1,half=(i,side)=>{ // side 'r' = i→i+1 の前半, 'l' = i の手前(i-1→i)の後半
  if(side=='r'){if(i<si)return 100;if(i>si)return 0;return Math.min(1,f*2)*100}if(i<=si)return 100;if(i-1<si)return 0;if(i-1==si)return Math.max(0,f-.5)*200;return 0};
 const bg=p=>`background:linear-gradient(90deg,#ffd23a ${p}%,#f0a020 ${p}%)`;
 let h=`<div class="rn"><div class="rb"><canvas id="rav" width="64" height="64"></canvas></div><div class="rp"><i style="${bg(0)};opacity:0"></i><i style="${bg(half(0,'r'))}"></i><span class="pad">I</span></div><div class="rlv">Lv1</div></div>`;
 MS.forEach((m,k)=>{const i=k+1,r=rw(m),g=got_(m),can=!g&&m<=cur+1e-9,st=g?'done':can?'can':'lock';
  h+=`<div class="rn ${st}" data-m="${m}"><div class="rb ${r.skin?'sk':''}">${r.skin?'<div class="big">🎭</div>':''}<span>💰${r.coin}</span><span>💎${r.jewel}</span></div><div class="rp"><i style="${bg(half(i,'l'))}"></i><i style="${bg(half(i,'r'))}"></i><span class="pad">${g?'✔':can?'🎁':'🔒'}</span></div><div class="rlv">Lv${m}</div></div>`});
 $('rdk').innerHTML=h;const pn=pend();const a=$('rda');a.style.display=pn.length?'block':'none';a.textContent='🎁 まとめて受け取る ×'+pn.length;
 const L0=lvl(),p0=(cur-L0)*100;$('rdl').innerHTML=`<b>Lv.${cur.toFixed(2)}</b><div class="bar"><i style="width:${p0}%;background:#3c6"></i></div>`;
 let nv='';for(let l=1;l<=40;l++)nv+=`<span class="bd ${l<=L0?'on':''} ${l==L0?'cur':''}" data-l="${l}">${l}</span>`;$('rdn').innerHTML=nv;
 ready.then(()=>{const c=$('rav');if(c)spr(c,AIMG,0,256*S.av+128)});
 if(keep)sc.scrollLeft=sx;else{const t=RD.querySelector('.rn.can')||RD.querySelector(`.rn[data-m="${MS[Math.max(0,si-1)]}"]`);if(t)sc.scrollLeft=Math.max(0,t.offsetLeft-sc.clientWidth/2+55)}}
function openRoad(){RD.style.display='flex';renderRoad(false)}
window.openRoad=openRoad;
$('rdb').onclick=()=>{RD.style.display='none'};
$('rdn').onclick=e=>{const l=+(e.target.dataset||{}).l;if(!l)return;const sc=$('rds');if(l==1){sc.scrollTo({left:0,behavior:'smooth'});return}const t=RD.querySelector(`.rn[data-m="${l}"]`);if(t)sc.scrollTo({left:t.offsetLeft-sc.clientWidth/2+55,behavior:'smooth'})};
$('rdk').onclick=e=>{const n=e.target.closest('.rn');if(!n)return;if(n.classList.contains('can'))return claim([+n.dataset.m]);if(n.dataset.m){const r=rw(+n.dataset.m);toast(n.classList.contains('done')?'受け取り済み':`Lv.${n.dataset.m} で解放: 💰${r.coin} 💎${r.jewel}${r.skin?' 🎭新スキン':''}`)}};
$('rda').onclick=()=>claim(pend());
async function claim(p){if(!p.length)return;let coin=0,jw=0;const skins=[],own=ownSet();
 p.forEach(m=>{const r=rw(m);coin+=r.coin;jw+=r.jewel;if(r.skin){const left=[...Array(12).keys()].filter(i=>!own.includes(i)&&!skins.includes(i));if(left.length)skins.push(left[Math.random()*left.length|0]);else jw+=500}});
 let ok=false;if(sb&&user&&coin>0){const{data,error}=await sb.rpc('finish_battle',{result:'draw',xp:0,lv:lvl(),gain:coin});if(!error&&data&&data[0]){S.coin=data[0].coin;S.exp=data[0].exp;ok=true}}
 if(!ok){S.coin+=coin;if(sb&&user)S.pend=(S.pend||[]).concat({result:'draw',xp:0,gain:coin})}
 S.jewel=(S.jewel||0)+jw;skins.forEach(i=>own.push(i));S.lr=[...(S.lr||[]),...p.map(String)];await persist(true);hud();SE.win();renderRoad(true);
 openModal(H('🎁','報酬'),'');const mb=$('mbody');mb.innerHTML=`<div class="rc"><h2>🎁 報酬ゲット!</h2><div>💰 コイン <b>+${coin}</b></div><div>💎 ジュエル <b>+${jw}</b></div>${skins.length?`<div>🎭 新スキン ×${skins.length}</div>`:''}</div><button class="big go" id="rk">${skins.length?'スキンを見る ▶':'とじる'}</button>`;
 await new Promise(r=>$('rk').onclick=r);
 for(const i of skins){mb.innerHTML='<div style="font-size:46px;text-align:center">🎰</div><div class="sm" style="text-align:center">まわしています…</div>';await sleep(900);
  mb.innerHTML=`<div style="text-align:center"><canvas id="gc" width="64" height="64" style="width:96px;image-rendering:pixelated;background:#bfe3ff;border-radius:10px;border:3px solid #f3d27a"></canvas><div><b>🎉 NEW! スキン No.${i+1} をゲット!</b></div></div><button onclick="S.av=${i};persist(true);toast('アバターを変更しました')">着替える</button><button class="big go" id="rk">つぎへ ▶</button>`;
  spr($('gc'),AIMG,0,256*i+128);SE.win();await new Promise(r=>$('rk').onclick=r)}
 closeModal();renderRoad(true)}
const _hud=window.hud;window.hud=function(){_hud();try{if(Array.isArray(S.lr)||true){if(pend().length)$('hud').innerHTML+=' 🎁'}}catch(e){}};
/* ---- 操作 ---- */
const A={nav:d=>{O.v=d.dataset.v;render()},who:d=>{O.d.who=d.dataset.v;O.v='create';render()},ctab:0,mode:d=>{O.d.mode=d.dataset.v;render()},rnd:()=>{O.d.pw=String(Math.random()*1e6|0).padStart(6,'0');render()},
 blv:d=>{O.d.lv=+d.dataset.v;render()},fast:d=>{O.d.fast=d.dataset.v=='1';render()},src:d=>{O.d.src=d.dataset.v;render()},topick:()=>{O.v='pick';render()},
 pk:d=>{const r=O.sets.find(x=>x.id==d.dataset.v);O.d.src='set';O.d.setId=r.id;O.d.setTitle=r.title;O.v='create';render()},
 tg:d=>{const f=d.dataset.f,v=f=='stars'?+d.dataset.v.slice(1):d.dataset.v,a=O.d[f],i=a.indexOf(v);i<0?a.push(v):a.splice(i,1);render()},
 mk:mkRoom,join:d=>joinRoom(d.dataset.v,d.dataset.l),start,toset:()=>{const h=O.role=='h'||O.bot;leave();O.v=h?'create':'hub';render()},
 again:()=>{if(O.bot){buildQs(O.s).then(q=>q.length?runBot(q):toast('問題がありません'));return}O.v='room';render()},
 sur:q=>{if(q!==1&&!confirm('降参しますか?'))return;if(O.v=='play'||O.v=='solo'){O.mySur=true;if(O.room)send('sur',1);flush();O.botEnd&&O.botEnd();O.cancel&&O.cancel();const n=$('onx');if(n)n.click()}},
 mtab:d=>{O.mt=d.dataset.v;render()},qadd:()=>{if(O.m.qs.length<30){O.m.qs.push(mkq());O.dt['q'+(O.m.qs.length-1)]=1;render()}},qdel:d=>{if(O.m.qs.length>1&&confirm('この問題を削除しますか?')){O.m.qs.splice(+d.dataset.v,1);render()}},
 qall:d=>{const v=Math.max(0,+$(d.dataset.v=='dmg'?'gdm':'gtm').value|0);O.m.qs.forEach(x=>x[d.dataset.v]=v);render();toast('全問に反映しました')},qclr:d=>{setP(O,d.dataset.v,'');render()},
 qtry:()=>{const e=chkSet();if(e)return toast(e);solo(clean(),O.m.title,()=>{O.v='make';render()})},qpub:pub,
 bsrc:d=>{O.f.src=d.dataset.v;loadSets()},bsort:d=>{O.f.sort=d.dataset.v;loadSets()},bs:()=>{O.f.q=$('bq').value;loadSets()},
 bplay:async d=>{const{data,error}=await sb.from('qsets').select('items,title').eq('id',d.dataset.v).single();if(error)return toast(error.message);solo(data.items,data.title,()=>{O.v='make';O.mt='view';render()})},
 bbat:d=>{const r=O.sets.find(x=>x.id==d.dataset.v);O.d.src='set';O.d.setId=r.id;O.d.setTitle=r.title;O.d.who='h';O.v='create';render()},
 blike:async d=>{const{data,error}=await sb.rpc('toggle_like',{p_id:d.dataset.v});if(error)return toast(error.message);data.liked?O.lk.add(d.dataset.v):O.lk.delete(d.dataset.v);loadSets()},
 bdel:async d=>{if(!confirm('この投稿を削除しますか?'))return;const{error}=await sb.from('qsets').delete().eq('id',d.dataset.v);if(error)return toast(error.message);loadSets()},
 sagain:()=>O.again(),sback:()=>O.sback()};
const L=$('ol');L.innerHTML='<div id="oh"><button id="obk">← 閉じる</button><b id="ott"></b></div><div id="ob"></div><div id="of"></div>';
$('obk').onclick=back;
L.addEventListener('click',e=>{const d=e.target.closest('[data-a]');if(d&&A[d.dataset.a]){SE.click&&SE.click();A[d.dataset.a](d)}});
L.addEventListener('input',e=>{const t=e.target,p=t.dataset.p;if(!p)return;if(t.type=='radio'&&!t.checked)return;let v=t.value;if(t.dataset.n)v=+v;setP(O,p,v);if(t.dataset.r){const q=O.m.qs[+p.split('.')[2]];if(q.t=='c2')q.c.length=2;else if(q.t=='c4')while(q.c.length<4)q.c.push('');if(q.k>=q.c.length)q.k=0;render()}});
L.addEventListener('change',e=>{if(e.target.dataset.file)onFile(e.target)});
L.addEventListener('toggle',e=>{const k=e.target.dataset&&e.target.dataset.d;if(k)O.dt[k]=e.target.open},true);
})();
